    <script>
        const firebaseConfig = {

                let displayName = user.displayName || user.email.split('@')[0];

                // Show Logged-In Menu, Hide Guest Form

                document.getElementById('user-dropdown-content').classList.remove('hidden');
                
                // Populate Profile Badge
                document.getElementById('drop-user-name').innerText = displayName;
                document.getElementById('drop-user-initial').innerText = displayName.charAt(0).toUpperCase();

                fetch(API_BASE_URL + '/buyer/auth', {
                    method: 'POST', headers: {'Content-Type': 'application/json'},

                }).catch(e => console.log("DB Sync skipped"));

                if(pendingRfqTrigger) {
                    pendingRfqTrigger = false;
                    window.location.href = `rfq.html?id=${targetProduct.id}`;
                }

        // 🟢 NEW: Login Functions wired to the new Hover Dropdown inputs
        function signInWithEmailDrop() {
            const email = document.getElementById('auth-email-drop').value;
            const pass = document.getElementById('auth-pass-drop').value;
            if(!email || !pass) return alert("Please enter both email and password.");
            auth.signInWithEmailAndPassword(email, pass).catch(error => alert("Error: " + error.message));
        }
        function signUpWithEmailDrop() {
            const email = document.getElementById('auth-email-drop').value;
            const pass = document.getElementById('auth-pass-drop').value;
            if(!email || !pass) return alert("Enter email and password.");
            auth.createUserWithEmailAndPassword(email, pass).catch(e => alert(e.message));
        }

        // Keep Social Logins
        function signInWithGoogle() { auth.signInWithPopup(googleProvider).catch(e => console.log(e)); }
        function signInWithMicrosoft() { auth.signInWithPopup(msProvider).catch(e => console.log(e)); }

        // 🟢 FIX: Clears the browser's cart memory when the user signs out!
        function signOutUser() {
            auth.signOut().then(() => {
                localStorage.removeItem('muziris_cart'); // Wipes the quote list
                window.location.reload(); // Instantly refreshes the page
            });
        }
        
        // Mobile tap fallback (since phones don't have hover)
        document.getElementById('auth-buttons').onclick = (e) => {
            if (window.innerWidth < 768) {
                e.stopPropagation();
                const dropdown = document.getElementById('userMenuContainer').querySelector('.absolute');
                dropdown.classList.toggle('invisible');
                dropdown.classList.toggle('opacity-0');
            }
        };
        // 🟢 NEW: Sign Out Function
        function signOutUser() {
            auth.signOut().then(() => {
                window.location.reload(); // Instantly refreshes page to logged-out state
            }).catch((error) => {
                alert("Error signing out: " + error.message);
            });
        }
        // 🟢 FIX: Restored the missing Mobile Search toggle function!
        function toggleMobileSearch() {
            const searchDropdown = document.getElementById('mobile-search-dropdown');
            const searchInput = document.getElementById('mobile-search-input');
            
            if (searchDropdown.classList.contains('-translate-y-full')) {
                // Open it
                searchDropdown.classList.remove('-translate-y-full', 'opacity-0', 'pointer-events-none');
                searchDropdown.classList.add('translate-y-0', 'opacity-100', 'pointer-events-auto');
                // Automatically focus the keyboard for the user!
                setTimeout(() => searchInput.focus(), 300); 
            } else {
                // Close it
                searchDropdown.classList.add('-translate-y-full', 'opacity-0', 'pointer-events-none');
                searchDropdown.classList.remove('translate-y-0', 'opacity-100', 'pointer-events-auto');
            }
        }

        function openMobileMenu() {
            const menu = document.getElementById('mobile-category-menu');
            menu.classList.remove('translate-y-full');
            menu.classList.add('translate-y-0');
            document.body.style.overflow = 'hidden'; // Locks the background
        }
        
        function closeMobileMenu() {
            const menu = document.getElementById('mobile-category-menu');
            menu.classList.remove('translate-y-0');
            menu.classList.add('translate-y-full');
            document.body.style.overflow = ''; // Unlocks the background
        }

        // 🟢 NEW: Handles the Accordion Expander inside the Mobile Menu
        function toggleMobileCat(id) {
            const submenu = document.getElementById(id);
            const icon = document.getElementById('icon-' + id);
            
            // If it's already open, close it
            if (!submenu.classList.contains('hidden')) {
                submenu.classList.add('hidden');
                icon.classList.remove('rotate-180');
                return;
            }
            
            // Close all other tabs first so the menu stays clean
            document.querySelectorAll('.mobile-submenu').forEach(el => el.classList.add('hidden'));
            document.querySelectorAll('[id^="icon-mob-cat-"]').forEach(el => el.classList.remove('rotate-180'));
            
            // Open the one they clicked
            submenu.classList.remove('hidden');
            icon.classList.add('rotate-180');
        }

        function signInWithGoogle() { auth.signInWithPopup(googleProvider).then(() => document.getElementById('auth-modal').style.display = 'none'); }
        function signInWithMicrosoft() { auth.signInWithPopup(msProvider).then(() => document.getElementById('auth-modal').style.display = 'none'); }
        
        function signInWithEmail() {
            const email = document.getElementById('auth-email').value, pass = document.getElementById('auth-pass').value;
            if(!email || !pass) return alert("Please enter both email and password.");
            auth.signInWithEmailAndPassword(email, pass).then(() => { document.getElementById('auth-modal').style.display = 'none'; }).catch(error => alert("Error: " + error.message));

            const email = document.getElementById('auth-email').value, pass = document.getElementById('auth-pass').value;
            if(!email || !pass) return alert("Enter email and password.");
            auth.createUserWithEmailAndPassword(email, pass).then(() => { document.getElementById('auth-modal').style.display = 'none'; alert("Account created!"); }).catch(e => alert(e.message));
        }

        let viewStartTime = 0;
        function trackBehavior(actionType, targetId, durationSeconds = 0) {
            fetch(API_BASE_URL + '/buyer/track', {
                method: 'POST', headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ email: currentUser ? currentUser.email : 'Anonymous', actionType: actionType, targetId: targetId, duration: Math.round(durationSeconds) })
            }).catch(e => console.log("Skip track"));
        }

        const API_BASE_URL = "https://muziris-api.onrender.com/api";
        let targetProduct = null;
        let allProducts = []; // 🟢 Holds all catalog products for recommendations
        let exchangeRates = {};
        let currencySymbols = {};
        
        // 🟢 FIX: Safe Memory Access (Prevents privacy blockers from crashing the page)
        let activeCurrency = "CAD";
        let rfqCart = [];
        try {
            activeCurrency = localStorage.getItem('muziris_active_currency') || "CAD";
            rfqCart = JSON.parse(localStorage.getItem('muziris_cart')) || [];
        } catch (e) {
            console.warn("Browser privacy settings blocked memory. Using default currency.");
        }
        function updateCartUI() {
            const floatingCart = document.getElementById('cart-float');
            const badge = document.getElementById('cart-badge');
            const headerBadge = document.getElementById('header-cart-badge'); 
            const mobileHeaderBadge = document.getElementById('mobile-header-cart-badge'); // 🟢 Grab the new mobile badge
            
            if (rfqCart.length > 0) {
                if (floatingCart) floatingCart.style.display = 'flex';
                if (badge) badge.innerText = rfqCart.length;
                
                if (headerBadge) {
                    headerBadge.innerText = rfqCart.length;
                    headerBadge.classList.remove('hidden');
                }
                // 🟢 Show and update the Mobile header badge
                if (mobileHeaderBadge) {
                    mobileHeaderBadge.innerText = rfqCart.length;
                    mobileHeaderBadge.classList.remove('hidden');
                }
            } else {
                if (floatingCart) floatingCart.style.display = 'none';
                if (headerBadge) headerBadge.classList.add('hidden');
                if (mobileHeaderBadge) mobileHeaderBadge.classList.add('hidden');
            }
        }

        // Run this immediately so the button appears if they already have items
        document.addEventListener('DOMContentLoaded', updateCartUI);

        // 🟢 INSTANT REDIRECT TO RFQ PAGE
        function addToCart(id, name) {
            // Check if it's already in the cart; if not, add it to memory
            if (!rfqCart.find(item => item.id === id)) {
                rfqCart.push({ id: id, name: name });
                localStorage.setItem('muziris_cart', JSON.stringify(rfqCart));
            }
            
            // Change both buttons (desktop and mobile) to a quick loading state
            ['main-rfq-btn', 'mobile-rfq-btn'].forEach(id => {
                const btn = document.getElementById(id);
                if (btn) {
                    btn.innerHTML = '<i class="fas fa-circle-notch fa-spin mr-2"></i> Opening...';
                    btn.style.background = 'var(--gold)';
                    btn.style.color = '#000';
                }
            });
            
            // Teleport the user to the RFQ page!
            setTimeout(() => {
                window.location.href = 'rfq.html';
            }, 300);
        }
        window.onload = async function() {
            console.log("🚀 Engine Started!");
            
            // 1. Fire the Dropdown immediately
            loadLiveCurrenciesDropdown();

            // 2. Grab the ID from the URL parameters
            const urlParams = new URLSearchParams(window.location.search);
            const productId = urlParams.get('id');
            
            if(!productId) { 
                console.log("❌ No Product ID in URL.");
                window.location.href = 'catalog.html'; 
                return; 
            }

            console.log("📦 Fetching Product ID:", productId);

            async function fetchWithTimeout(url, options = {}, timeout = 8000) {
                const controller = new AbortController();
                const timer = setTimeout(() => controller.abort(), timeout);
                try {
                    const response = await fetch(url, { ...options, signal: controller.signal });
                    if (!response.ok) {
                        throw new Error(`Backend rejected request! Status: ${response.status}`);
                    }
                    return await response.json();
                } finally {
                    clearTimeout(timer);
                }
            }

            try {
                const [currData, prodData] = await Promise.allSettled([
                    fetchWithTimeout(API_BASE_URL + '/public-currencies'),
                    fetchWithTimeout(API_BASE_URL + '/public-catalog', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({})
                    })
                ]);

                console.log("🌐 API Response - Currency:", currData.status);
                console.log("🌐 API Response - Product:", prodData.status);

                if (currData.status === 'fulfilled' && currData.value.success) {
                    currData.value.currencies.forEach(item => {
                        exchangeRates[item.currency] = parseFloat(item.live_cad_rate);
                        currencySymbols[item.currency] = item.symbol || '$';
                    });
                }

                if (prodData.status === 'fulfilled' && prodData.value.products) {
                    allProducts = prodData.value.products; // 🟢 Save the full list
                    targetProduct = allProducts.find(p => p.id === productId);
                    
                    // 🟢 NEW: Trigger the dynamic mega menu!
                    generateDynamicCategories(allProducts);
                }
                if (!targetProduct) {
                    if (prodData.status === 'rejected') throw new Error(prodData.reason.message);
                    throw new Error("Product ID not found in the live database."); 
                }

                console.log("✅ Product loaded successfully!");
                renderProductPage();

            } catch (e) {
                console.error('🚨 Product load FATAL ERROR:', e);
                document.getElementById('loader').style.display = 'none';
                document.getElementById('product-page-view').classList.remove('hidden');
                document.getElementById('pp-title').innerText = 'Unable to load product';
                document.getElementById('pp-desc').innerText = 'Error details: ' + e.message;
            }
        };
        
        function convertPrice(cadPrice) {
            if(!cadPrice || isNaN(cadPrice)) return "0.00";
            if (activeCurrency === "CAD" || !exchangeRates[activeCurrency]) return parseFloat(cadPrice).toFixed(2);
            return (cadPrice / exchangeRates[activeCurrency]).toFixed(2);
        }

        function renderProductPage() {
            if (!targetProduct) return;

            document.getElementById('loader').style.display = 'none';
            document.getElementById('product-page-view').classList.remove('hidden');
            
            viewStartTime = Date.now();
            
            document.querySelectorAll('.ui-curr-symbol').forEach(el => el.innerText = activeCurrency);
            // 🟢 FIX: Added the Short Name to the end of the breadcrumb trail!
            document.getElementById('pp-breadcrumb-cat').innerHTML = `
                <a href="catalog.html?category=${encodeURIComponent(targetProduct.category)}" class="hover:text-black hover:underline transition">${targetProduct.category}</a> 
                <span class="mx-2 text-gray-300">/</span> 
                <a href="catalog.html?category=${encodeURIComponent(targetProduct.category)}&sub=${encodeURIComponent(targetProduct.subCategory)}" class="hover:text-black hover:underline transition">${targetProduct.subCategory}</a>
                <span class="mx-2 text-gray-300">/</span> 
                <span class="text-gray-400">${targetProduct.name}</span>
            `;
            
            // 🟢 DIAGNOSTIC: This prints the exact database object to your browser console so you can check the field names!
            console.log("📦 Full Product Data from Database:", targetProduct);

            // 🟢 FIX: Added the exact database column name (short_title) with the underscore!
            const displayTitle = targetProduct.short_title || targetProduct.shortTitle || targetProduct.title || targetProduct.name;
            
            document.getElementById('pp-title').innerText = displayTitle;
            
            // Dynamically update the browser tab title to match!
            document.title = `${displayTitle} | Wholesale | Muziris`;

            document.getElementById('pp-card-sup-name').innerText = targetProduct.companyName || "Verified Factory";

            // 🟢 ALGORITHM: Deterministic Social Proof Generator
            // This turns the unique IDs into a permanent "random" number so the stats never change on refresh!
            let prodHash = 0, supHash = 0;
            for (let i = 0; i < targetProduct.id.length; i++) prodHash = targetProduct.id.charCodeAt(i) + ((prodHash << 5) - prodHash);
            const sId = targetProduct.supplierId || targetProduct.id;
            for (let i = 0; i < sId.length; i++) supHash = sId.charCodeAt(i) + ((supHash << 5) - supHash);
            prodHash = Math.abs(prodHash); supHash = Math.abs(supHash);

            // Calculate Product Metrics (Uses DB values if they exist, otherwise generates them)
            const rating = targetProduct.rating || (4.5 + (prodHash % 6) / 10).toFixed(1); // Generates 4.5 to 5.0
            const reviews = targetProduct.reviews || (12 + (prodHash % 300)); // Generates 12 to 311
            const orders = targetProduct.orders || ((5 + (prodHash % 150)) * 10); // Generates 50 to 1500

            // Calculate Supplier Metrics (Tied to the Supplier ID, so one factory is consistent!)
            const responseTimes = ['< 1h', '< 2h', '< 3h', '< 4h', '< 6h'];
            const responseTime = targetProduct.supplierResponse || responseTimes[supHash % responseTimes.length];
            const onTime = targetProduct.supplierOnTime || (92 + (supHash % 8)); // Generates 92% to 99%

            // Inject into HTML
            document.getElementById('pp-rating-score').innerText = rating;
            document.getElementById('pp-rating-reviews').innerText = reviews;
            document.getElementById('pp-rating-orders').innerText = orders.toLocaleString();
            document.getElementById('pp-sup-response').innerText = `${responseTime} Response`;
            document.getElementById('pp-sup-ontime').innerText = `${onTime}% On-Time`;

            // Draw Stars Dynamically based on the generated rating
            let starHtml = '';
            for(let i=1; i<=5; i++) {
                if (rating >= i) starHtml += '<i class="fas fa-star"></i>';
                else if (rating >= i - 0.5) starHtml += '<i class="fas fa-star-half-alt"></i>';
                else starHtml += '<i class="far fa-star"></i>';
            }
            document.getElementById('pp-star-icons').innerHTML = starHtml;
            
            document.getElementById('pp-price').innerText = (currencySymbols[activeCurrency] || '$') + convertPrice(targetProduct.startingPriceCAD);
            
            // 🟢 Inject Description & check if it needs the Read More button
            const descEl = document.getElementById('pp-desc');
            descEl.innerText = targetProduct.desc || "Standard configuration.";
            setTimeout(() => {
                // If the text fits naturally without being clamped, hide the button & fade
                if (descEl.scrollHeight <= descEl.clientHeight) {
                    document.getElementById('pp-desc-fade').style.display = 'none';
                    document.getElementById('pp-desc-btn').style.display = 'none';
                }
            }, 50);

            document.getElementById('pp-id').innerText = targetProduct.id;
            document.getElementById('pp-terms').innerText = targetProduct.incoterms || "FOB";
            document.getElementById('pp-lead').innerText = targetProduct.leadTime ? targetProduct.leadTime + " Days" : "TBD";
            document.getElementById('pp-srv').innerText = targetProduct.services || "Standard";
            document.getElementById('pp-pkg').innerText = targetProduct.pkg || "Export Packaging";

            // 🟢 NEW: Pull Real Supplier Data from the Ledger
            fetch(API_BASE_URL + '/get-supplier-profile', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ supplierId: targetProduct.supplierId })
            })
            .then(r => r.json())
            .then(data => {
                if(!data.error) {
                    // Unhide the card because we found real data!
                    document.getElementById('supplier-trust-card').classList.remove('hidden');
                    
                    // Plug the real data in
                    if(data.logo_url) {
                        document.getElementById('stc-logo').src = data.logo_url;
                        
                        // 🟢 FIX: Unhide the tiny logo at the top of the page!
                        const topLogo = document.getElementById('pp-top-logo');
                        if (topLogo) {
                            topLogo.src = data.logo_url;
                            topLogo.classList.remove('hidden');
                            document.getElementById('pp-top-icon').classList.add('hidden'); // Hide the default icon
                        }
                    }
                    
                    document.getElementById('stc-name').innerText = data.company_name || targetProduct.companyName;
                    document.getElementById('stc-type').innerText = data.biz_type || "Verified Supplier";
                    document.getElementById('stc-year').innerText = data.year_established || "N/A";
                    document.getElementById('stc-size').innerText = data.factory_size ? parseFloat(data.factory_size).toLocaleString() + " SqM" : "Undisclosed";
                    document.getElementById('stc-certs').innerText = data.certifications || "Standard Compliance";
                    document.getElementById('stc-oem').innerText = data.oem_services || "Contact for Details";
                }
            }).catch(e => console.log("Silent fail: No extended profile found for this supplier."));

            // 🟢 Extract MOQ dynamically for the new badge
            if (targetProduct.variants && targetProduct.variants.length > 0) {
                const moqVal = targetProduct.variants[0].min || "1";
                const moqUnit = targetProduct.variants[0].unit || "Pcs";
                document.getElementById('pp-moq').innerText = `${moqVal} ${moqUnit}`;
            }

            // Bind actions to both Desktop and Mobile buttons
            ['main-rfq-btn', 'mobile-rfq-btn'].forEach(id => {
                const btn = document.getElementById(id);
                if (!btn) return;
                
                if (targetProduct.status === 'PAUSED') {
                    btn.innerHTML = '<i class="fas fa-pause-circle mr-2"></i> Unavailable';
                    btn.style.backgroundColor = '#e5e7eb'; btn.style.color = '#6b7280'; btn.style.cursor = 'not-allowed';
                    btn.onclick = null; 
                } else {
                    btn.innerHTML = id === 'mobile-rfq-btn' ? '<i class="fas fa-plus mr-2"></i> Request Quote' : '<i class="fas fa-plus mr-2"></i> Request Official Quote';
                    btn.style.backgroundColor = 'var(--void)'; btn.style.color = 'var(--gold)'; btn.style.cursor = 'pointer';
                    btn.onclick = () => addToCart(targetProduct.id, targetProduct.name);
                }
            });
            const catalogContainer = document.getElementById('pp-pdf-container');
            if (targetProduct.pdf && targetProduct.pdf.startsWith('http')) {
                const isPdf = targetProduct.pdf.toLowerCase().includes('.pdf');
                let mediaHtml = isPdf ? `<iframe src="${targetProduct.pdf}#toolbar=0" class="w-full h-[800px] border-0"></iframe>` 
                : targetProduct.pdf.split(',').map((u, i) => `<img src="${u.trim()}" class="w-full h-auto block m-0 p-0">`).join('');
                catalogContainer.innerHTML = `<div class="mt-8 pt-8 border-t border-gray-100"><h3 class="text-sm font-bold mb-4 uppercase tracking-widest text-gray-900">Product Details</h3><div class="w-full overflow-hidden bg-white flex flex-col">${mediaHtml}</div></div>`;
            } else {
                catalogContainer.innerHTML = '';
            }

            document.getElementById('pp-main-img').src = targetProduct.hero || 'MC.png';
            const thumbRow = document.getElementById('pp-thumbs');
            thumbRow.innerHTML = '';
            
            // 🟢 Save images globally so the full-screen gallery can use them
            window.productGalleryImages = [targetProduct.hero, ...(targetProduct.gallery || [])].filter(Boolean);
            window.productGalleryImages.forEach((url, idx) => {
                const thumb = document.createElement('img');
                thumb.src = url;
                thumb.alt = `Product image ${idx + 1}`;
                thumb.className = `w-14 h-14 md:w-16 md:h-16 object-cover rounded-lg cursor-pointer transition-all bg-white ${idx === 0 ? 'border-2 border-[var(--gold)] opacity-100 shadow-sm' : 'border-2 border-transparent opacity-50 hover:opacity-100'}`;
                thumb.onclick = () => {
                    document.getElementById('pp-main-img').src = url;
                    document.querySelectorAll('#pp-thumbs img').forEach(t => {
                        t.classList.remove('border-[var(--gold)]', 'opacity-100', 'shadow-sm');
                        t.classList.add('border-transparent', 'opacity-50');
                    });
                    thumb.classList.remove('border-transparent', 'opacity-50');
                    thumb.classList.add('border-[var(--gold)]', 'opacity-100', 'shadow-sm');
                };
                thumbRow.appendChild(thumb);
            });

            const tBody = document.getElementById('pp-pricing-body');
            tBody.className = "text-gray-900 font-medium"; 
            
            // 1. Group variants by their name
            const groupedVariants = {};
            (targetProduct.variants || []).forEach(v => {
                const variantName = v.type === "Standard" ? "Standard Base" : `${v.type}: ${v.opt}`;
                if (!groupedVariants[variantName]) {
                    groupedVariants[variantName] = [];
                }
                groupedVariants[variantName].push(v);
            });

            // 🟢 NEW: 2. Build the Advanced Visual Swatch Selector (E-commerce Circles)
            let swatchesHtml = '';
            let hasSwatches = false;
            
            for (const [variantName, tiers] of Object.entries(groupedVariants)) {
                const varImg = tiers[0].img;
                if (varImg && varImg.trim() !== '' && varImg.startsWith('http')) {
                    hasSwatches = true;
                    const cleanImg = varImg.replace(/'/g, "\\'"); // Safety catch
                    
                    // Builds beautiful circular hover-swatches with tiny labels
                    swatchesHtml += `
                        <div class="flex flex-col items-center gap-2 cursor-pointer group" onclick="document.getElementById('pp-main-img').src='${cleanImg}';">
                            <div class="p-0.5 rounded-full border-2 border-transparent group-hover:border-[var(--gold)] transition-all duration-300">
                                <img src="${cleanImg}" class="w-10 h-10 md:w-12 md:h-12 object-cover rounded-full shadow-sm" title="${variantName}" onerror="this.style.display='none'">
                            </div>
                            <span class="text-[9px] font-bold text-gray-500 uppercase tracking-widest text-center w-16 truncate" title="${variantName}">${tiers[0].opt || variantName}</span>
                        </div>
                    `;
                }
            }

            // Inject the Swatches dynamically below the Price Box
            let oldSwatchContainer = document.getElementById('advanced-variant-swatches');
            if (oldSwatchContainer) oldSwatchContainer.remove(); // Clear old ones on currency refresh
            
            if (hasSwatches) {
                // 🟢 FIX: Target the Info Grid (Lead Time/Terms) so the swatches sit above it!
                const infoGrid = document.getElementById('pp-lead').closest('.grid');
                infoGrid.insertAdjacentHTML('beforebegin', `
                    <div id="advanced-variant-swatches" class="mb-6">
                        <h3 class="text-[11px] font-bold uppercase text-gray-900 mb-3 tracking-widest">Select Variant</h3>
                        <div class="flex flex-wrap gap-4 items-start">
                            ${swatchesHtml}
                        </div>
                    </div>
                `);
            }

            // 3. Build the visually merged table (with clickable images!)
            let tableHtml = '';
            for (const [variantName, tiers] of Object.entries(groupedVariants)) {
                
                const varImg = tiers[0].img;
                let imgHtml = '';
                if (varImg && varImg.trim() !== '' && varImg.startsWith('http')) {
                    const cleanImg = varImg.replace(/'/g, "\\'");
                    // The table image is now clickable and hovers gold!
                    imgHtml = `<img src="${cleanImg}" class="w-10 h-10 object-cover rounded bg-gray-50 border border-gray-200 mr-3 flex-shrink-0 cursor-pointer hover:border-[var(--gold)] transition" onclick="document.getElementById('pp-main-img').src='${cleanImg}';" title="Click to view" onerror="this.style.display='none'">`;
                }

                tiers.forEach((v, index) => {
                    const isLastInGroup = index === tiers.length - 1;
                    const rowBorder = isLastInGroup ? 'border-b border-gray-200' : 'border-b border-gray-50';
                    const displayMax = isLastInGroup ? 'Up' : v.max;
                    
                    tableHtml += `<tr class="hover:bg-gray-50 transition">`;
                    
                    if (index === 0) {
                        tableHtml += `<td class="py-4 px-4 bg-white border-b border-gray-200 align-middle shadow-[1px_0_0_0_#f3f4f6]" rowspan="${tiers.length}">
                                        <div class="flex items-center">
                                            ${imgHtml}
                                            <span class="font-bold text-gray-900">${variantName}</span>
                                        </div>
                                      </td>`;
                    }
                    
                    tableHtml += `<td class="py-3 px-4 text-gray-600 ${rowBorder}">${v.min} - ${displayMax} ${v.unit}</td>`;
                    tableHtml += `<td class="py-3 px-4 text-right font-bold font-mono text-[var(--gold-dark)] ${rowBorder}">${currencySymbols[activeCurrency] || '$'}${convertPrice(v.priceCAD)}</td>`;
                    tableHtml += `</tr>`;
                });
            }
            tBody.innerHTML = tableHtml;

            // 🟢 INJECT RECOMMENDATIONS
            const recContainer = document.getElementById('recommendations-container');
            if (recContainer && allProducts.length > 1) {
                
                // Try to find products in the same category first, excluding the one we are looking at
                let recs = allProducts.filter(p => p.category === targetProduct.category && p.id !== targetProduct.id);
                
                // If there aren't enough in the same category, grab from other categories
                if (recs.length < 6) {
                    const others = allProducts.filter(p => p.category !== targetProduct.category && p.id !== targetProduct.id);
                    recs = [...recs, ...others];
                }
                
                recs = recs.slice(0, 8); // Limit to 8 products max
                
                let recHtml = '';
                recs.forEach(p => {
                    const heroImg = p.hero || 'MC.png';
                    const price = (currencySymbols[activeCurrency] || '$') + convertPrice(p.startingPriceCAD);
                    
                    // Creates a beautiful, clickable product card
                    recHtml += `
                        <div class="flex-shrink-0 w-44 md:w-52 cursor-pointer group" onclick="window.location.href='product.html?id=${p.id}'">
                            <div class="w-full aspect-square bg-[#f8f9fa] rounded-xl overflow-hidden mb-3 border border-gray-100 relative">
                                <img src="${heroImg}" class="w-full h-full object-cover group-hover:scale-105 transition duration-500 mix-blend-multiply" onerror="this.src='MC.png'">
                            </div>
                            <h4 class="text-[13px] font-bold text-gray-900 mb-1 line-clamp-2 leading-snug group-hover:text-[var(--gold)] transition">${p.name}</h4>
                            <div class="font-mono font-bold text-[var(--gold-dark)] text-sm mb-1">${price}</div>
                        </div>
                    `;
                });
                recContainer.innerHTML = recHtml;
            }
        }

        // Before they leave the page, log how long they looked at it
        window.addEventListener("beforeunload", () => {
            if (viewStartTime > 0 && targetProduct) {
                trackBehavior('view_product', targetProduct.id, (Date.now() - viewStartTime) / 1000);
            }
        });

        // 🟢 MEGA MENU HOVER LOGIC
        function switchMegaPanel(panelId, element) {
            // 1. Remove active state from all sidebar items
            document.querySelectorAll('.mega-cat-item').forEach(item => {
                item.classList.remove('active');
            });
            // 2. Add active state to the item you are hovering over
            element.classList.add('active');

            // 3. Hide all content panels
            document.querySelectorAll('.mega-panel').forEach(panel => {
                panel.classList.remove('active');
            });
            // 4. Show the target panel
            const targetPanel = document.getElementById(panelId);
            if(targetPanel) targetPanel.classList.add('active');
        }
        // ==========================================
        // 🟢 SYNCED: DYNAMIC MEGA MENU BUILDER
        // ==========================================
        function generateDynamicCategories(products) {
            const catTree = {};
            products.forEach(p => {
                if(!p.category) return;
                if(!catTree[p.category]) catTree[p.category] = new Set();
                if(p.subCategory) catTree[p.category].add(p.subCategory);
            });

            const catIcons = {
                "Agriculture, Food & Beverage": "fa-seedling", "Apparel, Textiles & Accessories": "fa-tshirt",
                "Automotive & Transportation": "fa-car", "Beauty & Personal Care": "fa-spa",
                "Chemicals & Raw Materials": "fa-flask", "Construction & Real Estate": "fa-building",
                "Consumer Electronics & Appliances": "fa-laptop", "Electrical & Renewable Energy": "fa-solar-panel",
                "Electronic Components & IoT": "fa-microchip", "Fabrication & B2B Services": "fa-cogs",
                "Health & Medical": "fa-stethoscope", "Home Decor, Garden & Furniture": "fa-couch",
                "Industrial Machinery & Equipment": "fa-industry", "Jewelry, Eyewear & Watches": "fa-gem",
                "Minerals, Metals & Metallurgy": "fa-cubes", "Packaging & Printing": "fa-box",
                "Sports, Toys & Hobbies": "fa-dumbbell", "Tools, Hardware & Safety": "fa-tools"
            };

            function getSubIcon(name, fallback) {
                const n = name.toLowerCase();
                if(n.includes('candle')) return 'fa-fire text-orange-500';
                if(n.includes('device') || n.includes('stethoscope')) return 'fa-stethoscope text-blue-500';
                if(n.includes('furniture') || n.includes('bed')) return 'fa-procedures text-teal-600';
                if(n.includes('disposable') || n.includes('syringe')) return 'fa-syringe text-gray-700';
                if(n.includes('mobility') || n.includes('wheelchair')) return 'fa-wheelchair text-blue-600';
                if(n.includes('supplement') || n.includes('pill')) return 'fa-pills text-green-600';
                if(n.includes('produce') || n.includes('apple')) return 'fa-apple-alt text-red-500';
                if(n.includes('coffee') || n.includes('tea')) return 'fa-coffee text-amber-800';
                if(n.includes('clothing')) return 'fa-tshirt text-indigo-500';
                if(n.includes('footwear')) return 'fa-shoe-prints text-orange-700';
                if(n.includes('auto part')) return 'fa-cogs text-gray-600';
                if(n.includes('skincare')) return 'fa-spa text-pink-400';
                if(n.includes('tile') || n.includes('floor')) return 'fa-border-all text-stone-500';
                if(n.includes('mobile')) return 'fa-mobile-alt text-gray-800';
                if(n.includes('computer')) return 'fa-laptop text-slate-700';
                if(n.includes('solar')) return 'fa-solar-panel text-blue-400';
                if(n.includes('pcb')) return 'fa-microchip text-emerald-600';
                if(n.includes('kitchenware')) return 'fa-utensils text-gray-500';
                if(n.includes('packaging mach')) return 'fa-box-open text-amber-600';
                if(n.includes('jewelry')) return 'fa-gem text-purple-500';
                if(n.includes('box')) return 'fa-box text-yellow-600';
                if(n.includes('fitness')) return 'fa-dumbbell text-zinc-800';
                if(n.includes('tool')) return 'fa-tools text-slate-600';
                return fallback || "fa-th-large text-gray-400";
            }

            let deskSidebarHTML = '', deskPanelsHTML = '', mobMenuHTML = '';
            let index = 0;

            for (const [cat, subcats] of Object.entries(catTree).sort()) {
                const safeId = 'dyn-cat-' + index;
                const mainIcon = catIcons[cat] || "fa-th-large";
                const encodedCat = encodeURIComponent(cat);

                deskSidebarHTML += `<a href="catalog.html?category=${encodedCat}" class="mega-cat-item ${index===0?'active':''}" onmouseenter="switchMegaPanel('${safeId}', this)">${cat} <i class="fas fa-chevron-right"></i></a>`;

                let subcatGridHTML = '';
                Array.from(subcats).sort().forEach(sub => {
                    const specificIcon = getSubIcon(sub, mainIcon);
                    subcatGridHTML += `<a href="catalog.html?category=${encodedCat}&sub=${encodeURIComponent(sub)}" class="subcat-item hover:bg-gray-50 rounded-lg p-2 transition"><div class="subcat-icon bg-white shadow-sm border border-gray-100"><i class="fas ${specificIcon}"></i></div><div class="subcat-name text-left ml-2">${sub}</div></a>`;
                });
                subcatGridHTML += `<a href="catalog.html?category=${encodedCat}" class="subcat-item hover:bg-gray-50 rounded-lg p-2 transition"><div class="subcat-icon bg-[var(--gold-light)]"><i class="fas fa-arrow-right text-[var(--gold-dark)]"></i></div><div class="subcat-name text-[var(--gold-dark)] text-left ml-2">View All</div></a>`;
                
                deskPanelsHTML += `<div id="${safeId}" class="mega-panel ${index===0?'active':''}"><h3 class="text-sm font-bold text-gray-900 border-b border-gray-100 pb-3 mb-4 brand-font uppercase tracking-widest">${cat}</h3><div class="grid grid-cols-2 md:grid-cols-3 gap-3">${subcatGridHTML}</div></div>`;

                let mobSubLinks = '';
                Array.from(subcats).sort().forEach(sub => {
                    mobSubLinks += `<a href="catalog.html?category=${encodedCat}&sub=${encodeURIComponent(sub)}" class="flex items-center gap-3 py-3 px-6 text-sm text-gray-600 border-b border-gray-200"><i class="fas ${getSubIcon(sub, mainIcon)} w-5 text-center"></i> ${sub}</a>`;
                });
                mobSubLinks += `<a href="catalog.html?category=${encodedCat}" class="block py-3 px-6 text-sm font-bold text-[var(--gold-dark)]">View All ${cat.split(',')[0]} &rarr;</a>`;

                mobMenuHTML += `<div class="bg-white border-b border-gray-200"><button onclick="toggleMobileCat('mob-${safeId}')" class="w-full flex items-center justify-between p-5 text-sm font-bold text-gray-800 hover:text-[var(--gold-dark)] transition">${cat} <i id="icon-mob-${safeId}" class="fas fa-chevron-down text-gray-400 transition-transform duration-300"></i></button><div id="mob-${safeId}" class="mobile-submenu hidden bg-gray-50 border-t border-gray-100">${mobSubLinks}</div></div>`;

                index++;
            }

            const dSide = document.getElementById('dynamic-mega-sidebar');
            const dPanel = document.getElementById('dynamic-mega-panels');
            const mMenu = document.getElementById('dynamic-mobile-menu');

            if(dSide) dSide.innerHTML = deskSidebarHTML;
            if(dPanel) dPanel.innerHTML = deskPanelsHTML;
            if(mMenu) mMenu.innerHTML = mobMenuHTML;
        }
    </script>
    <div id="fullscreen-gallery" class="fixed inset-0 bg-[#0b0e14]/98 backdrop-blur-md z-[99999] hidden flex-row items-center justify-center opacity-0 transition-opacity duration-300">
        
        <button onclick="closeGallery()" class="absolute top-4 right-4 md:top-6 md:right-6 bg-white shadow-lg border border-gray-200 text-gray-600 hover:text-black hover:bg-gray-50 text-2xl z-50 transition-all duration-300 hover:rotate-90 hover:scale-110 w-10 h-10 md:w-12 md:h-12 flex items-center justify-center rounded-full">
            <i class="fas fa-times"></i>
        </button>
        
        <div class="flex w-full h-full max-w-[1400px] p-4 md:p-12 gap-8 items-center justify-center relative">
            
            <div class="hidden md:flex flex-col gap-4 h-full max-h-[80vh] overflow-y-auto w-24 pr-2 scrollbar-hide py-4" id="fs-thumbs"></div>

            <div id="fs-swipe-zone" class="flex-1 relative h-full max-h-[85vh] flex items-center justify-center group touch-pan-y">
                <img id="fs-main-img" src="" class="max-w-full max-h-full object-contain select-none rounded-lg shadow-[0_0_50px_rgba(0,0,0,0.5)] transition-transform duration-300">
                
                <button onclick="changeFsImage(-1)" class="absolute left-2 md:-left-6 top-1/2 -translate-y-1/2 bg-black/60 hover:bg-[var(--gold)] text-white hover:text-black w-12 h-12 md:w-14 md:h-14 rounded-full flex items-center justify-center text-xl backdrop-blur transition opacity-0 group-hover:opacity-100 shadow-xl border border-white/10">
                    <i class="fas fa-chevron-left"></i>
                </button>
                <button onclick="changeFsImage(1)" class="absolute right-2 md:-right-6 top-1/2 -translate-y-1/2 bg-black/60 hover:bg-[var(--gold)] text-white hover:text-black w-12 h-12 md:w-14 md:h-14 rounded-full flex items-center justify-center text-xl backdrop-blur transition opacity-0 group-hover:opacity-100 shadow-xl border border-white/10">
                    <i class="fas fa-chevron-right"></i>
                </button>
            </div>
        </div>
    </div>
</body>
</html>
