<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Muziris | The Sourcing Journal</title>
    <link rel="icon" type="image/png" href="MC.png">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <style>
        :root { --gold: #D4AF37; --gold-dark: #b89225; --void: #0b0e14; }
        body { background-color: #FAFAFA; color: #111827; font-family: 'Inter', sans-serif; -webkit-font-smoothing: antialiased; }
        .brand-font { font-family: 'Cinzel', serif; }
        .glass-header { background: rgba(255, 255, 255, 0.98); backdrop-filter: blur(12px); border-bottom: 1px solid rgba(0,0,0,0.05); position: sticky; top: 0; z-index: 50; }
        
        .article-card { transition: all 0.3s ease; border: 1px solid rgba(0,0,0,0.05); background: #fff; cursor: pointer; display: flex; flex-direction: column; height: 100%;}
        .article-card:hover { transform: translateY(-5px); box-shadow: 0 20px 40px rgba(0,0,0,0.08); border-color: rgba(212,175,55,0.3); }
        .card-img-wrapper { overflow: hidden; aspect-ratio: 16/9; position: relative; }
        .card-img { transition: transform 0.5s ease; width: 100%; height: 100%; object-fit: cover; }
        .article-card:hover .card-img { transform: scale(1.05); }
        
        /* Loading Skeleton */
        .skeleton { background: #e5e7eb; border-radius: 4px; animation: pulse 1.5s infinite; }
        @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.5; } 100% { opacity: 1; } }
    </style>
</head>
<body>
    
    <header class="glass-header">
      <div class="max-w-[1600px] mx-auto px-4 md:px-8 h-20 flex items-center justify-between">
        <div class="flex items-center gap-4">
          <h1 class="text-3xl font-bold tracking-[0.1em] text-gray-900 brand-font m-0 cursor-pointer" onclick="window.location.href='index1.html'">Muziris</h1>
        </div>
        <div class="flex items-center gap-6">
            <a href="catalog.html" class="hidden md:block text-xs font-bold uppercase tracking-widest text-gray-500 hover:text-gray-900">Global Catalog</a>
            <button onclick="window.location.href='rfq.html'" class="bg-[var(--void)] text-[var(--gold)] px-6 py-2.5 rounded text-xs font-bold uppercase tracking-widest shadow-md">Submit RFQ</button>
        </div>
      </div>
    </header>

    <section class="bg-[var(--void)] text-white py-10 md:py-16 lg:py-20 relative overflow-hidden">
        <div class="absolute inset-0 opacity-10 bg-[url('MC.png')] bg-center bg-cover mix-blend-overlay"></div>
        <div class="max-w-[1200px] mx-auto px-5 text-center relative z-10">
            <h1 class="text-3xl md:text-5xl lg:text-6xl font-bold brand-font mb-3 md:mb-6 text-[var(--gold)]">The Muziris Journal</h1>
            <p class="text-gray-400 text-sm md:text-lg lg:text-xl max-w-2xl mx-auto leading-relaxed">Strategic insights, supply chain analysis, and global trade intelligence for the modern enterprise buyer.</p>
        </div>
    </section>

    <main class="max-w-[1200px] mx-auto px-5 py-16">
        
        <div id="loading-state">
            <div class="mb-12">
                <div class="skeleton" style="width: 150px; height: 30px; margin-bottom: 20px;"></div>
                <div class="grid grid-cols-1 md:grid-cols-3 gap-8">
                    <div class="skeleton" style="height: 350px; border-radius: 12px;"></div>
                    <div class="skeleton" style="height: 350px; border-radius: 12px;"></div>
                    <div class="skeleton" style="height: 350px; border-radius: 12px;"></div>
                </div>
            </div>
        </div>

        <div id="journal-content"></div>

    </main>

    <section class="mt-8 bg-gray-50 py-16 border-t border-gray-200 text-center">
        <div class="max-w-2xl mx-auto px-5">
            <h2 class="text-2xl font-bold text-gray-900 brand-font mb-4">Ready to bypass the middlemen?</h2>
            <p class="text-gray-500 mb-8">Connect directly with India's highest-tier manufacturers on our secure B2B platform.</p>
            <button onclick="window.location.href='catalog.html'" class="bg-[var(--gold)] text-black px-8 py-3 rounded font-bold uppercase tracking-widest text-sm shadow-md hover:bg-[var(--gold-dark)] transition-colors">Start Sourcing</button>
        </div>
    </section>

    <script>
        // Converts "The Original 'China Plus One'!" into "the-original-china-plus-one"
        function createSlug(title) {
            return title.toLowerCase().replace(/[^a-z0-9\s-]/g, '').replace(/\s+/g, '-').replace(/-+/g, '-');
        }

        async function fetchJournal() {
            try {
                // Fetch all blogs from the database
                const response = await fetch('https://muziris-api.onrender.com/api/blogs');
                const data = await response.json();

                document.getElementById('loading-state').style.display = 'none';
                const container = document.getElementById('journal-content');

                if (!data.success || data.blogs.length === 0) {
                    container.innerHTML = `<div class="text-center py-20 text-gray-500 text-lg">No insights published yet. Check back soon.</div>`;
                    return;
                }

                // 🟢 GROUPING LOGIC: Group articles by their "Publish Month & Year"
                const groupedBlogs = {};
                data.blogs.forEach(blog => {
                    const monthGroup = blog.publish_date || 'Recent';
                    if (!groupedBlogs[monthGroup]) {
                        groupedBlogs[monthGroup] = [];
                    }
                    groupedBlogs[monthGroup].push(blog);
                });

                // 🟢 RENDER LOGIC: Build the HTML for each month group
                let finalHtml = '';
                
                for (const [month, articles] of Object.entries(groupedBlogs)) {
                    // Create the Month Header
                    finalHtml += `
                        <div class="mb-16">
                            <div class="flex items-center gap-4 mb-8">
                                <h2 class="text-2xl font-bold text-gray-900 brand-font">${month}</h2>
                                <div class="flex-1 h-px bg-gray-200"></div>
                            </div>
                            <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8">
                    `;

                    articles.forEach(blog => {
                        const slug = createSlug(blog.title);
                        // 🟢 Hardcoded to your live domain
                        const articleUrl = `https://muziris.ca/blog.html?id=${blog.id}&article=${slug}`;
                        
                        // Use Cloudinary URL, or fallback to a placeholder
                        const imgUrl = blog.image_url && String(blog.image_url).startsWith('http') ? blog.image_url : 'MC.png';

                        finalHtml += `
                            <div class="article-card rounded-2xl overflow-hidden shadow-sm" onclick="window.location.href='${articleUrl}'">
                                <div class="card-img-wrapper bg-gray-100">
                                    <img src="${imgUrl}" alt="Article Image" class="card-img">
                                </div>
                                <div class="p-6 flex flex-col flex-1">
                                    <div class="text-[var(--gold-dark)] text-[10px] font-bold uppercase tracking-widest mb-3">${blog.category}</div>
                                    <h3 class="text-xl font-bold text-gray-900 brand-font leading-tight mb-4 flex-1">${blog.title}</h3>
                                    
                                    <div class="flex items-center justify-between mt-auto pt-4 border-t border-gray-100">
                                        <span class="text-xs text-gray-500 font-medium"><i class="far fa-clock mr-1"></i> ${blog.read_time}</span>
                                        <span class="text-[var(--gold)] text-xs font-bold uppercase tracking-wider">Read Insight <i class="fas fa-arrow-right ml-1"></i></span>
                                    </div>
                                </div>
                            </div>
                        `;
                    });

                    // Close the Grid and Group Div
                    finalHtml += `
                            </div>
                        </div>
                    `;
                }

                container.innerHTML = finalHtml;

            } catch (error) {
                console.error("Error fetching journal:", error);
                document.getElementById('loading-state').innerHTML = `<div class="text-center py-20 text-red-500">Unable to connect to the database. Please try again later.</div>`;
            }
        }

        // Run immediately
        window.onload = fetchJournal;
    </script>
</body>
</html>
