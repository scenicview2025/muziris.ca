<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Muziris | Corporate Settings</title>
  <link rel="icon" type="image/png" href="MC.png">
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">

  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-firestore-compat.js"></script>

  <style>
    :root { 
      --gold: #D4AF37; 
      --gold-dark: #b89225; 
      --void: #0b0e14; 
      --slate: #ffffff; 
      --mist: #f3f4f6; 
      --text-dark: #111827;
      --text-gray: #6b7280;
      --border-light: #e5e7eb;
      --blue: #0ea5e9;
      --success: #10b981;
    }
    
    body { margin: 0; padding: 0; font-family: 'Inter', sans-serif; background-color: #FAFAFA; color: var(--text-dark); overflow-x: hidden; display: flex; height: 100vh; -webkit-font-smoothing: antialiased; }
    .brand-font { font-family: 'Cinzel', serif; }
    
    /* SIDEBAR */
    .sidebar { width: 260px; background-color: var(--slate); border-right: 1px solid var(--border-light); display: flex; flex-direction: column; z-index: 100; box-shadow: 2px 0 10px rgba(0,0,0,0.02); }
    .logo-container { padding: 30px 24px; text-align: left; border-bottom: 1px solid var(--border-light); }
    .logo { font-family: 'Cinzel', serif; color: var(--text-dark); font-size: 24px; text-decoration: none; font-weight: 700; letter-spacing: 2px; text-transform: uppercase; }
    
    .nav-links { flex: 1; padding: 24px 12px; overflow-y: auto;}
    .nav-link { display: flex; align-items: center; gap: 12px; padding: 12px 16px; color: var(--text-gray); text-decoration: none; font-size: 13px; font-weight: 600; transition: 0.3s; border-radius: 8px; margin-bottom: 4px; }
    .nav-link i { font-size: 16px; width: 20px; text-align: center; }
    .nav-link:hover { background: #f9fafb; color: var(--text-dark); }
    .nav-link.active { background: var(--void); color: var(--gold); box-shadow: 0 4px 10px rgba(11, 14, 20, 0.1); }
    
    .logout-btn { padding: 20px; border-top: 1px solid var(--border-light); }
    .logout-btn button { background: #fff; border: 1px solid var(--border-light); color: var(--text-gray); padding: 12px 20px; border-radius: 8px; font-weight: 600; cursor: pointer; width: 100%; transition: 0.3s; font-size: 13px; }
    .logout-btn button:hover { background: #fee2e2; color: #ef4444; border-color: #fca5a5; }

    /* MAIN CONTENT */
    .main-content { flex: 1; display: flex; flex-direction: column; overflow-y: auto; position: relative; }
    .topbar { padding: 20px 40px; border-bottom: 1px solid var(--border-light); display: flex; justify-content: space-between; align-items: center; background: rgba(255, 255, 255, 0.95); position: sticky; top: 0; z-index: 50; backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); }
    .welcome-text { font-size: 18px; font-weight: 700; color: var(--text-dark); margin: 0; }
    
    .dashboard-body { padding: 40px; max-width: 1000px; margin: 0 auto; width: 100%; box-sizing: border-box; }

    /* SETTINGS PANELS */
    .settings-card { background: var(--slate); border: 1px solid var(--border-light); border-radius: 16px; padding: 30px; margin-bottom: 30px; box-shadow: 0 4px 15px rgba(0,0,0,0.02); }
    .settings-header { border-bottom: 1px solid var(--border-light); padding-bottom: 15px; margin-bottom: 25px; display: flex; align-items: center; gap: 10px;}
    .settings-header h2 { font-size: 16px; font-weight: 700; color: var(--text-dark); margin: 0; text-transform: uppercase; letter-spacing: 1px; }
    
    .form-group { margin-bottom: 20px; }
    .form-label { display: block; font-size: 11px; color: var(--text-gray); font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 8px; }
    .form-input { width: 100%; padding: 12px 16px; background: #f9fafb; border: 1px solid var(--border-light); color: var(--text-dark); border-radius: 8px; outline: none; transition: all 0.2s; font-size: 14px; font-weight: 500; }
    .form-input:focus { border-color: var(--gold); background: #fff; box-shadow: 0 0 0 3px rgba(212, 175, 55, 0.1); }
    .form-input:disabled { background: #e5e7eb; color: #9ca3af; cursor: not-allowed; }

    .btn-save { background: var(--gold); color: #000; border: none; padding: 16px 24px; border-radius: 8px; font-size: 13px; font-weight: 800; text-transform: uppercase; letter-spacing: 0.1em; cursor: pointer; transition: 0.3s; box-shadow: 0 4px 10px rgba(212,175,55,0.2); width: 100%; display: flex; justify-content: center; align-items: center; gap: 10px; }
    .btn-save:hover { background: var(--gold-dark); transform: translateY(-2px); box-shadow: 0 6px 15px rgba(212,175,55,0.3); }
    
    /* MOBILE NAVIGATION */
    .mobile-nav-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 99; backdrop-filter: blur(2px); }
    .mobile-menu-btn { display: none; background: transparent; border: none; color: var(--text-dark); font-size: 24px; cursor: pointer; padding: 0; line-height: 1; }
    @media (max-width: 900px) {
      .sidebar { position: fixed; left: -260px; height: 100%; transition: 0.3s; }
      .sidebar.open { left: 0; }
      .mobile-menu-btn { display: block; }
      .topbar { padding: 15px 20px; }
      .dashboard-body { padding: 20px; }
    }
  </style>
</head>
<body>

  <div class="sidebar" id="sidebar">
    <div class="logo-container">
      <a href="index1.html" class="logo">Muziris</a>
    </div>
    <div class="nav-links">
      <a href="buyer-dashboard.html" class="nav-link"><i class="fas fa-layer-group"></i> Dashboard</a>
      <a href="buyer-message-hub.html" class="nav-link"><i class="fas fa-comments"></i> Messages</a>
      <a href="catalog.html" class="nav-link"><i class="fas fa-store"></i> Global Catalog</a>
      <a href="#" class="nav-link"><i class="fas fa-shield-alt"></i> Escrow Vault</a>
      <a href="buyer-dashboard-settings.html" class="nav-link active"><i class="fas fa-cog"></i> Settings</a>
    </div>
    <div class="logout-btn">
      <button onclick="logoutBuyer()"><i class="fas fa-sign-out-alt mr-2"></i> Sign Out</button>
    </div>
  </div>

  <div class="mobile-nav-overlay" id="mobile-overlay" onclick="toggleMobileMenu()"></div>

  <div class="main-content">
    
    <div class="topbar">
      <div style="display: flex; align-items: center; gap: 15px;">
        <button class="mobile-menu-btn" onclick="toggleMobileMenu()"><i class="fas fa-bars"></i></button>
        <h1 class="welcome-text">Corporate Settings</h1>
      </div>
      <div class="flex items-center gap-3">
        <div class="w-8 h-8 rounded-full bg-[var(--gold)]/20 text-[var(--gold-dark)] flex items-center justify-center font-bold border border-[var(--gold)]/30"><i class="far fa-user"></i></div>
        <span class="text-sm font-bold text-gray-700 hidden sm:block" id="ui-buyer-email">Authenticating...</span>
      </div>
    </div>

    <div class="dashboard-body">
      
      <form id="settingsForm" onsubmit="event.preventDefault(); saveSettings();">
        
        <div class="settings-card">
          <div class="settings-header">
            <i class="fas fa-building text-[var(--gold)] text-xl"></i>
            <h2>Corporate Identity & Compliance</h2>
          </div>
          <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
            <div class="form-group">
              <label class="form-label">Company Legal Name</label>
              <input type="text" id="set-company" class="form-input" placeholder="e.g. Acme Procurement Ltd.">
            </div>
            <div class="form-group">
              <label class="form-label">Corporate Tax ID / EIN / Business #</label>
              <input type="text" id="set-tax" class="form-input" placeholder="Required for Customs Clearance">
            </div>
            <div class="form-group">
              <label class="form-label">Authorized Signatory Name</label>
              <input type="text" id="set-name" class="form-input" placeholder="Full Name">
            </div>
            <div class="form-group">
              <label class="form-label">Account Login Email (Uneditable)</label>
              <input type="email" id="set-email" class="form-input" disabled>
            </div>
          </div>
        </div>

        <div class="settings-card">
          <div class="settings-header">
            <i class="fas fa-warehouse text-[var(--blue)] text-xl"></i>
            <h2>Logistics & Receiving Hub</h2>
          </div>
          <div class="form-group">
            <label class="form-label">Default Receiving Address</label>
            <input type="text" id="set-address" class="form-input" placeholder="Street Address, City, State/Province, Zip Code, Country">
            <p class="text-xs text-gray-400 mt-2">This will automatically pre-fill when you request official quotes.</p>
          </div>
          <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
            <div class="form-group">
              <label class="form-label">Preferred Logistics Terms</label>
              <select id="set-incoterm" class="form-input cursor-pointer">
                <option value="DDP">DDP (Muziris Freight - Preferred)</option>
                <option value="CIF">CIF (Cost, Insurance, Freight)</option>
                <option value="FOB">FOB (Own Forwarder)</option>
                <option value="EXW">EXW (Ex Works)</option>
              </select>
            </div>
            <div class="form-group">
              <label class="form-label">Receiving Contact Phone #</label>
              <input type="text" id="set-phone" class="form-input" placeholder="+1 (555) 000-0000">
            </div>
          </div>
        </div>

        <div class="settings-card">
          <div class="settings-header">
            <i class="fas fa-university text-[var(--success)] text-xl"></i>
            <h2>Financial & Escrow Vault Preferences</h2>
          </div>
          <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
            <div class="form-group">
              <label class="form-label">Default Platform Currency</label>
              <select id="set-currency" class="form-input cursor-pointer">
                <option value="CAD">CAD (Canadian Dollar)</option>
                <option value="USD">USD (US Dollar)</option>
                <option value="EUR">EUR (Euro)</option>
                <option value="GBP">GBP (British Pound)</option>
              </select>
            </div>
            <div class="form-group">
              <label class="form-label">Receiving Bank Name (For Escrow Refunds)</label>
              <input type="text" id="set-bank" class="form-input" placeholder="e.g. Royal Bank of Canada">
            </div>
            <div class="form-group md:col-span-2">
              <label class="form-label">Account Number / IBAN (For Escrow Refunds)</label>
              <input type="text" id="set-account" class="form-input" placeholder="Strictly used for returning cancelled escrow funds">
            </div>
          </div>
        </div>

        <button type="submit" class="btn-save" id="btn-save">
          <i class="fas fa-shield-check"></i> Save Corporate Profile
        </button>

      </form>
    </div>
  </div>

  <script>
    // ==========================================
    // 🟢 FIREBASE INITIALIZATION & AUTH GUARD
    // ==========================================
    const firebaseConfig = {
        apiKey: "AIzaSyBCECnPXh4baRlDwSINyifarwXSUEMNha8",
        authDomain: "muziris-ac9dd.firebaseapp.com",
        projectId: "muziris-ac9dd",
        storageBucket: "muziris-ac9dd.firebasestorage.app",
        messagingSenderId: "929662963272",
        appId: "1:929662963272:web:a2ed63f56ffc90940ed27d"
    };
    
    if (!firebase.apps.length) { firebase.initializeApp(firebaseConfig); }
    const auth = firebase.auth();
    const db = firebase.firestore();

    let currentBuyerEmail = "";

    // Mobile Menu
    function toggleMobileMenu() {
      const sidebar = document.getElementById('sidebar');
      const overlay = document.getElementById('mobile-overlay');
      sidebar.classList.toggle('open');
      overlay.style.display = sidebar.classList.contains('open') ? 'block' : 'none';
    }

    // Auth Listener
    auth.onAuthStateChanged((user) => {
        if (user) {
            currentBuyerEmail = user.email;
            let displayName = user.displayName || user.email.split('@')[0];
            document.getElementById('ui-buyer-email').innerText = displayName;
            document.getElementById('set-email').value = user.email;
            
            // Load their saved settings
            loadSettings();
        } else {
            window.location.replace('index1.html');
        }
    });

    function logoutBuyer() { auth.signOut().catch((error) => console.error("Sign out error", error)); }

    // ==========================================
    // 🟢 LOAD SETTINGS FROM FIRESTORE
    // ==========================================
    function loadSettings() {
        if (!currentBuyerEmail) return;

        db.collection('buyers').doc(currentBuyerEmail).get().then((doc) => {
            if (doc.exists) {
                const data = doc.data();
                
                if(data.companyName) document.getElementById('set-company').value = data.companyName;
                if(data.taxId) document.getElementById('set-tax').value = data.taxId;
                if(data.contactName) document.getElementById('set-name').value = data.contactName;
                
                if(data.defaultAddress) document.getElementById('set-address').value = data.defaultAddress;
                if(data.defaultIncoterm) document.getElementById('set-incoterm').value = data.defaultIncoterm;
                if(data.phone) document.getElementById('set-phone').value = data.phone;

                if(data.defaultCurrency) document.getElementById('set-currency').value = data.defaultCurrency;
                if(data.refundBank) document.getElementById('set-bank').value = data.refundBank;
                if(data.refundAccount) document.getElementById('set-account').value = data.refundAccount;
            }
        }).catch((error) => {
            console.error("Error loading settings:", error);
        });
    }

    // ==========================================
    // 🟢 SAVE SETTINGS TO FIRESTORE
    // ==========================================
    function saveSettings() {
        if (!currentBuyerEmail) return;

        const btn = document.getElementById('btn-save');
        btn.innerHTML = `<i class="fas fa-circle-notch fa-spin"></i> Saving...`;
        btn.disabled = true;

        const settingsData = {
            companyName: document.getElementById('set-company').value,
            taxId: document.getElementById('set-tax').value,
            contactName: document.getElementById('set-name').value,
            
            defaultAddress: document.getElementById('set-address').value,
            defaultIncoterm: document.getElementById('set-incoterm').value,
            phone: document.getElementById('set-phone').value,

            defaultCurrency: document.getElementById('set-currency').value,
            refundBank: document.getElementById('set-bank').value,
            refundAccount: document.getElementById('set-account').value,
            
            lastUpdated: firebase.firestore.FieldValue.serverTimestamp()
        };

        db.collection('buyers').doc(currentBuyerEmail).set(settingsData, { merge: true })
        .then(() => {
            btn.innerHTML = `<i class="fas fa-check"></i> Profile Saved Successfully`;
            btn.style.backgroundColor = "var(--success)";
            btn.style.color = "#fff";
            
            // Revert button styling after 3 seconds
            setTimeout(() => {
                btn.innerHTML = `<i class="fas fa-shield-check"></i> Save Corporate Profile`;
                btn.style.backgroundColor = "var(--gold)";
                btn.style.color = "#000";
                btn.disabled = false;
            }, 3000);
        })
        .catch((error) => {
            console.error("Error saving settings:", error);
            alert("Failed to save settings. Please try again.");
            btn.innerHTML = `<i class="fas fa-shield-check"></i> Save Corporate Profile`;
            btn.disabled = false;
        });
    }
  </script>
</body>
</html>
