<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Muziris | Premium Global Sourcing</title>
    <link rel="icon" type="image/png" href="MC.png">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-auth-compat.js"></script>
    
    <style>
        :root {
            --gold: #D4AF37;
            --gold-dark: #b89225;
            --void: #0b0e14;
            --text-dark: #111827;
            --text-gray: #6b7280;
            --border-light: #e5e7eb;
        }

        body { background-color: #FAFAFA; color: var(--text-dark); font-family: 'Inter', sans-serif; }
        .brand-font { font-family: 'Cinzel', serif; }
        
        .glass-header { background: rgba(255, 255, 255, 0.98); backdrop-filter: blur(12px); border-bottom: 1px solid rgba(0,0,0,0.05); position: sticky; top: 0; z-index: 50; }
        
        .sidebar-link { display: block; padding: 10px 16px; color: var(--text-gray); font-size: 14px; font-weight: 500; transition: all 0.2s; cursor: pointer; border-radius: 8px; margin-bottom: 2px; }
        .sidebar-link:hover { background: #f3f4f6; color: var(--text-dark); }
        .sidebar-link.active { background-color: var(--void); color: var(--gold); font-weight: 700; box-shadow: 0 4px 12px rgba(11, 14, 20, 0.15); }
        .sidebar-header { font-weight: 800; font-size: 12px; text-transform: uppercase; letter-spacing: 0.1em; margin-bottom: 16px; color: #9ca3af; padding-left: 16px; }

        /* 🟢 SYNCED: Clean, borderless, Etsy-style Product Cards */
        .product-card { position: relative; transition: all 0.3s ease; background: transparent; display: flex; flex-direction: column; cursor: pointer; }
        .product-card:hover .img-layer.opacity-100 { transform: scale(1.05); }
        .img-container { background: #f3f4f6; position: relative; aspect-ratio: 4 / 5; border-radius: 8px; overflow: hidden; box-shadow: inset 0 0 0 1px rgba(0,0,0,0.03); } 
        .img-layer { width: 100%; height: 100%; object-fit: cover; transition: transform 0.7s cubic-bezier(0.16, 1, 0.3, 1); }
        
        .badge-verified { position: absolute; top: 12px; right: 12px; background: #ffffff; padding: 4px 8px; border-radius: 12px; font-size: 10px; font-weight: 800; color: #111; text-transform: uppercase; letter-spacing: 0.05em; border: 1px solid rgba(0,0,0,0.05); box-shadow: 0 2px 6px rgba(0,0,0,0.05); z-index: 30; display: flex; align-items: center; gap: 4px; }
        .badge-verified i { color: var(--gold); font-size: 11px; }

        /* 🟢 SYNCED: Mega Menu Styles */
        .nav-group:hover .mega-menu-container { visibility: visible; opacity: 1; transform: translateY(0); }
        .mega-menu-container { position: absolute; top: 100%; left: -100px; width: 750px; height: 380px; background: #fff; border-radius: 8px; display: flex; visibility: hidden; opacity: 0; transform: translateY(15px); transition: all 0.3s ease; box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25); border: 1px solid #e5e7eb; overflow: hidden; z-index: 1000; }
        .mega-sidebar { width: 35%; background: #f8f9fa; border-right: 1px solid #e5e7eb; padding: 15px 0; overflow-y: auto; overscroll-behavior: contain; }
        .mega-sidebar::-webkit-scrollbar { width: 4px; }
        .mega-sidebar::-webkit-scrollbar-track { background: transparent; }
        .mega-sidebar::-webkit-scrollbar-thumb { background: #e5e7eb; border-radius: 4px; }
        .mega-sidebar::-webkit-scrollbar-thumb:hover { background: var(--gold); }
        .mega-cat-item { padding: 14px 24px; font-size: 12px; font-weight: 600; color: #4b5563; cursor: pointer; display: flex; justify-content: space-between; align-items: center; transition: all 0.2s; text-transform: none; letter-spacing: normal; }
        .mega-cat-item:hover, .mega-cat-item.active { background: #ffffff; color: var(--gold-dark); border-left: 3px solid var(--gold); }
        .mega-content { width: 65%; padding: 30px; background: #ffffff; overscroll-behavior: contain; }
        .mega-panel { display: none; }
        .mega-panel.active { display: block; animation: fadeIn 0.3s ease; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        .subcat-item { cursor: pointer; display: flex; align-items: center; gap: 10px; padding: 10px 0; border-bottom: 1px solid #f3f4f6; transition: 0.2s; }
        .subcat-item:hover { transform: translateX(5px); }

        .btn-add-cart { width: 100%; margin-top: 10px; background: rgba(212, 175, 55, 0.1); border: 1px solid var(--gold); color: var(--gold-dark); padding: 8px; border-radius: 6px; font-weight: bold; font-size: 11px; text-transform: uppercase; letter-spacing: 1px; cursor: pointer; transition: 0.2s; }
        .btn-add-cart:hover { background: var(--gold); color: #000; }
        
        .cart-float { position: fixed; bottom: 30px; right: 30px; background: var(--void); color: var(--gold); padding: 15px 25px; border-radius: 50px; font-weight: bold; font-family: 'Cinzel', serif; box-shadow: 0 10px 25px rgba(0,0,0,0.2); cursor: pointer; z-index: 1000; border: 1px solid var(--gold); display: none; transition: 0.3s; align-items: center; gap: 10px; text-transform: uppercase; letter-spacing: 1px;}
        .cart-float:hover { transform: translateY(-3px); box-shadow: 0 15px 35px rgba(212, 175, 55, 0.3); background: var(--gold); color: var(--void); }
        .cart-badge { background: #ff5252; color: #fff; width: 24px; height: 24px; border-radius: 50%; display: flex; justify-content: center; align-items: center; font-size: 12px; font-family: 'Inter', sans-serif; }
        
        @media (max-width: 1024px) { .cart-float { display: none !important; } }
        .scrollbar-hide::-webkit-scrollbar { display: none; }
        .scrollbar-hide { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body>

    <header class="glass-header" id="main-header">
      <div class="max-w-[1600px] mx-auto px-4 md:px-8 h-20 flex items-center justify-between gap-4 md:gap-8">
        
        <div class="flex items-center gap-4 md:gap-6 flex-shrink-0 h-full">
          <button class="md:hidden text-gray-900 text-[22px] hover:text-[var(--gold)] transition mt-1" onclick="openMobileMenu()">
            <i class="fas fa-bars"></i>
          </button>
          
          <h1 class="text-3xl font-bold tracking-[0.1em] text-gray-900 brand-font m-0 leading-none cursor-pointer" onclick="window.location.href='index1.html'">Muziris</h1>
          
          <div class="hidden md:flex nav-group h-full items-center ml-4 md:ml-8 cursor-pointer relative">
            <span class="text-gray-500 hover:text-gray-900 text-xs font-bold uppercase tracking-widest transition flex items-center gap-2 py-8">
              <i class="fas fa-bars text-sm"></i> Categories
            </span>
            <div class="mega-menu-container text-left cursor-default shadow-2xl absolute top-[80px] -left-[100px]">
              <div class="mega-sidebar" id="dynamic-mega-sidebar"></div>            
              <div class="mega-content overflow-y-auto" id="dynamic-mega-panels"></div> 
            </div> 
          </div>
        </div>
        
        <div class="hidden md:block flex-1 max-w-3xl">
            <div class="relative w-full group">
                <input type="text" id="nav-search" placeholder="Search for anything..." class="w-full bg-gray-100 border-2 border-transparent hover:border-gray-300 focus:bg-white focus:border-[var(--gold)] text-sm rounded-full py-3 pl-5 pr-12 outline-none transition-all text-gray-900 shadow-inner">
                <button onclick="handleSearch()" class="absolute right-1.5 top-1/2 transform -translate-y-1/2 bg-[var(--gold)] hover:bg-[var(--gold-dark)] text-white w-9 h-9 rounded-full flex items-center justify-center transition shadow-sm">
                    <i class="fas fa-search text-sm"></i>
                </button>
            </div>
        </div>

        <div class="flex items-center gap-5 md:gap-7 text-gray-700 flex-shrink-0">
            <button onclick="toggleMobileSearch()" class="md:hidden hover:text-[var(--gold)] transition flex items-center">
                <i class="fas fa-search text-[20px]"></i>
            </button>

            <div class="relative group h-full flex items-center" id="userMenuContainer">
                <button id="auth-buttons" onclick="openAuthModal()" class="flex items-center gap-2 hover:text-[var(--gold)] transition font-bold text-gray-700 py-2">
                    <i class="far fa-user text-[22px] md:text-xl"></i> 
                    <span id="auth-btn-text" class="hidden md:block text-sm">Sign In</span>
                </button>
                <div class="absolute right-0 top-full pt-4 w-[320px] invisible opacity-0 translate-y-2 group-hover:visible group-hover:opacity-100 group-hover:translate-y-0 transition-all duration-300 z-50">
                    <div class="bg-white rounded-2xl shadow-[0_20px_50px_rgba(0,0,0,0.15)] border border-gray-100 relative overflow-hidden">
                        <div class="absolute -top-2 right-6 w-4 h-4 bg-white border-l border-t border-gray-100 transform rotate-45 z-0"></div>
                        <div id="guest-dropdown-content" class="p-6 relative z-10 bg-white">
                            <div class="text-center mb-4"><h3 class="text-xl font-bold text-gray-900 brand-font mb-1">Buyer Access</h3><p class="text-[9px] text-gray-500 uppercase tracking-widest font-bold">Secure Portal</p></div>
                            <div class="space-y-3 mb-4 text-left">
                                <div><input type="email" id="auth-email-drop" class="w-full px-4 py-2.5 bg-gray-50 border border-gray-200 rounded-lg text-sm outline-none focus:border-[var(--gold)]" placeholder="Corporate Email"></div>
                                <div><input type="password" id="auth-pass-drop" class="w-full px-4 py-2.5 bg-gray-50 border border-gray-200 rounded-lg text-sm outline-none focus:border-[var(--gold)]" placeholder="Password"></div>
                                <div class="flex gap-2 pt-1"><button onclick="signInWithEmailDrop()" class="flex-1 bg-[var(--gold)] text-black font-bold rounded-lg py-2.5 text-xs uppercase tracking-widest">Sign In</button><button onclick="signUpWithEmailDrop()" class="flex-1 bg-gray-100 text-gray-800 font-bold rounded-lg py-2.5 text-xs uppercase tracking-widest">Register</button></div>
                            </div>
                            <div class="relative flex items-center py-2 mb-3">
                                <div class="flex-grow border-t border-gray-100"></div><span class="flex-shrink-0 mx-3 text-gray-400 text-[9px] uppercase tracking-widest font-bold">Or</span><div class="flex-grow border-t border-gray-100"></div>
                            </div>
                            <div class="flex gap-2">
                                <button onclick="signInWithGoogle()" class="flex-1 flex items-center justify-center gap-2 border border-gray-200 rounded-lg py-2 text-xs font-bold text-gray-700 hover:bg-gray-50 transition"><img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" class="w-4 h-4"> Google</button>
                            </div>
                        </div>
                        <div id="user-dropdown-content" class="hidden relative z-10 bg-white">
                            <div class="bg-gray-50 p-5 border-b border-gray-100 text-center">
                                <div class="w-12 h-12 bg-[var(--gold)] text-black rounded-full flex items-center justify-center text-xl font-bold mx-auto mb-2 brand-font shadow-sm" id="drop-user-initial">M</div>
                                <div class="text-sm font-bold text-gray-900" id="drop-user-name">Buyer Name</div>
                            </div>
                            <div class="py-2">
                                <a href="buyer-dashboard.html" class="block px-5 py-3 text-sm text-gray-700 hover:bg-gray-50 hover:text-[var(--gold-dark)] font-medium transition border-b border-gray-50"><i class="fas fa-th-large w-5 text-center text-gray-400 mr-2"></i> Account Dashboard</a>
                                <a href="buyer-message-hub.html" class="block px-5 py-3 text-sm text-gray-700 hover:bg-gray-50 hover:text-[var(--gold-dark)] font-medium transition border-b border-gray-50"><i class="far fa-comments w-5 text-center text-gray-400 mr-2"></i> Messages</a>
                                <a href="buyer-tracking.html" class="block px-5 py-3 text-sm text-gray-700 hover:bg-gray-50 hover:text-[var(--gold-dark)] font-medium transition border-b border-gray-50"><i class="fas fa-box-open w-5 text-center text-gray-400 mr-2"></i> Order Tracking</a>
                                <button onclick="signOutUser()" class="w-full text-left block px-5 py-3 text-sm text-red-600 hover:bg-red-50 font-bold transition"><i class="fas fa-sign-out-alt w-5 text-center text-red-400 mr-2"></i> Sign Out</button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <div class="relative" id="customCurrencyDropdown">
                <div class="flex items-center gap-1.5 cursor-pointer hover:opacity-80 transition py-2" id="currencyBtn">
                    <div class="flex items-center gap-1.5" id="activeCurrencyDisplay">
                        <img src="https://flagcdn.com/w20/ca.png" class="w-5 h-3.5 object-cover rounded-sm shadow-sm border border-gray-200">
                        <span class="hidden md:block text-sm font-bold text-gray-900">CAD</span>
                    </div>
                    <i class="fas fa-chevron-down text-[10px] text-gray-500 hidden md:block"></i>
                </div>
                <div id="currencyMenu" class="hidden absolute right-0 z-50 mt-2 w-56 origin-top-right rounded-xl bg-white shadow-xl border border-gray-100 focus:outline-none overflow-hidden">
                    <div class="py-2 max-h-72 overflow-y-auto" id="currencyList"></div>
                </div>
            </div>

            <a href="rfq.html" class="hover:text-[var(--gold)] transition flex items-center relative text-gray-700">
                <i class="fas fa-clipboard-list text-[22px] md:text-xl"></i>
                <span id="header-cart-badge" class="absolute -top-1.5 md:-top-2 -right-2 md:-right-2 bg-[#ff5252] text-white text-[9px] font-bold w-4 h-4 flex items-center justify-center rounded-full hidden shadow-sm border border-white">0</span>
            </a>

        </div>
      </div>

      <div id="mobile-search-dropdown" class="md:hidden absolute top-20 left-0 w-full bg-white border-b border-gray-200 p-4 transform -translate-y-full opacity-0 transition-all duration-300 -z-10 pointer-events-none shadow-md">
          <div class="flex items-center bg-gray-50 border border-gray-200 rounded-full px-4 py-2 focus-within:border-[var(--gold)] transition-colors shadow-inner">
              <input type="text" id="mobile-search-input" class="w-full bg-transparent border-none outline-none text-sm text-gray-900 placeholder-gray-400" placeholder="Search products, categories...">
              <button onclick="handleSearch()" class="text-[var(--gold-dark)] ml-2 text-lg"><i class="fas fa-search"></i></button>
          </div>
      </div>
    </header>

    <main id="catalog-view" class="max-w-[1400px] mx-auto px-4 md:px-6 py-8 flex flex-col md:flex-row gap-8">
        
        <aside class="w-full md:w-56 flex-shrink-0 hidden md:block sticky top-24 h-fit">
            <h2 class="sidebar-header">Explore Categories</h2>
            <div class="space-y-1" id="categoryNav"></div>
        </aside>

        <div class="flex-1">
            <div class="flex justify-between items-end mb-6 pb-2 border-b border-gray-100">
                <div><h2 class="text-2xl font-bold text-gray-900 brand-font" id="current-category-title">Global Catalog</h2></div>
                <p class="text-xs text-gray-500 uppercase tracking-widest font-bold"><span id="product-count" class="text-[var(--gold)]">0</span> Items</p>
            </div>

            <div id="loader" class="text-center py-20">
                <i class="fas fa-circle-notch fa-spin text-3xl text-[var(--gold)] mb-4"></i>
                <h3 class="text-sm font-bold text-gray-900 tracking-widest uppercase">Fetching Secure Ledger...</h3>
            </div>

            <div id="catalog-dynamic-area"></div>
            
            <div id="empty-state" class="hidden text-center py-32 bg-white rounded-2xl border border-dashed border-gray-300 mt-6">
                <i class="fas fa-box-open text-5xl text-gray-300 mb-4"></i>
                <h3 class="text-xl font-bold text-gray-900 mb-2">No products found</h3>
                <p class="text-sm text-gray-500">Try adjusting your search filters.</p>
            </div>
        </div>
    </main>

    <div id="cart-float" class="cart-float" onclick="window.location.href='rfq.html'">
        <i class="fas fa-file-invoice"></i> 
        <span>Submit RFQ</span>
        <div id="cart-badge" class="cart-badge">0</div>
    </div>

    <div id="mobile-category-menu" class="fixed top-20 left-0 right-0 bottom-0 z-[90] bg-gray-50 transform translate-y-full transition-transform duration-300 flex flex-col md:hidden shadow-[0_-10px_30px_rgba(0,0,0,0.1)]">
        <div class="flex items-center justify-between p-5 border-b border-gray-200 bg-white shadow-sm z-10">
            <h2 class="text-lg font-bold text-gray-900 brand-font uppercase tracking-widest">Browse Categories</h2>
            <button onclick="closeMobileMenu()" class="w-9 h-9 bg-gray-100 hover:bg-gray-200 text-gray-500 hover:text-gray-900 rounded-full flex items-center justify-center text-sm cursor-pointer transition-all duration-300 hover:rotate-90 hover:scale-110 shadow-sm"><i class="fas fa-times"></i></button>
        </div>
        <div class="flex-1 overflow-y-auto pb-safe" id="dynamic-mobile-menu"></div>
    </div>

    <script>
        const firebaseConfig = {
          apiKey: "AIzaSyBCECnPXh4baRlDwSINyifarwXSUEMNha8",
          authDomain: "muziris-ac9dd.firebaseapp.com",
          projectId: "muziris-ac9dd",
          storageBucket: "muziris-ac9dd.firebasestorage.app",
          messagingSenderId: "929662963272",
          appId: "1:929662963272:web:a2ed63f56ffc90940ed27d"
        };
        if (!firebase.apps.length) { firebase.initializeApp(firebaseConfig); }
        const auth = firebase.auth();
        const googleProvider = new firebase.auth.GoogleAuthProvider();

        let currentUser = null;
        auth.onAuthStateChanged((user) => {
            const authBtn = document.getElementById('auth-buttons');
            const guestDrop = document.getElementById('guest-dropdown-content');
            const userDrop = document.getElementById('user-dropdown-content');
            
            if (user) {
                currentUser = user;
                let displayName = user.displayName || user.email.split('@')[0];
                document.getElementById('auth-btn-text').innerText = displayName.split(' ')[0];
                guestDrop.classList.add('hidden'); userDrop.classList.remove('hidden');
                document.getElementById('drop-user-name').innerText = displayName;
                document.getElementById('drop-user-initial').innerText = displayName.charAt(0).toUpperCase();
            } else {
                currentUser = null;
                document.getElementById('auth-btn-text').innerText = "Sign In";
                guestDrop.classList.remove('hidden'); userDrop.classList.add('hidden');
            }
        });

        function signInWithGoogle() { auth.signInWithPopup(googleProvider).catch(e => console.log(e)); }
        function signInWithEmailDrop() {
            const email = document.getElementById('auth-email-drop').value, pass = document.getElementById('auth-pass-drop').value;
            if(!email || !pass) return alert("Please enter both email and password.");
            auth.signInWithEmailAndPassword(email, pass).catch(error => alert("Error: " + error.message));
        }
        function signUpWithEmailDrop() {
            const email = document.getElementById('auth-email-drop').value, pass = document.getElementById('auth-pass-drop').value;
            if(!email || !pass) return alert("Enter email and password.");
            auth.createUserWithEmailAndPassword(email, pass).catch(e => alert(e.message));
        }
        function signOutUser() {
            auth.signOut().then(() => { localStorage.removeItem('muziris_cart'); window.location.reload(); });
        }
        
        document.getElementById('auth-buttons').onclick = (e) => {
            if (window.innerWidth < 768 && !currentUser) {
                e.stopPropagation();
                const dropdown = document.getElementById('userMenuContainer').querySelector('.absolute');
                dropdown.classList.toggle('invisible'); dropdown.classList.toggle('opacity-0');
            } else if (window.innerWidth < 768 && currentUser) {
                window.location.href = "buyer-dashboard.html";
            }
        };

        const API_BASE_URL = "https://muziris-api.onrender.com/api";
        let allProducts = [];
        let exchangeRates = {};
        let currencySymbols = {};
        let activeCurrency = localStorage.getItem('muziris_active_currency') || "CAD";
        window.currentSlides = {}; 
        let searchTimeout;

        let rfqCart = JSON.parse(localStorage.getItem('muziris_cart')) || [];

        function updateCartUI() {
            const floatingCart = document.getElementById('cart-float');
            const badge = document.getElementById('cart-badge');
            const headerBadge = document.getElementById('header-cart-badge'); 
            
            if (rfqCart.length > 0) {
                if (floatingCart) floatingCart.style.display = 'flex';
                if (badge) badge.innerText = rfqCart.length;
                if (headerBadge) { headerBadge.innerText = rfqCart.length; headerBadge.classList.remove('hidden'); }
            } else {
                if (floatingCart) floatingCart.style.display = 'none';
                if (headerBadge) headerBadge.classList.add('hidden');
            }
        }
        document.addEventListener('DOMContentLoaded', updateCartUI);

        function addToCart(event, id, name) {
            event.stopPropagation();
            if (rfqCart.find(item => item.id === id)) { alert("This product is already in your RFQ Cart!"); return; }
            rfqCart.push({ id: id, name: name });
            localStorage.setItem('muziris_cart', JSON.stringify(rfqCart));
            updateCartUI();
            const btn = event.currentTarget; const originalText = btn.innerHTML;
            btn.innerHTML = '✅ Added to RFQ'; btn.style.background = 'var(--gold)'; btn.style.color = '#000';
            setTimeout(() => { btn.innerHTML = originalText; btn.style.background = 'rgba(212, 175, 55, 0.1)'; btn.style.color = 'var(--gold-dark)'; }, 1500);
        }

        const flagMap = { "CAD": "ca", "USD": "us", "EUR": "eu", "GBP": "gb", "INR": "in", "SEK": "se", "AUD": "au", "JPY": "jp", "CNY": "cn", "MXN": "mx", "BRL": "br", "ZAR": "za", "CHF": "ch", "QAR": "qa", "AED": "ae" };

        async function loadLiveCurrencies() {
            try {
                const res = await fetch(API_BASE_URL + '/public-currencies');
                const data = await res.json();
                if (data.success) {
                    const dropdownList = document.getElementById('currencyList');
                    dropdownList.innerHTML = ''; 
                    data.currencies.forEach(item => {
                        exchangeRates[item.currency] = parseFloat(item.live_cad_rate);
                        currencySymbols[item.currency] = item.symbol || '$'; 
                        const flagCode = flagMap[item.currency] || item.currency.substring(0,2).toLowerCase();
                        
                        const btn = document.createElement('button');
                        btn.className = 'text-gray-700 hover:bg-gray-50 flex items-center gap-3 w-full px-4 py-2.5 text-sm font-medium transition-colors text-left';
                        btn.innerHTML = `<img src="https://flagcdn.com/w20/${flagCode}.png" onerror="this.src='https://flagcdn.com/w20/un.png'" class="w-5 h-3.5 object-cover rounded-sm shadow-sm border border-gray-200"><span class="flex-1">${item.country}</span><span class="text-gray-400 text-xs font-bold">${item.currency}</span>`;
                        btn.onclick = () => { selectCurrency(item.currency, flagCode); updateCurrency(); };
                        dropdownList.appendChild(btn);
                    });
                    if (activeCurrency) {
                        const initialFlag = flagMap[activeCurrency] || activeCurrency.substring(0,2).toLowerCase();
                        selectCurrency(activeCurrency, initialFlag);
                    }
                }
            } catch (e) { exchangeRates = { "CAD": 1.00, "USD": 0.74 }; }
        }

        function selectCurrency(curr, flagCode) {
            activeCurrency = curr; 
            localStorage.setItem('muziris_active_currency', curr);
            document.getElementById('activeCurrencyDisplay').innerHTML = `<img src="https://flagcdn.com/w20/${flagCode}.png" onerror="this.src='https://flagcdn.com/w20/un.png'" class="w-5 h-3.5 object-cover rounded-sm shadow-sm border border-gray-200"><span class="hidden md:block text-sm font-bold text-gray-900">${curr}</span>`;
            document.getElementById('currencyMenu').classList.add('hidden');
        }

        document.getElementById('currencyBtn')?.addEventListener('click', (e) => { e.stopPropagation(); document.getElementById('currencyMenu').classList.toggle('hidden'); });
        window.addEventListener('click', (e) => { 
            if(!e.target.closest('#customCurrencyDropdown')) document.getElementById('currencyMenu')?.classList.add('hidden'); 
            
            // 🟢 FIX: We use invisible/opacity-0 so it doesn't permanently break the CSS Hover effect!
            if(!e.target.closest('#userMenuContainer')) {
                const userDrop = document.getElementById('userMenuContainer')?.querySelector('.absolute');
                if(userDrop) userDrop.classList.add('invisible', 'opacity-0');
            }
        });

        function updateCurrency() {
            document.querySelectorAll('.ui-curr-symbol').forEach(el => el.innerText = activeCurrency);
            handleSearch(); 
        }

        const urlParams = new URLSearchParams(window.location.search);
        const urlSearch = urlParams.get('search');
        const urlCategory = urlParams.get('category');
        const urlSubCat = urlParams.get('sub');

        window.onload = async function() {
            await loadLiveCurrencies(); 
            fetch(API_BASE_URL + '/public-catalog', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({}) })
            .then(res => res.json()).then(data => {
                document.getElementById('loader').style.display = 'none';
                if(data.products) {
                    allProducts = data.products.reverse(); 
                    window.globalCategories = data.categories; 
                    
                    renderCategories(data.categories); 
                    generateDynamicCategories(allProducts); // 🟢 Builds the Header Mega Menu!
                    
                    if (urlSearch) {
                        document.getElementById('nav-search').value = urlSearch;
                        handleSearch(); 
                    } else if (urlCategory && urlSubCat) {
                        filterCat(urlCategory);
                        setTimeout(() => {
                            let safeCatId = urlCategory.replace(/[^a-zA-Z0-9]/g, '');
                            let safeSubId = urlSubCat.replace(/[^a-zA-Z0-9]/g, '');
                            let subBtn = document.getElementById(`sub-link-${safeCatId}-${safeSubId}`);
                            filterSubCat(urlCategory, urlSubCat, subBtn);
                        }, 50);
                    } else if (urlCategory) {
                        filterCat(urlCategory); 
                    } else {
                        filterCat('All'); 
                    }
                } else {
                    document.getElementById('catalog-dynamic-area').innerHTML = "<p class='col-span-full text-center text-red-500 py-10 font-bold'>System Offline.</p>";
                }
            }).catch(err => {
                document.getElementById('loader').innerHTML = "<div class='text-red-500 font-bold text-center w-full'>Connection Failed.</div>";
            });
            
            // Connect Live Search listeners
            document.getElementById('nav-search')?.addEventListener('input', handleSearch);
            document.getElementById('nav-search')?.addEventListener('keypress', (e) => { if(e.key==='Enter') e.preventDefault(); });
            document.getElementById('mobile-search-input')?.addEventListener('input', handleSearch);
            document.getElementById('mobile-search-input')?.addEventListener('keypress', (e) => { if(e.key==='Enter') e.preventDefault(); });
        };

        function trackBehavior(actionType, targetId) {
            fetch(API_BASE_URL + '/buyer/track', { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({ email: currentUser ? currentUser.email : 'Anonymous', actionType: actionType, targetId: targetId, duration: 0 }) }).catch(e => console.log("Skip"));
        }

        function convertPrice(cadPrice) {
            if(!cadPrice || isNaN(cadPrice)) return "0.00";
            if (activeCurrency === "CAD" || !exchangeRates[activeCurrency]) return parseFloat(cadPrice).toFixed(2);
            return (cadPrice / exchangeRates[activeCurrency]).toFixed(2);
        }

        function renderCategories(catObj) {
            const nav = document.getElementById('categoryNav');
            let html = `<div id="btn-cat-all" class="sidebar-link active font-bold mb-3 cursor-pointer" onclick="filterCat('All', this)">🌍 Global Catalog</div>`;
            
            for (const cat in catObj) {
                let safeId = cat.replace(/[^a-zA-Z0-9]/g, '');
                html += `
                <div class="mb-1">
                    <div class="sidebar-link flex justify-between items-center cursor-pointer" id="cat-head-${safeId}" onclick="filterCat('${cat}', this)">
                        <span class="truncate pr-2">${cat}</span>
                        <i class="fas fa-chevron-down text-[10px] opacity-40 transition-transform duration-300" id="icon-${safeId}"></i>
                    </div>
                    <div id="sublist-${safeId}" class="hidden flex-col pl-4 mt-1 border-l-2 border-[var(--gold)] ml-2 space-y-1">`;
                
                catObj[cat].forEach(sub => {
                    let safeSubId = sub.replace(/[^a-zA-Z0-9]/g, '');
                    html += `<div class="sidebar-link text-xs py-2 cursor-pointer" id="sub-link-${safeId}-${safeSubId}" onclick="event.stopPropagation(); filterSubCat('${cat}', '${sub.replace(/'/g, "\\'")}', this)">${sub}</div>`;
                });
                html += `</div></div>`;
            }
            nav.innerHTML = html;
        }

        function filterCat(catName, btnElement) {
            document.querySelectorAll('.sidebar-link').forEach(b => b.classList.remove('active'));
            document.querySelectorAll('[id^="sublist-"]').forEach(el => el.classList.add('hidden'));
            document.querySelectorAll('[id^="icon-"]').forEach(el => el.style.transform = 'rotate(0deg)');
            
            if(document.getElementById('nav-search')) document.getElementById('nav-search').value = ""; 
            if(document.getElementById('mobile-search-input')) document.getElementById('mobile-search-input').value = ""; 

            if (catName === 'All') {
                document.getElementById('btn-cat-all').classList.add('active');
                document.getElementById('current-category-title').innerText = 'Global Catalog';
                renderGrid(allProducts, 'All');
                trackBehavior('click_category', 'All');
                return;
            }

            let safeId = catName.replace(/[^a-zA-Z0-9]/g, '');
            let headEl = btnElement || document.getElementById('cat-head-' + safeId);
            if (headEl) headEl.classList.add('active');
            
            let sublist = document.getElementById('sublist-' + safeId);
            let icon = document.getElementById('icon-' + safeId);
            if (sublist) {
                sublist.classList.remove('hidden');
                if(icon) icon.style.transform = 'rotate(180deg)';
            }

            document.getElementById('current-category-title').innerText = catName;
            renderCategoryHub(catName); 
            trackBehavior('click_category', catName);
        }

        function filterSubCat(catName, subCatName, btnElement) {
            let safeCatId = catName.replace(/[^a-zA-Z0-9]/g, '');
            let sublist = document.getElementById('sublist-' + safeCatId);
            if(sublist) sublist.querySelectorAll('.sidebar-link').forEach(b => b.classList.remove('active'));
            if (btnElement) btnElement.classList.add('active');

            document.getElementById('current-category-title').innerText = `${catName} - ${subCatName}`;
            renderGrid(allProducts.filter(p => p.category === catName && p.subCategory === subCatName), subCatName);
        }

        // 🟢 FIX: Search function now syncs beautifully without page reloads
        function handleSearch() {
            const deskQ = document.getElementById('nav-search')?.value.toLowerCase() || "";
            const mobQ = document.getElementById('mobile-search-input')?.value.toLowerCase() || "";
            const query = deskQ || mobQ;
            
            clearTimeout(searchTimeout);
            if(query.length > 2) searchTimeout = setTimeout(() => trackBehavior('search', query), 1000);
            
            const filtered = allProducts.filter(p => p.name.toLowerCase().includes(query) || p.category.toLowerCase().includes(query) || p.id.toLowerCase().includes(query));
            
            document.querySelectorAll('.sidebar-link').forEach(b => b.classList.remove('active'));
            document.getElementById('current-category-title').innerText = query ? `Search: "${query}"` : 'Global Catalog';
            
            renderGrid(filtered, 'Search Results');
        }

        function changeSlide(pid, direction, maxIndex) {
            if (window.currentSlides[pid] === undefined) window.currentSlides[pid] = 0;
            let current = window.currentSlides[pid];
            document.getElementById(`img-${pid}-${current}`).classList.replace('opacity-100', 'opacity-0');
            document.getElementById(`img-${pid}-${current}`).classList.replace('z-10', 'z-0');
            document.getElementById(`dot-${pid}-${current}`)?.classList.replace('w-4', 'w-2');
            document.getElementById(`dot-${pid}-${current}`)?.classList.replace('opacity-100', 'opacity-40');
            
            current = (current + direction + maxIndex) % maxIndex;
            window.currentSlides[pid] = current;
            
            document.getElementById(`img-${pid}-${current}`).classList.replace('opacity-0', 'opacity-100');
            document.getElementById(`img-${pid}-${current}`).classList.replace('z-0', 'z-10');
            document.getElementById(`dot-${pid}-${current}`)?.classList.replace('w-2', 'w-4');
            document.getElementById(`dot-${pid}-${current}`)?.classList.replace('opacity-40', 'opacity-100');
        }

        // 🟢 SYNCED: Reusable Product Card Generator
        function createProductCardHtml(p) {
            let displayPrice = convertPrice(p.startingPriceCAD);
            let moq = p.variants && p.variants.length > 0 ? p.variants[0].min : 'Contact';
            let imgs = [p.hero, ...(p.gallery || [])].filter(Boolean);
            if(imgs.length === 0) imgs = ['MC.png'];

            let sliderHtml = `<div class="relative w-full h-full overflow-hidden group/slider" id="slider-${p.id}">`;
            if (p.status === 'PAUSED') {
                sliderHtml += `<span class="badge-verified" style="background:#f3f4f6; color:#6b7280; border-color:#d1d5db;"><i class="fas fa-pause-circle" style="color:#6b7280;"></i> Unavailable</span>`;
            } else {
                sliderHtml += `<span class="badge-verified"><i class="fas fa-check-circle"></i> Verified</span>`;
            }

            let cardClass = p.status === 'PAUSED' ? 'product-card opacity-60' : 'product-card';
            imgs.forEach((img, i) => {
                let activeClass = i === 0 ? 'opacity-100 z-10' : 'opacity-0 z-0';
                sliderHtml += `<img src="${img}" class="img-layer absolute inset-0 ${activeClass}" id="img-${p.id}-${i}" loading="lazy" onerror="this.src='MC.png'">`;
            });

            if(imgs.length > 1) {
                sliderHtml += `
                    <button class="absolute left-2 top-1/2 -translate-y-1/2 w-7 h-7 bg-white/90 hover:bg-white rounded-full flex items-center justify-center opacity-0 group-hover/slider:opacity-100 transition-opacity z-20 shadow-md" onclick="event.stopPropagation(); changeSlide('${p.id}', -1, ${imgs.length})"><i class="fas fa-chevron-left text-[10px] text-gray-800"></i></button>
                    <button class="absolute right-2 top-1/2 -translate-y-1/2 w-7 h-7 bg-white/90 hover:bg-white rounded-full flex items-center justify-center opacity-0 group-hover/slider:opacity-100 transition-opacity z-20 shadow-md" onclick="event.stopPropagation(); changeSlide('${p.id}', 1, ${imgs.length})"><i class="fas fa-chevron-right text-[10px] text-gray-800"></i></button>
                    <div class="absolute bottom-3 left-0 right-0 flex justify-center gap-1.5 z-20">`;
                imgs.forEach((_, i) => {
                    let dotClass = i === 0 ? 'w-4 opacity-100' : 'w-2 opacity-40';
                    sliderHtml += `<div class="h-2 bg-white rounded-full transition-all duration-300 shadow-sm ${dotClass}" id="dot-${p.id}-${i}"></div>`;
                });
                sliderHtml += `</div>`;
            }
            sliderHtml += `</div>`;

            let safeSlug = p.name.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/(^-|-$)+/g, '');
            const displayTitle = p.short_title || p.shortTitle || p.title || p.name;

            return `
            <div class="${cardClass}" onclick="window.location.href='product.html?item=${safeSlug}&id=${p.id}'">
                <div class="img-container">${sliderHtml}</div>
                <div class="pt-2 pb-4 flex flex-col flex-1">
                    <h3 class="text-xs md:text-sm text-gray-900 leading-snug line-clamp-2 mb-1">${displayTitle}</h3>
                    <div class="mt-auto">
                        <p class="text-[15px] md:text-lg font-bold text-gray-900 font-mono leading-none">${currencySymbols[activeCurrency] || '$'}${displayPrice} <span class="text-[10px] text-gray-400 font-sans font-normal ui-curr-symbol">${activeCurrency}</span></p>
                        <p class="text-[10px] text-gray-500 mt-0.5 mb-2">MOQ: ${moq}</p>
                        <button class="btn-add-cart" onclick="addToCart(event, '${p.id}', '${p.name.replace(/'/g, "\\'")}')">
                            <i class="fas fa-plus"></i> Add to RFQ
                        </button>
                    </div>
                </div>
            </div>`;
        }

        // 🟢 SYNCED: Fixed Grid Layout (gap-3 for tighter mobile view)
        function renderGrid(products) {
            const area = document.getElementById('catalog-dynamic-area');
            const emptyState = document.getElementById('empty-state');
            document.getElementById('product-count').innerText = products.length;

            if(products.length === 0) { 
                area.innerHTML = ''; 
                emptyState.classList.remove('hidden'); 
                return; 
            }
            emptyState.classList.add('hidden');

            let gridHtml = `<div class="grid grid-cols-2 md:grid-cols-3 xl:grid-cols-4 gap-3 md:gap-6">`;
            products.forEach(p => {
                gridHtml += createProductCardHtml(p);
            });
            gridHtml += `</div>`;
            
            area.innerHTML = gridHtml;
        }

        // 🟢 SYNCED: Category Hub Layout
        function renderCategoryHub(catName) {
            const area = document.getElementById('catalog-dynamic-area');
            const emptyState = document.getElementById('empty-state');
            
            const subCats = window.globalCategories[catName] || [];
            const catProducts = allProducts.filter(p => p.category === catName);
            
            document.getElementById('product-count').innerText = catProducts.length;

            if(catProducts.length === 0) { 
                area.innerHTML = ''; 
                emptyState.classList.remove('hidden'); 
                return; 
            }
            emptyState.classList.add('hidden');

            let html = '';

            // --- A: TOP CIRCULAR NAVIGATION ---
            html += `<div class="flex gap-4 md:gap-8 overflow-x-auto pb-6 mb-8 scrollbar-hide" style="scroll-snap-type: x mandatory;">`;
            subCats.forEach(sub => {
                let subProds = catProducts.filter(p => p.subCategory === sub);
                let img = subProds.length > 0 && subProds[0].hero ? subProds[0].hero : 'MC.png';
                let safeSubId = sub.replace(/[^a-zA-Z0-9]/g, '');
                let safeCatId = catName.replace(/[^a-zA-Z0-9]/g, '');
                
                html += `
                <div class="flex flex-col items-center gap-3 cursor-pointer min-w-[80px] md:min-w-[100px] flex-shrink-0 group" style="scroll-snap-align: start;" 
                     onclick="let btn = document.getElementById('sub-link-${safeCatId}-${safeSubId}'); filterSubCat('${catName}', '${sub.replace(/'/g, "\\'")}', btn);">
                    <div class="w-16 h-16 md:w-20 md:h-20 rounded-full border-2 border-gray-200 group-hover:border-[var(--gold)] group-hover:shadow-[0_0_15px_rgba(212,175,55,0.4)] transition-all overflow-hidden bg-white p-1">
                        <img src="${img}" class="w-full h-full rounded-full object-cover mix-blend-multiply" onerror="this.src='MC.png'">
                    </div>
                    <span class="text-[10px] md:text-xs text-center font-bold text-gray-700 leading-tight group-hover:text-[var(--gold-dark)] transition-colors">${sub}</span>
                </div>`;
            });
            html += `</div>`;

            // --- B: THE GROUPED "AISLE" ROWS ---
            html += `<div class="flex flex-col gap-14">`;
            subCats.forEach(sub => {
                let subProds = catProducts.filter(p => p.subCategory === sub);
                if (subProds.length > 0) {
                    let safeSubId = sub.replace(/[^a-zA-Z0-9]/g, '');
                    let safeCatId = catName.replace(/[^a-zA-Z0-9]/g, '');
                    html += `
                    <div>
                        <div class="flex justify-between items-end border-b border-gray-200 pb-3 mb-6">
                            <h3 class="text-xl md:text-2xl font-bold brand-font text-gray-900">${sub}</h3>
                            <button class="text-[var(--gold-dark)] text-[10px] md:text-xs font-bold uppercase tracking-widest hover:text-black transition" 
                                    onclick="let btn = document.getElementById('sub-link-${safeCatId}-${safeSubId}'); filterSubCat('${catName}', '${sub.replace(/'/g, "\\'")}', btn); window.scrollTo(0,0);">
                                View More <i class="fas fa-arrow-right ml-1"></i>
                            </button>
                        </div>
                        <div class="grid grid-cols-2 md:grid-cols-3 xl:grid-cols-4 gap-3 md:gap-6">`; // 🟢 Fixed gap here too!
                    
                    subProds.slice(0, 4).forEach(p => {
                        html += createProductCardHtml(p);
                    });

                    html += `</div></div>`;
                }
            });
            html += `</div>`;

            area.innerHTML = html;
        }

        // ==========================================
        // 🟢 SYNCED: HEADER & MOBILE MENU LOGIC
        // ==========================================
        function toggleMobileSearch() {
            const searchDropdown = document.getElementById('mobile-search-dropdown');
            const searchInput = document.getElementById('mobile-search-input');
            if (searchDropdown.classList.contains('-translate-y-full')) {
                searchDropdown.classList.remove('-translate-y-full', 'opacity-0', 'pointer-events-none');
                searchDropdown.classList.add('translate-y-0', 'opacity-100', 'pointer-events-auto');
                setTimeout(() => searchInput.focus(), 300); 
            } else {
                searchDropdown.classList.add('-translate-y-full', 'opacity-0', 'pointer-events-none');
                searchDropdown.classList.remove('translate-y-0', 'opacity-100', 'pointer-events-auto');
            }
        }
        function openMobileMenu() {
            const menu = document.getElementById('mobile-category-menu');
            menu.classList.remove('translate-y-full');
            menu.classList.add('translate-y-0');
            document.body.style.overflow = 'hidden';
        }
        function closeMobileMenu() {
            const menu = document.getElementById('mobile-category-menu');
            menu.classList.remove('translate-y-0');
            menu.classList.add('translate-y-full');
            document.body.style.overflow = '';
        }
        function toggleMobileCat(id) {
            const submenu = document.getElementById(id);
            const icon = document.getElementById('icon-' + id);
            if (!submenu.classList.contains('hidden')) {
                submenu.classList.add('hidden'); icon.classList.remove('rotate-180'); return;
            }
            document.querySelectorAll('.mobile-submenu').forEach(el => el.classList.add('hidden'));
            document.querySelectorAll('[id^="icon-mob-cat-"]').forEach(el => el.classList.remove('rotate-180'));
            submenu.classList.remove('hidden'); icon.classList.add('rotate-180');
        }
        function switchMegaPanel(panelId, element) {
            document.querySelectorAll('.mega-cat-item').forEach(item => item.classList.remove('active'));
            element.classList.add('active');
            document.querySelectorAll('.mega-panel').forEach(panel => panel.classList.remove('active'));
            const targetPanel = document.getElementById(panelId);
            if(targetPanel) targetPanel.classList.add('active');
        }

        // ==========================================
        // 🟢 SYNCED: DYNAMIC MEGA MENU BUILDER
        // ==========================================
        function generateDynamicCategories(products) {
            const catTree = {};
            products.forEach(p => {
                if(!p.category) return;
                if(!catTree[p.category]) catTree[p.category] = new Set();
                if(p.subCategory) catTree[p.category].add(p.subCategory);
            });

            const catIcons = {
                "Agriculture, Food & Beverage": "fa-seedling", "Apparel, Textiles & Accessories": "fa-tshirt",
                "Automotive & Transportation": "fa-car", "Beauty & Personal Care": "fa-spa",
                "Chemicals & Raw Materials": "fa-flask", "Construction & Real Estate": "fa-building",
                "Consumer Electronics & Appliances": "fa-laptop", "Electrical & Renewable Energy": "fa-solar-panel",
                "Electronic Components & IoT": "fa-microchip", "Fabrication & B2B Services": "fa-cogs",
                "Health & Medical": "fa-stethoscope", "Home Decor, Garden & Furniture": "fa-couch",
                "Industrial Machinery & Equipment": "fa-industry", "Jewelry, Eyewear & Watches": "fa-gem",
                "Minerals, Metals & Metallurgy": "fa-cubes", "Packaging & Printing": "fa-box",
                "Sports, Toys & Hobbies": "fa-dumbbell", "Tools, Hardware & Safety": "fa-tools"
            };

            function getSubIcon(name, fallback) {
                const n = name.toLowerCase();
                if(n.includes('candle')) return 'fa-fire text-orange-500';
                if(n.includes('device') || n.includes('stethoscope')) return 'fa-stethoscope text-blue-500';
                if(n.includes('furniture') || n.includes('bed')) return 'fa-procedures text-teal-600';
                if(n.includes('disposable') || n.includes('syringe')) return 'fa-syringe text-gray-700';
                if(n.includes('mobility') || n.includes('wheelchair')) return 'fa-wheelchair text-blue-600';
                if(n.includes('supplement') || n.includes('pill')) return 'fa-pills text-green-600';
                if(n.includes('produce') || n.includes('apple')) return 'fa-apple-alt text-red-500';
                if(n.includes('coffee') || n.includes('tea')) return 'fa-coffee text-amber-800';
                if(n.includes('clothing')) return 'fa-tshirt text-indigo-500';
                if(n.includes('footwear')) return 'fa-shoe-prints text-orange-700';
                if(n.includes('auto part')) return 'fa-cogs text-gray-600';
                if(n.includes('skincare')) return 'fa-spa text-pink-400';
                if(n.includes('tile') || n.includes('floor')) return 'fa-border-all text-stone-500';
                if(n.includes('mobile')) return 'fa-mobile-alt text-gray-800';
                if(n.includes('computer')) return 'fa-laptop text-slate-700';
                if(n.includes('solar')) return 'fa-solar-panel text-blue-400';
                if(n.includes('pcb')) return 'fa-microchip text-emerald-600';
                if(n.includes('kitchenware')) return 'fa-utensils text-gray-500';
                if(n.includes('packaging mach')) return 'fa-box-open text-amber-600';
                if(n.includes('jewelry')) return 'fa-gem text-purple-500';
                if(n.includes('box')) return 'fa-box text-yellow-600';
                if(n.includes('fitness')) return 'fa-dumbbell text-zinc-800';
                if(n.includes('tool')) return 'fa-tools text-slate-600';
                return fallback || "fa-th-large text-gray-400";
            }

            let deskSidebarHTML = '', deskPanelsHTML = '', mobMenuHTML = '';
            let index = 0;

            for (const [cat, subcats] of Object.entries(catTree).sort()) {
                const safeId = 'dyn-cat-' + index;
                const mainIcon = catIcons[cat] || "fa-th-large";
                const encodedCat = encodeURIComponent(cat);

                deskSidebarHTML += `<div class="mega-cat-item ${index===0?'active':''}" onmouseenter="switchMegaPanel('${safeId}', this)" onclick="window.location.href='catalog.html?category=${encodedCat}'">${cat} <i class="fas fa-chevron-right"></i></div>`;

                let subcatGridHTML = '';
                Array.from(subcats).sort().forEach(sub => {
                    const specificIcon = getSubIcon(sub, mainIcon);
                    subcatGridHTML += `<div class="subcat-item hover:bg-gray-50 rounded-lg p-2 transition" onclick="window.location.href='catalog.html?category=${encodedCat}&sub=${encodeURIComponent(sub)}'"><div class="subcat-icon bg-white shadow-sm border border-gray-100"><i class="fas ${specificIcon}"></i></div><div class="subcat-name text-left ml-2">${sub}</div></div>`;
                });
                subcatGridHTML += `<div class="subcat-item hover:bg-gray-50 rounded-lg p-2 transition" onclick="window.location.href='catalog.html?category=${encodedCat}'"><div class="subcat-icon bg-[var(--gold-light)]"><i class="fas fa-arrow-right text-[var(--gold-dark)]"></i></div><div class="subcat-name text-[var(--gold-dark)] text-left ml-2">View All</div></div>`;
                
                deskPanelsHTML += `<div id="${safeId}" class="mega-panel ${index===0?'active':''}"><h3 class="text-sm font-bold text-gray-900 border-b border-gray-100 pb-3 mb-4 brand-font uppercase tracking-widest">${cat}</h3><div class="grid grid-cols-2 md:grid-cols-3 gap-3">${subcatGridHTML}</div></div>`;

                let mobSubLinks = '';
                Array.from(subcats).sort().forEach(sub => {
                    mobSubLinks += `<a href="catalog.html?category=${encodedCat}&sub=${encodeURIComponent(sub)}" class="flex items-center gap-3 py-3 px-6 text-sm text-gray-600 border-b border-gray-200"><i class="fas ${getSubIcon(sub, mainIcon)} w-5 text-center"></i> ${sub}</a>`;
                });
                mobSubLinks += `<a href="catalog.html?category=${encodedCat}" class="block py-3 px-6 text-sm font-bold text-[var(--gold-dark)]">View All ${cat.split(',')[0]} &rarr;</a>`;

                mobMenuHTML += `<div class="bg-white border-b border-gray-200"><button onclick="toggleMobileCat('mob-${safeId}')" class="w-full flex items-center justify-between p-5 text-sm font-bold text-gray-800 hover:text-[var(--gold-dark)] transition">${cat} <i id="icon-mob-${safeId}" class="fas fa-chevron-down text-gray-400 transition-transform duration-300"></i></button><div id="mob-${safeId}" class="mobile-submenu hidden bg-gray-50 border-t border-gray-100">${mobSubLinks}</div></div>`;

                index++;
            }

            const dSide = document.getElementById('dynamic-mega-sidebar');
            const dPanel = document.getElementById('dynamic-mega-panels');
            const mMenu = document.getElementById('dynamic-mobile-menu');

            if(dSide) dSide.innerHTML = deskSidebarHTML;
            if(dPanel) dPanel.innerHTML = deskPanelsHTML;
            if(mMenu) mMenu.innerHTML = mobMenuHTML;
        }
    </script>
</body>
</html>
