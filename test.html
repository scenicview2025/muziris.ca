<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Muziris | Global Sourcing Catalog</title>
    <link rel="icon" type="image/png" href="MC.png">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        body { 
            background-color: #FAFAFA; /* Soft pearl background */
            color: #111827; 
            font-family: 'Inter', sans-serif; 
            -webkit-font-smoothing: antialiased;
        }
        .brand-font { font-family: 'Cinzel', serif; }
        .gold-text { color: #D4AF37; }
        .gold-bg { background-color: #D4AF37; }
        .dark-void { background-color: #0b0e14; }
        
        /* Premium sticky header with glassmorphism */
        .glass-header {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-bottom: 1px solid rgba(0,0,0,0.05);
        }

        /* High-end product card interactions */
        .product-card {
            background: #FFFFFF;
            border: 1px solid rgba(0,0,0,0.04);
            border-radius: 12px;
            transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            overflow: hidden;
        }
        .product-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 20px 40px rgba(0,0,0,0.06), 0 1px 3px rgba(0,0,0,0.02);
            border-color: rgba(212, 175, 55, 0.3); /* Subtle gold border on hover */
        }
        
        /* Image zoom effect on hover */
        .img-container img { transition: transform 0.6s ease; }
        .product-card:hover .img-container img { transform: scale(1.05); }

        /* Custom subtle scrollbar */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #e5e7eb; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #D4AF37; }

        /* Loading skeleton pulse */
        @keyframes pulse-bg {
            0% { background-color: #f3f4f6; }
            50% { background-color: #e5e7eb; }
            100% { background-color: #f3f4f6; }
        }
        .skeleton { animation: pulse-bg 1.5s infinite; }
    </style>
</head>
<body class="min-h-screen flex flex-col">

    <header class="glass-header sticky top-0 z-50 transition-all">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-20 flex items-center justify-between">
            
            <div class="flex items-center gap-2 cursor-pointer" onclick="window.location.href='/'">
                <h1 class="text-2xl font-bold tracking-widest text-gray-900 brand-font uppercase">Muziris</h1>
            </div>

            <div class="hidden md:flex flex-1 max-w-2xl mx-10">
                <div class="relative w-full">
                    <input type="text" id="searchInput" placeholder="Search products, suppliers, or HS codes..." 
                           class="w-full bg-gray-50 border border-gray-200 text-gray-900 text-sm rounded-full focus:ring-[#D4AF37] focus:border-[#D4AF37] block pl-10 p-3 transition-colors outline-none" onkeyup="filterCatalog()">
                    <div class="absolute inset-y-0 left-0 flex items-center pl-4 pointer-events-none">
                        <i class="fas fa-search text-gray-400"></i>
                    </div>
                </div>
            </div>

            <div class="flex items-center space-x-6">
                <button class="text-gray-500 hover:text-gray-900 transition text-sm font-bold tracking-widest uppercase">
                    Buyer Login
                </button>
                <button class="dark-void text-[#D4AF37] border border-[#0b0e14] px-5 py-2.5 rounded-full text-xs font-bold tracking-[0.15em] uppercase hover:bg-black transition shadow-md flex items-center gap-2">
                    <i class="fas fa-clipboard-list"></i> My RFQs
                </button>
            </div>
        </div>
    </header>

    <main class="flex-1 max-w-7xl mx-auto w-full px-4 sm:px-6 lg:px-8 py-8 flex flex-col md:flex-row gap-8">
        
        <aside class="w-full md:w-64 flex-shrink-0">
            <div class="sticky top-28 space-y-8">
                
                <div>
                    <h3 class="text-xs font-bold text-gray-400 uppercase tracking-[0.2em] mb-4">Categories</h3>
                    <div class="space-y-2" id="category-filters">
                        <button class="cat-btn block w-full text-left px-3 py-2 rounded-lg text-sm font-medium bg-[#0b0e14] text-[#D4AF37] transition" onclick="setActiveCategory('All', this)">All Products</button>
                        <button class="cat-btn block w-full text-left px-3 py-2 rounded-lg text-sm font-medium text-gray-600 hover:bg-gray-100 transition" onclick="setActiveCategory('Machinery', this)">Industrial Machinery</button>
                        <button class="cat-btn block w-full text-left px-3 py-2 rounded-lg text-sm font-medium text-gray-600 hover:bg-gray-100 transition" onclick="setActiveCategory('Textiles', this)">Textiles & Apparel</button>
                        <button class="cat-btn block w-full text-left px-3 py-2 rounded-lg text-sm font-medium text-gray-600 hover:bg-gray-100 transition" onclick="setActiveCategory('Construction', this)">Construction Materials</button>
                    </div>
                </div>

                <div class="bg-white border border-gray-200 p-5 rounded-xl shadow-sm">
                    <div class="flex items-center gap-3 mb-2">
                        <i class="fas fa-shield-alt text-[#D4AF37] text-xl"></i>
                        <h4 class="font-bold text-gray-900 text-sm tracking-wide">Escrow Protected</h4>
                    </div>
                    <p class="text-xs text-gray-500 leading-relaxed">All Muziris transactions are secured. Funds are held until destination delivery is confirmed.</p>
                </div>

            </div>
        </aside>

        <div class="flex-1">
            <div class="flex justify-between items-end mb-6">
                <div>
                    <h2 class="text-2xl font-bold text-gray-900 brand-font" id="current-category-title">Global Ledger</h2>
                    <p class="text-sm text-gray-500 mt-1">Showing <span id="product-count" class="font-bold text-gray-900">0</span> verified products</p>
                </div>
                <select class="bg-white border border-gray-200 text-gray-700 text-xs rounded-lg focus:ring-[#D4AF37] focus:border-[#D4AF37] block p-2.5 outline-none font-medium cursor-pointer shadow-sm">
                    <option>Sort by: Recommended</option>
                    <option>Price: Low to High</option>
                    <option>Price: High to Low</option>
                    <option>Newest Arrivals</option>
                </select>
            </div>

            <div id="catalog-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6">
                <div class="product-card p-4 h-80 flex flex-col justify-between">
                    <div class="w-full h-40 skeleton rounded-lg"></div>
                    <div class="h-4 w-3/4 skeleton rounded mt-4"></div>
                    <div class="h-4 w-1/2 skeleton rounded mt-2"></div>
                    <div class="h-8 w-full skeleton rounded mt-4"></div>
                </div>
                <div class="product-card p-4 h-80 flex flex-col justify-between">
                    <div class="w-full h-40 skeleton rounded-lg"></div>
                    <div class="h-4 w-3/4 skeleton rounded mt-4"></div>
                    <div class="h-4 w-1/2 skeleton rounded mt-2"></div>
                    <div class="h-8 w-full skeleton rounded mt-4"></div>
                </div>
                <div class="product-card p-4 h-80 flex flex-col justify-between hidden sm:flex">
                    <div class="w-full h-40 skeleton rounded-lg"></div>
                    <div class="h-4 w-3/4 skeleton rounded mt-4"></div>
                    <div class="h-4 w-1/2 skeleton rounded mt-2"></div>
                    <div class="h-8 w-full skeleton rounded mt-4"></div>
                </div>
            </div>

            <div id="empty-state" class="hidden text-center py-20 bg-white border border-dashed border-gray-300 rounded-xl mt-6">
                <i class="fas fa-box-open text-4xl text-gray-300 mb-4"></i>
                <h3 class="text-lg font-bold text-gray-900">No products found</h3>
                <p class="text-sm text-gray-500 mt-1">Try adjusting your search or category filters.</p>
                <button onclick="clearFilters()" class="mt-4 text-[#D4AF37] font-bold text-xs uppercase tracking-widest hover:underline">Clear Filters</button>
            </div>
        </div>
    </main>

    <script>
        // 🟢 GLOBAL INVENTORY STATE
        let globalInventory = [];
        let currentCategory = 'All';

        // 🟢 DUMMY DATA (Fallback if API is empty/not connected yet)
        const dummyData = [
            { product_id: 'P-101', product_name: 'Industrial CNC Lathe Machine', main_category: 'Machinery', price: '45,000.00', currency: 'USD', moq: '1 Unit', img: 'https://images.unsplash.com/photo-1565439399-fd8b64e0a969?q=80&w=600&auto=format&fit=crop', supplier_name: 'Stark Manufacturing Ltd.' },
            { product_id: 'P-102', product_name: 'Premium Woven Organic Cotton Roll', main_category: 'Textiles', price: '4.50', currency: 'USD', moq: '1000 Meters', img: 'https://images.unsplash.com/photo-1620799140408-edc6dcb6d633?q=80&w=600&auto=format&fit=crop', supplier_name: 'Global Weaves Co.' },
            { product_id: 'P-103', product_name: 'Heavy Duty Steel I-Beams (A36)', main_category: 'Construction', price: '850.00', currency: 'USD', moq: '20 Tons', img: 'https://images.unsplash.com/photo-1518709268805-4e9042af9f23?q=80&w=600&auto=format&fit=crop', supplier_name: 'Apex Steelworks' },
            { product_id: 'P-104', product_name: 'Automated Packaging Conveyor System', main_category: 'Machinery', price: '12,500.00', currency: 'USD', moq: '1 Set', img: 'https://images.unsplash.com/photo-1581091226825-a6a2a5aee158?q=80&w=600&auto=format&fit=crop', supplier_name: 'Stark Manufacturing Ltd.' },
        ];

        // 🟢 INITIALIZE CATALOG
        window.onload = async function() {
            try {
                // Try to fetch real products from your backend
                const res = await fetch("https://muziris-api.onrender.com/api/get-all-inventory");
                const data = await res.json();
                
                // If backend returns data, use it. Otherwise, use dummy data to show UI.
                if(data && data.length > 0) {
                    globalInventory = data.filter(item => item.status === 'LIVE' || item.status === 'ACTIVE');
                } else {
                    globalInventory = dummyData;
                }
            } catch (err) {
                console.log("API not ready, using fallback UI data.", err);
                globalInventory = dummyData; // Fallback so page always looks good
            }

            renderGrid(globalInventory);
        };

        // 🟢 RENDER THE PRODUCT GRID
        function renderGrid(products) {
            const grid = document.getElementById('catalog-grid');
            const emptyState = document.getElementById('empty-state');
            document.getElementById('product-count').innerText = products.length;

            if (products.length === 0) {
                grid.innerHTML = '';
                emptyState.classList.remove('hidden');
                return;
            }

            emptyState.classList.add('hidden');
            let html = '';

            products.forEach(item => {
                let imgUrl = item.hero_img || item.img || 'MC.png';
                let priceDisplay = item.price ? `${item.currency || 'USD'} ${item.price}` : 'Request Quote';
                
                html += `
                <div class="product-card group cursor-pointer" onclick="viewProduct('${item.product_id}')">
                    <div class="h-56 bg-[#f8f9fa] flex items-center justify-center relative img-container border-b border-gray-100 p-4">
                        <img src="${imgUrl}" alt="${item.product_name}" class="max-h-full max-w-full object-contain mix-blend-multiply">
                        <span class="absolute top-3 right-3 bg-white text-gray-900 px-2.5 py-1 text-[9px] font-bold uppercase tracking-widest rounded shadow-sm border border-gray-100">
                            <i class="fas fa-check-circle text-[#D4AF37] mr-1"></i> Verified
                        </span>
                    </div>
                    
                    <div class="p-5 flex flex-col justify-between h-[200px]">
                        <div>
                            <p class="text-[10px] text-[#D4AF37] uppercase tracking-[0.15em] font-bold mb-1 truncate">${item.main_category}</p>
                            <h3 class="text-sm font-bold text-gray-900 leading-snug line-clamp-2 mb-2 group-hover:text-[#D4AF37] transition-colors">${item.product_name}</h3>
                            <p class="text-xs text-gray-500 truncate mb-4"><i class="fas fa-industry text-gray-300 mr-1"></i> ${item.supplier_name || 'Muziris Verified Supplier'}</p>
                        </div>
                        
                        <div>
                            <div class="flex justify-between items-end mb-4">
                                <div>
                                    <p class="text-[10px] text-gray-400 uppercase tracking-widest font-bold">MOQ</p>
                                    <p class="text-xs font-semibold text-gray-900">${item.moq || 'Contact Supplier'}</p>
                                </div>
                                <div class="text-right">
                                    <p class="text-[10px] text-gray-400 uppercase tracking-widest font-bold">Est. Price</p>
                                    <p class="text-sm font-mono font-bold text-gray-900">${priceDisplay}</p>
                                </div>
                            </div>
                            
                            <button class="w-full bg-white border border-gray-300 text-gray-900 font-bold py-2.5 rounded-lg text-[10px] uppercase tracking-[0.15em] group-hover:bg-[#0b0e14] group-hover:text-[#D4AF37] group-hover:border-[#0b0e14] transition-all duration-300 shadow-sm">
                                Request Custom Quote
                            </button>
                        </div>
                    </div>
                </div>
                `;
            });

            grid.innerHTML = html;
        }

        // 🟢 FILTER LOGIC
        function filterCatalog() {
            const searchTerm = document.getElementById('searchInput').value.toLowerCase();
            
            const filtered = globalInventory.filter(item => {
                const matchesSearch = item.product_name.toLowerCase().includes(searchTerm) || 
                                      (item.main_category && item.main_category.toLowerCase().includes(searchTerm));
                const matchesCat = currentCategory === 'All' || item.main_category === currentCategory;
                
                return matchesSearch && matchesCat;
            });

            renderGrid(filtered);
        }

        function setActiveCategory(category, btnElement) {
            currentCategory = category;
            document.getElementById('current-category-title').innerText = category === 'All' ? 'Global Ledger' : category;
            
            // Reset all buttons to gray
            document.querySelectorAll('.cat-btn').forEach(btn => {
                btn.className = "cat-btn block w-full text-left px-3 py-2 rounded-lg text-sm font-medium text-gray-600 hover:bg-gray-100 transition";
            });
            
            // Set active button to dark/gold
            btnElement.className = "cat-btn block w-full text-left px-3 py-2 rounded-lg text-sm font-medium bg-[#0b0e14] text-[#D4AF37] transition shadow-md";
            
            filterCatalog();
        }

        function clearFilters() {
            document.getElementById('searchInput').value = '';
            // Click the 'All' category button
            document.querySelector('.cat-btn').click(); 
        }

        function viewProduct(productId) {
            // In the future, this routes to product-details?id=XYZ
            alert("Routing buyer to detailed product spec sheet for ID: " + productId);
        }
    </script>
</body>
</html>
