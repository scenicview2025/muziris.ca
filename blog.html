<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-GBXY659LSC"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());

      gtag('config', 'G-GBXY659LSC');
    </script>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="page-title">Muziris Journal | Loading...</title>
    <meta name="keywords" id="page-seo" content="B2B Trade, Indian suppliers">
    <link rel="icon" type="image/png" href="MC.png">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=Inter:wght@400;500;600;700;800&family=Lora:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
    
    <style>
        :root { --gold: #D4AF37; --gold-dark: #b89225; --void: #0b0e14; }
        body { background-color: #FAFAFA; color: #111827; font-family: 'Inter', sans-serif; -webkit-font-smoothing: antialiased; }
        .brand-font { font-family: 'Cinzel', serif; }
        .glass-header { background: rgba(255, 255, 255, 0.98); backdrop-filter: blur(12px); border-bottom: 1px solid rgba(0,0,0,0.05); position: sticky; top: 0; z-index: 50; }
        #scroll-progress { position: fixed; top: 0; left: 0; height: 3px; background: var(--gold); width: 0%; z-index: 1000; transition: width 0.1s ease-out; box-shadow: 0 0 10px rgba(212,175,55,0.5); }
        .article-content p { margin-bottom: 1.8rem; font-size: 1.125rem; line-height: 1.8; color: #374151; }
        .article-content h2 { font-family: 'Cinzel', serif; font-size: 1.75rem; font-weight: 700; color: #111827; margin-top: 3rem; margin-bottom: 1rem; }
        .article-content blockquote { border-left: 4px solid var(--gold); padding-left: 1.5rem; margin: 2.5rem 0; font-family: 'Lora', serif; font-size: 1.35rem; font-style: italic; color: #111827; background: linear-gradient(to right, rgba(212,175,55,0.05), transparent); padding-top: 1rem; padding-bottom: 1rem; }
        .article-content img { border-radius: 12px; margin: 2.5rem 0; width: 100%; box-shadow: 0 10px 30px rgba(0,0,0,0.05); }
        .share-btn { transition: all 0.3s ease; border: 1px solid #e5e7eb; cursor: pointer;}
        .share-btn:hover.linkedin { background: #0A66C2; color: white; border-color: #0A66C2; }
        .share-btn:hover.email { background: var(--gold); color: black; border-color: var(--gold); }
        
        /* Loading Skeleton */
        .skeleton { background: #e5e7eb; border-radius: 4px; animation: pulse 1.5s infinite; }
        @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.5; } 100% { opacity: 1; } }
    </style>
</head>
<body>
    <div id="scroll-progress"></div>
    
    <header class="glass-header">
      <div class="max-w-[1600px] mx-auto px-4 md:px-8 h-20 flex items-center justify-between">
        <div class="flex items-center gap-4">
          <h1 class="text-3xl font-bold tracking-[0.1em] text-gray-900 brand-font m-0 cursor-pointer" onclick="window.location.href='index1.html'">Muziris</h1>
        </div>
        <div class="flex items-center gap-6">
            <a href="catalog.html" class="hidden md:block text-xs font-bold uppercase tracking-widest text-gray-500 hover:text-gray-900">Global Catalog</a>
            <button onclick="window.location.href='rfq.html'" class="bg-[var(--void)] text-[var(--gold)] px-6 py-2.5 rounded text-xs font-bold uppercase tracking-widest shadow-md">Submit RFQ</button>
        </div>
      </div>
    </header>

    <main class="max-w-[800px] mx-auto px-5 py-12 md:py-20">
        
        <div id="loading-state" style="text-align: center; padding: 100px 0;">
            <div class="skeleton" style="width: 200px; height: 15px; margin: 0 auto 20px;"></div>
            <div class="skeleton" style="width: 80%; height: 50px; margin: 0 auto 20px;"></div>
            <div class="skeleton" style="width: 100%; height: 300px; margin: 0 auto 40px; border-radius: 12px;"></div>
            <div class="skeleton" style="width: 100%; height: 20px; margin-bottom: 10px;"></div>
            <div class="skeleton" style="width: 90%; height: 20px; margin-bottom: 10px;"></div>
            <div class="skeleton" style="width: 95%; height: 20px;"></div>
        </div>

        <div id="article-state" style="display: none;">
            <header class="text-center mb-12">
                <div id="display-category" class="text-[var(--gold-dark)] text-xs font-bold uppercase tracking-widest mb-4"></div>
                <h1 id="display-title" class="text-3xl md:text-5xl font-bold text-gray-900 brand-font leading-tight mb-6"></h1>
                <div class="flex items-center justify-center gap-4 text-sm text-gray-500 font-medium">
                    <span><i class="fas fa-pen-nib mr-1"></i> <span id="display-author"></span></span>
                    <span>•</span>
                    <span><i class="far fa-clock mr-1"></i> <span id="display-time"></span></span>
                    <span>•</span>
                    <span id="display-date"></span>
                </div>
            </header>

            <div class="w-full aspect-video bg-gray-200 rounded-2xl overflow-hidden mb-12 shadow-lg relative">
                <div class="absolute inset-0 bg-black/10 z-10"></div>
                <img id="display-image" src="" alt="Article Hero" class="w-full h-full object-cover relative z-0">
            </div>

            <article id="display-content" class="article-content">
                </article>

            <div class="mt-16 pt-8 border-t border-gray-100 flex flex-col md:flex-row items-center justify-between gap-4">
                <span class="text-sm font-bold text-gray-400 uppercase tracking-widest">Share this Insight</span>
                <div class="flex flex-wrap justify-center gap-3">
                    <button onclick="shareToLinkedIn()" class="share-btn linkedin flex items-center gap-2 px-5 py-2.5 rounded-full text-sm font-bold text-gray-600 bg-white shadow-sm transition">
                        <i class="fab fa-linkedin-in" style="color: #0077b5;"></i> LinkedIn
                    </button>
                    <button onclick="shareToTwitter()" class="share-btn flex items-center gap-2 px-5 py-2.5 rounded-full text-sm font-bold text-gray-600 bg-white shadow-sm hover:bg-blue-50 transition" style="border-color: #e5e7eb;">
                        <i class="fab fa-twitter" style="color: #1DA1F2;"></i> Twitter
                    </button>
                    <button id="copyLinkBtn" onclick="copyArticleLink()" class="share-btn flex items-center gap-2 px-5 py-2.5 rounded-full text-sm font-bold text-gray-600 bg-white shadow-sm hover:bg-gray-50 transition" style="border-color: #e5e7eb;">
                        <i class="fas fa-link"></i> Copy Link
                    </button>
                </div>
            </div>
        </div>

        <div id="error-state" style="display: none; text-align: center; padding: 100px 0;">
            <h2 class="text-2xl font-bold text-gray-900 mb-4">Article Not Found</h2>
            <p class="text-gray-500 mb-8">The trade insight you are looking for does not exist or has been moved.</p>
            <button onclick="window.location.href='index1.html'" class="bg-[var(--gold)] text-black px-6 py-3 rounded font-bold uppercase tracking-widest">Return Home</button>
        </div>

        <section class="mt-16 bg-[var(--void)] rounded-3xl p-10 md:p-14 text-center relative overflow-hidden shadow-2xl">
            <div class="absolute inset-0 opacity-5 bg-[url('MC.png')] bg-center bg-cover mix-blend-overlay"></div>
            <h2 class="text-2xl md:text-3xl font-bold text-white brand-font mb-4 relative z-10">Source Like the Ancients.</h2>
            <p class="text-gray-400 text-sm md:text-base max-w-lg mx-auto mb-8 relative z-10 leading-relaxed">Skip the middlemen. Connect directly with India's highest-tier, verified manufacturers.</p>
            <button onclick="window.location.href='catalog.html'" class="relative z-10 bg-[var(--gold)] hover:bg-[var(--gold-dark)] text-black font-bold uppercase tracking-widest px-8 py-4 rounded-lg text-sm shadow-[0_10px_20px_rgba(212,175,55,0.2)]">Explore the Global Catalog</button>
        </section>
    </main>

    <script>
        // Progress Bar
        window.onscroll = function() {
            let winScroll = document.body.scrollTop || document.documentElement.scrollTop;
            let height = document.documentElement.scrollHeight - document.documentElement.clientHeight;
            let scrolled = (winScroll / height) * 100;
            document.getElementById("scroll-progress").style.width = scrolled + "%";
        };

        // 🟢 THE DYNAMIC CMS ENGINE
        async function fetchArticle() {
            // 1. Get the ID from the URL (e.g., blog.html?id=1)
            const urlParams = new URLSearchParams(window.location.search);
            const articleId = urlParams.get('id');

            if (!articleId) {
                document.getElementById('loading-state').style.display = 'none';
                document.getElementById('error-state').style.display = 'block';
                return;
            }

            try {
                // 2. Fetch the data from your Render Server
                const response = await fetch(`https://muziris-api.onrender.com/api/blogs/${articleId}`);
                const data = await response.json();

                if (data.success && data.blog) {
                    const blog = data.blog;

                    // 3. Inject data into the page
                    document.title = `Muziris Journal | ${blog.title}`;
                    document.getElementById('page-title').innerText = `Muziris Journal | ${blog.title}`;
                    document.getElementById('page-seo').setAttribute('content', blog.seo_keywords || 'Muziris, B2B Trade');
                    
                    document.getElementById('display-category').innerText = blog.category;
                    document.getElementById('display-title').innerText = blog.title;
                    document.getElementById('display-author').innerText = blog.author;
                    document.getElementById('display-time').innerText = blog.read_time;
                    document.getElementById('display-date').innerText = blog.publish_date;
                    document.getElementById('display-image').src = blog.image_url || 'ship.jpg'; // Fallback
                    document.getElementById('display-content').innerHTML = blog.content;

                    // 4. Hide loading, show article
                    document.getElementById('loading-state').style.display = 'none';
                    document.getElementById('article-state').style.display = 'block';
                } else {
                    throw new Error("Blog not found");
                }
            } catch (error) {
                console.error("Error fetching article:", error);
                document.getElementById('loading-state').style.display = 'none';
                document.getElementById('error-state').style.display = 'block';
            }
        }

        // Run the fetch when the page loads
        window.onload = fetchArticle;
    </script>
</body>
</html>
