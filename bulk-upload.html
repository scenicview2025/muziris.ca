<script>
    // 🚀 POINTING TO THE NEW NODE.JS RENDER SERVER
    const API_BASE_URL = "https://muziris-api.onrender.com/api";
    
    window.onload = function() {
      const verifiedId = sessionStorage.getItem('verifiedSupplierId');
      const verifiedCurrency = sessionStorage.getItem('verifiedCurrency'); 
      
      if (!verifiedId) {
        window.location.href = 'suppliers.html'; 
      } else {
        document.getElementById('supId').value = verifiedId;
        window.officialCurrency = verifiedCurrency || "USD"; 
        document.getElementById('mainUI').style.display = 'block';
        
        // Fetch master categories from Node.js
        fetch(API_BASE_URL + '/categories', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' }
        })
        .then(r => r.json())
        .then(data => {
          if(!data.Error) window.masterCategories = data;
        });
      }
    };

    let csvData = [];
    let mediaFiles = [];
    window.masterCategories = null; 
    
    // Listeners for UI updates
    document.getElementById('csvInput').addEventListener('change', function(e) {
      if(e.target.files.length > 0) document.getElementById('csvLabel').innerText = "✔ " + e.target.files[0].name;
    });
    document.getElementById('mediaInput').addEventListener('change', function(e) {
      mediaFiles = Array.from(e.target.files);
      if(mediaFiles.length > 0) document.getElementById('mediaLabel').innerText = "✔ " + mediaFiles.length + " media files selected";
    });

    function showError(msg) {
      const box = document.getElementById('alertBox');
      box.className = "alert error";
      box.innerHTML = "<strong>Validation Failed:</strong><br>" + msg;
      box.style.display = "block";
      document.getElementById('submitBtn').disabled = false;
      document.getElementById('submitBtn').innerText = "Validate & Submit Catalog";
    }

    function logProgress(msg) {
      const log = document.getElementById('log');
      log.innerHTML += `<div>${msg}</div>`;
      log.scrollTop = log.scrollHeight;
    }

    async function processUpload() {
      const supId = document.getElementById('supId').value.trim().toUpperCase();
      const csvFile = document.getElementById('csvInput').files[0];

      if (!supId) return showError("Authentication Error. Please return to the main portal and log in again.");
      if (!csvFile) return showError("Please upload your CSV file.");

      document.getElementById('submitBtn').disabled = true;
      document.getElementById('submitBtn').innerText = "Analyzing Catalog...";
      document.getElementById('alertBox').style.display = "none";
      document.getElementById('log').innerHTML = "";

      // 1. READ CSV (PapaParse)
      Papa.parse(csvFile, {
        header: true,
        skipEmptyLines: true,
        complete: async function(results) {
          csvData = results.data;
          await validateAndExecute(supId);
        }
      });
    }

    async function validateAndExecute(supId) {
      let requiredImages = new Set();
      let imageColumns = ["Hero Img", "Life Img", "CloseUp Img", "Pack Img", "Extra Img", "Variant Img", "Catalog PDF"];
      
      let rowNum = 1; 
      
      for(let row of csvData) {
        rowNum++; 
        if(!row["Item Group Number"]) return showError(`Missing 'Item Group Number' on CSV row ${rowNum}. Please group your variants using 1, 2, 3 etc.`);
        
        for(let col of imageColumns) {
          if(row[col] && row[col].trim() !== "") requiredImages.add(row[col].trim());
        }

        if (window.masterCategories) {
          let cMain = String(row["Main Category"] || "").trim();
          let cSub = String(row["Sub Category"] || "").trim();

          if(!cMain) return showError(`Missing 'Main Category' on CSV row ${rowNum}.`);
          if(!window.masterCategories[cMain]) return showError(`Invalid Main Category "<b>${cMain}</b>" on CSV row ${rowNum}.`);
          if(cSub) {
             let validSubs = window.masterCategories[cMain] || [];
             if(validSubs.indexOf(cSub) === -1) return showError(`Invalid Sub Category "<b>${cSub}</b>" on CSV row ${rowNum}.`);
          }
        }
      }

      let uploadedFileNames = mediaFiles.map(f => f.name);
      let missingFiles = [];
      requiredImages.forEach(img => {
        if(!uploadedFileNames.includes(img)) missingFiles.push(img);
      });

      if(missingFiles.length > 0) {
        return showError("The CSV mentions files you didn't upload:<br>• " + missingFiles.join("<br>• ") + "<br><br>Please add them to the media drop zone.");
      }

      document.getElementById('submitBtn').innerText = "Uploading Media to Cloudinary...";

      // 3. SECURE MEDIA UPLOAD TO NODE/CLOUDINARY
      let mediaUrls = {}; 
      for(let i=0; i<mediaFiles.length; i++) {
        let file = mediaFiles[i];
        if(!requiredImages.has(file.name)) continue; 
        
        logProgress(`Uploading ${file.name}...`);
        
        try {
          const base64Data = await readFileAsBase64(file);
          const response = await fetch(API_BASE_URL + '/upload-media', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              supplierId: supId,
              fileName: file.name,
              mimeType: file.type,
              fileData: base64Data.split(',')[1] // Strip the data uri prefix
            })
          });
          const result = await response.json();
          if(result.success) {
            mediaUrls[file.name] = result.url;
          } else {
            return showError("Failed to upload " + file.name + ": " + result.error);
          }
        } catch(e) {
          return showError("Network error while uploading " + file.name);
        }
      }

      // 4. GROUPING DATA FOR POSTGRESQL JSONB
      document.getElementById('submitBtn').innerText = "Mapping Database...";
      logProgress("Grouping Variants...");

      let productsMap = {};

      for(let row of csvData) {
        let groupNum = String(row["Item Group Number"]).trim();
        
        // If this is the first time seeing this product, create the master record
        if (!productsMap[groupNum]) {
            productsMap[groupNum] = {
              supplierId: supId,
              companyName: row["Company"] || "Unknown",
              currency: window.officialCurrency,
              category: row["Main Category"] || "",
              subCategory: row["Sub Category"] || "",
              productName: row["Product Name"] || "",
              shortTitle: row["Title"] || "",
              servicesString: row["Services"] || "Standard",
              packagingDetails: row["Pkg Details"] || "",
              description: row["Description"] || "",
              heroUrl: mediaUrls[row["Hero Img"]] || "",
              lifeUrl: mediaUrls[row["Life Img"]] || "",
              detailUrl: mediaUrls[row["CloseUp Img"]] || "",
              packUrl: mediaUrls[row["Pack Img"]] || "",
              extraUrl: mediaUrls[row["Extra Img"]] || "",
              catalogUrl: mediaUrls[row["Catalog PDF"]] || "",
              pricingMatrix: []
            };
        }

        // Push the variant data into the pricingMatrix array
        productsMap[groupNum].pricingMatrix.push({
          type: row["Var Type"] || "Standard",
          opt: row["Var Option"] || "-",
          unit: row["Unit"] || "Pcs",
          min: row["Min Qty"] || "1",
          max: row["Max Qty"] || "Up",
          price: row["Price"] || "0",
          incoterms: row["Incoterms"] || "FOB",
          lead: row["Lead Time"] || "30",
          varImg: mediaUrls[row["Variant Img"]] || ""
        });
      }

      // Convert the map object back to an array
      let finalGroupedProducts = Object.values(productsMap);

      // 5. PUSH TO NODE.JS DATABASE
      document.getElementById('submitBtn').innerText = "Finalizing Submission...";
      logProgress("Pushing to Muziris Ledger...");

      try {
        const response = await fetch(API_BASE_URL + '/submit-bulk-staging', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ products: finalGroupedProducts })
        });
        const result = await response.json();
        
        if(result.success) {
          document.getElementById('mainUI').style.display = "none";
          document.getElementById('successUI').style.display = "block";
        } else {
          showError("Database Error: " + result.error);
        }
      } catch(e) {
        showError("Failed to connect to Muziris Ledger.");
      }
    }

    function readFileAsBase64(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = () => resolve(reader.result);
        reader.onerror = error => reject(error);
        reader.readAsDataURL(file);
      });
    }
  </script>
