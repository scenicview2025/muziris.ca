<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Muziris | Business Category</title>
  <link rel="icon" type="image/png" href="../MC.png">
  
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700;800&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  
  <style>
    :root { --gold: #D4AF37; --gold-dark: #b89225; }
    body { background-color: #ffffff; font-family: 'Inter', sans-serif; -webkit-font-smoothing: antialiased; color: #111827; display: flex; flex-direction: column; min-height: 100vh; }
    .brand-font { font-family: 'Cinzel', serif; }
    
    .minimal-header { display: flex; justify-content: space-between; align-items: center; padding: 24px 32px; background: #fff; border-bottom: 1px solid #e5e7eb; position: relative; }
    .center-logo { position: absolute; left: 50%; transform: translateX(-50%); }
    .progress-container { width: 100%; height: 2px; background-color: transparent; position: relative; top: -1px; }
    .progress-bar { height: 100%; background-color: #111827; width: 75%; transition: width 0.4s ease; } /* 75% Progress */

    .form-input { width: 100%; padding: 10px 14px; background: #ffffff; border: 1px solid #d1d5db; border-radius: 4px; font-family: 'Inter', sans-serif; font-size: 0.95rem; color: #111827; outline: none; transition: all 0.2s ease; }
    .form-input:focus { border-color: #111827; box-shadow: 0 0 0 1px #111827; }
    .form-label { display: block; font-size: 0.85rem; font-weight: 400; color: #374151; margin-bottom: 0.4rem; }

    .minimal-footer { border-top: 1px solid #e5e7eb; padding: 24px 0; text-align: center; font-size: 11px; color: #6b7280; background: #fff; margin-top: auto; }
    .minimal-footer a { color: #6b7280; text-decoration: none; margin: 0 8px; transition: 0.2s; }
    .minimal-footer a:hover { color: #111827; }
  </style>
</head>
<body>

  <header class="w-full bg-white z-50">
      <div class="minimal-header">
          <div class="w-1/3">
              <a href="location.html" class="text-gray-400 hover:text-gray-900 transition text-lg"><i class="fas fa-chevron-left"></i></a>
          </div>
          
          <div class="center-logo">
              <h1 class="text-2xl font-bold tracking-[0.2em] text-gray-900 brand-font uppercase cursor-pointer" onclick="window.location.href='../index1.html'">Muziris</h1>
          </div>
          
          <div class="w-1/3 flex justify-end gap-6 text-sm font-medium text-gray-600 hidden md:flex">
              <a href="#" class="hover:text-gray-900 transition">Get help</a>
              <a href="#" class="hover:text-gray-900 transition">Save & exit</a>
          </div>
      </div>
      <div class="progress-container"><div class="progress-bar"></div></div>
  </header>

  <main class="flex justify-center pt-16 pb-20 px-6 items-start flex-grow">
    <div class="w-full max-w-[480px]">
        
        <div class="mb-8">
            <h2 class="text-[24px] md:text-[28px] text-gray-900 mb-3 font-serif font-normal tracking-tight leading-tight">What kind of products do you sell?</h2>
            <p class="text-[13px] text-gray-600 leading-relaxed">Select your primary industry and category. You can list products in other categories later.</p>
        </div>

        <form id="step4-form" onsubmit="event.preventDefault(); processStep4();">
            
            <div class="mb-6">
                <label class="form-label">Primary Industry *</label>
                <select id="industry" class="form-input" required>
                    <option value="">Select industry...</option>
                    <option value="Agriculture & Food">Agriculture & Food</option>
                    <option value="Apparel & Textiles">Apparel & Textiles</option>
                    <option value="Automotive & Transport">Automotive & Transport</option>
                    <option value="Chemicals & Plastics">Chemicals & Plastics</option>
                    <option value="Construction & Real Estate">Construction & Real Estate</option>
                    <option value="Consumer Electronics">Consumer Electronics</option>
                    <option value="Energy & Environment">Energy & Environment</option>
                    <option value="Health & Medical">Health & Medical</option>
                    <option value="Home & Garden">Home & Garden</option>
                    <option value="Industrial Machinery">Industrial Machinery</option>
                    <option value="Jewelry & Luxury">Jewelry & Luxury</option>
                    <option value="Minerals & Metals">Minerals & Metals</option>
                    <option value="Packaging & Printing">Packaging & Printing</option>
                    <option value="Personal Care & Beauty">Personal Care & Beauty</option>
                    <option value="Security & Protection">Security & Protection</option>
                </select>
            </div>

            <div class="mb-6">
                <label class="form-label">Primary Category *</label>
                <select id="category" class="form-input" required>
                    <option value="">Select category...</option>
                    <option value="Raw Materials">Raw Materials</option>
                    <option value="Finished Goods">Finished Goods</option>
                    <option value="Components & Parts">Components & Parts</option>
                    <option value="Machinery & Equipment">Machinery & Equipment</option>
                    <option value="Tools & Hardware">Tools & Hardware</option>
                    <option value="Packaging Materials">Packaging Materials</option>
                    <option value="Services & Logistics">Services & Logistics</option>
                    <option value="Private Label / OEM">Private Label / OEM</option>
                </select>
            </div>

            <div class="fixed bottom-0 left-0 w-full bg-white border-t border-gray-200 p-4 pb-6 z-40 md:static md:bg-transparent md:border-none md:p-0 md:z-auto md:mt-8">
                <div class="max-w-[480px] mx-auto">
                    <button type="submit" class="w-full bg-[#333333] hover:bg-[#111827] text-white py-3.5 rounded-[4px] font-medium text-[1rem] transition duration-200 shadow-sm">Next</button>
                </div>
            </div>

        </form>

    </div>
  </main>

  <footer class="minimal-footer hidden md:block w-full">
      © 2026 Muziris International Inc. &nbsp;|&nbsp; 
      <a href="../terms.html" target="_blank">Terms of service</a> &nbsp;|&nbsp; 
      <a href="../privacy.html" target="_blank">Privacy policy</a> &nbsp;|&nbsp; 
      <a href="../ip-policy.html" target="_blank">IP policy</a>
  </footer>

  <script>
    function processStep4() {
        // Redirect to the final verification page!
        window.location.href = 'verification.html';
    }
  </script>

</body>
</html>
