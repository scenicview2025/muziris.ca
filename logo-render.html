<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Muziris Logo Render</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700&display=swap" rel="stylesheet">
    <style>
        body {
            /* Applied your dark background color */
            background-color: #0b0e14;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .logo-text {
            /* Applied 'Cinzel' font family and bold weight */
            font-family: 'Cinzel', serif;
            font-weight: 700;
            /* Applied your gold color */
            color: #D4AF37;
            /* Applied your font sizing and letter spacing */
            font-size: 100px; /* Increased for better screenshot resolution */
            letter-spacing: 2px;
            margin: 0;
            text-transform: none; /* Cinzel often defaults to caps, but standard 'Muziris' looks more premium */
        }
    </style>
</head>
<body>
    <h1 class="logo-text">Muziris</h1>
</body>
</html>
