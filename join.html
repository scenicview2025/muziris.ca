<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Muziris | Apply to Sell</title>
  <link rel="icon" type="image/png" href="MC.png">
  
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700;800&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  
  <style>
    :root {
        --gold: #D4AF37;
        --gold-dark: #b89225;
    }

    body { background-color: #ffffff; font-family: 'Inter', sans-serif; -webkit-font-smoothing: antialiased; color: #111827; }
    .brand-font { font-family: 'Cinzel', serif; }
    
    /* Minimalist Top Nav - EXACT ORIGINAL SPACING */
    .minimal-header {
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 24px 0;
        border-bottom: 1px solid #e5e7eb;
        width: 100%;
    }

    /* Form Inputs */
    .form-input { 
        width: 100%; 
        padding: 10px 14px; 
        background: #ffffff; 
        border: 1px solid #d1d5db; 
        border-radius: 4px; 
        font-family: 'Inter', sans-serif; 
        font-size: 0.95rem; 
        color: #111827; 
        outline: none; 
        transition: all 0.2s ease; 
    }
    .form-input:focus { border-color: #111827; box-shadow: 0 0 0 1px #111827; }
    .form-label { display: block; font-size: 0.85rem; font-weight: 400; color: #374151; margin-bottom: 0.4rem; }

    /* Phone Input Group */
    .phone-group { display: flex; }
    
    /* 🟢 Phone Code Dropdown / Input styling */
    .phone-code { 
        width: 90px; /* Slightly wider to show a bit of the country name when closed */
        background: #ffffff; 
        color: #111827; 
        border: 1px solid #d1d5db; 
        border-right: none; 
        border-radius: 4px 0 0 4px; 
        padding: 10px; 
        font-size: 0.95rem; 
        outline: none;
        cursor: pointer;
        text-align: left;
    }
    .phone-code:focus { border-color: #111827; }
    .phone-number { flex: 1; border-radius: 0 4px 4px 0; }

    /* Button */
    .btn-next { 
        width: 100%; 
        background-color: #333333; 
        color: #fff; 
        padding: 14px; 
        border-radius: 4px; 
        font-weight: 500; 
        font-size: 1rem; 
        transition: 0.2s; 
        cursor: pointer; 
        margin-top: 20px;
    }
    .btn-next:hover { background-color: #111827; }

    /* Custom Checkbox */
    .checkbox-container { display: flex; align-items: flex-start; gap: 10px; margin-top: 20px; cursor: pointer; }
    .checkbox-container input { margin-top: 4px; cursor: pointer; width: 16px; height: 16px; accent-color: #333; }
    .checkbox-text { font-size: 0.85rem; color: #4b5563; line-height: 1.5; }
  </style>
</head>
<body>

  <header class="minimal-header">
    <h1 class="text-2xl font-bold tracking-[0.2em] text-gray-900 brand-font uppercase">Muziris</h1>
  </header>

  <main class="flex justify-center pt-12 pb-44 md:pb-20 px-6">
    <div class="w-full max-w-[480px]">
        
        <div class="mb-8">
            <h2 class="text-[24px] md:text-[28px] text-gray-900 mb-3 font-serif font-normal md:whitespace-nowrap tracking-tight">Welcome! Sign up to sell on Muziris.</h2>
            <p class="text-[13px] text-gray-600 leading-relaxed max-w-sm">The premier wholesale marketplace connecting top-tier manufacturers with North American buyers.</p>
        </div>

        <form id="step1-form" onsubmit="event.preventDefault(); processStep1();">
            
            <div class="grid grid-cols-2 gap-4 mb-5">
                <div>
                    <label class="form-label">First name</label>
                    <input type="text" id="firstName" class="form-input" required>
                </div>
                <div>
                    <label class="form-label">Last name</label>
                    <input type="text" id="lastName" class="form-input" required>
                </div>
            </div>

            <div class="mb-5">
                <label class="form-label">Business email</label>
                <input type="email" id="email" class="form-input" required>
            </div>

            <div class="mb-5">
                <label class="form-label">Phone number</label>
                <div class="phone-group relative">
                    
                    <div id="selectContainer" class="w-[90px]">
                        <select id="dialCode" class="phone-code" required onchange="handleCodeChange()">
                            </select>
                    </div>

                    <div id="customCodeContainer" class="w-[90px] hidden">
                        <input type="text" id="customDialCode" class="phone-code" placeholder="+..." style="text-align: center;">
                    </div>

                    <input type="tel" id="phone" class="form-input phone-number" inputmode="numeric" required>
                </div>
                <input type="hidden" id="fullPhone">
            </div>

            <div class="mb-5 relative">
                <label class="form-label">Password</label>
                <input type="password" id="password" class="form-input" required style="padding-right: 40px;">
                <button type="button" onclick="togglePassword()" class="absolute right-3 top-[34px] text-gray-400 hover:text-gray-600 transition">
                    <i class="far fa-eye" id="eye-icon"></i>
                </button>
            </div>

            <label class="checkbox-container">
                <input type="checkbox" id="marketingConsent">
                <span class="checkbox-text">I'd like to receive marketing emails and text messages from Muziris about new offers, events, and recommendations.</span>
            </label>

            <div class="fixed bottom-0 left-0 w-full bg-white border-t border-gray-200 p-4 pb-6 z-40 md:static md:bg-transparent md:border-none md:p-0 md:z-auto md:mt-6">
                <div class="max-w-[480px] mx-auto">
                    
                    <div id="email-error" class="hidden text-[#ff5252] text-sm mb-3 font-medium text-center">
                        This email is already registered. Please log in.
                    </div>

                    <button type="submit" class="w-full bg-[#333333] hover:bg-[#111827] text-white py-3.5 rounded-[4px] font-medium text-[1rem] transition duration-200 shadow-sm">Next</button>

                    <p class="text-[11px] text-gray-500 mt-3 md:mt-5 text-left leading-relaxed">
                        By proceeding, you're agreeing to Muziris's <a href="terms.html" target="_blank" class="underline hover:text-gray-900">Terms of Service</a>, 
                        <a href="supplier-terms.html" target="_blank" class="underline hover:text-gray-900">Supplier Terms</a>, and <a href="privacy.html" target="_blank" class="underline hover:text-gray-900">Privacy Policy</a>.
                    </p>
                </div>
            </div>

        </form>

    </div>
  </main>

  <script>
    // Password Toggle
    function togglePassword() {
        const passInput = document.getElementById('password');
        const icon = document.getElementById('eye-icon');
        if (passInput.type === 'password') {
            passInput.type = 'text';
            icon.classList.remove('fa-eye');
            icon.classList.add('fa-eye-slash');
        } else {
            passInput.type = 'password';
            icon.classList.remove('fa-eye-slash');
            icon.classList.add('fa-eye');
        }
    }

    // 🟢 Giant Array of Countries from your screenshots
    const fullCountryList = [
        { name: "Canada", code: "+1" }, { name: "United States", code: "+1" }, { name: "India", code: "+91" },
        { name: "China", code: "+86" }, { name: "United Kingdom", code: "+44" }, { name: "Australia", code: "+61" },
        { name: "Germany", code: "+49" }, { name: "France", code: "+33" }, { name: "Italy", code: "+39" },
        { name: "Spain", code: "+34" }, { name: "Brazil", code: "+55" }, { name: "Mexico", code: "+52" },
        { name: "Japan", code: "+81" }, { name: "South Korea", code: "+82" }, { name: "Vietnam", code: "+84" },
        { name: "Thailand", code: "+66" }, { name: "Indonesia", code: "+62" }, { name: "Malaysia", code: "+60" },
        { name: "Singapore", code: "+65" }, { name: "Philippines", code: "+63" }, { name: "Bangladesh", code: "+880" },
        { name: "Sri Lanka", code: "+94" }, { name: "Pakistan", code: "+92" }, { name: "UAE", code: "+971" },
        { name: "Saudi Arabia", code: "+966" }, { name: "South Africa", code: "+27" }, { name: "Nigeria", code: "+234" },
        { name: "Kenya", code: "+254" }, { name: "Egypt", code: "+20" }, { name: "Turkey", code: "+90" },
        { name: "Netherlands", code: "+31" }, { name: "Belgium", code: "+32" }, { name: "Sweden", code: "+46" },
        { name: "Norway", code: "+47" }, { name: "Denmark", code: "+45" }, { name: "Switzerland", code: "+41" },
        { name: "Poland", code: "+48" }, { name: "Russia", code: "+7" }, { name: "Argentina", code: "+54" },
        { name: "Chile", code: "+56" }, { name: "Colombia", code: "+57" }, { name: "Peru", code: "+51" },
        { name: "New Zealand", code: "+64" }, { name: "Ireland", code: "+353" }, { name: "Portugal", code: "+351" }
    ];

    window.onload = function() { 
        const dialSelect = document.getElementById("dialCode");
        
        // Populate the dropdown
        fullCountryList.forEach(c => { 
            let opt = document.createElement("option"); 
            opt.value = c.code; 
            opt.innerText = `${c.code} ${c.name}`; 
            dialSelect.appendChild(opt); 
        });

        // Add the "Other" option at the very bottom
        let otherOpt = document.createElement("option");
        otherOpt.value = "Other";
        otherOpt.innerText = "Other (Type Code)";
        dialSelect.appendChild(otherOpt);

        // Fetch IP location automatically
        fetch('https://ipapi.co/json/')
            .then(response => response.json())
            .then(data => {
                if (data.country_calling_code) {
                    const detectedCode = data.country_calling_code;
                    const exists = Array.from(dialSelect.options).some(opt => opt.value === detectedCode);
                    
                    if (exists) {
                        dialSelect.value = detectedCode;
                    } else {
                        // If we detect a code not in the list, automatically trigger the custom input
                        dialSelect.value = "Other";
                        handleCodeChange();
                        document.getElementById("customDialCode").value = detectedCode;
                    }
                }
            })
            .catch(error => console.log("IP Detection failed.", error));
    };

    // 🟢 Logic to switch dropdown into a text box
    function handleCodeChange() {
        const select = document.getElementById('dialCode');
        if (select.value === 'Other') {
            document.getElementById('selectContainer').classList.add('hidden');
            const customInput = document.getElementById('customDialCode');
            document.getElementById('customCodeContainer').classList.remove('hidden');
            customInput.focus();
        }
    }

    // 🟢 If they delete everything in the custom box, switch back to dropdown
    document.getElementById('customDialCode').addEventListener('blur', function() {
        if (this.value.trim() === '' || this.value.trim() === '+') {
            document.getElementById('customCodeContainer').classList.add('hidden');
            document.getElementById('selectContainer').classList.remove('hidden');
            document.getElementById('dialCode').value = '+1'; // Default back to first option
        }
    });

    // Step 1 Submission Logic
    function processStep1() {
        const email = document.getElementById('email').value.trim();
        const errorMsg = document.getElementById('email-error');
        
        errorMsg.classList.add('hidden');

        // Validation
        const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
        if (!emailRegex.test(email)) {
            errorMsg.innerText = "Please enter a valid email address (e.g., name@company.com).";
            errorMsg.classList.remove('hidden');
            return; 
        }

        // 🟢 Figure out which dial code to use (Dropdown vs Custom Typed)
        let finalDialCode = "";
        if (!document.getElementById('customCodeContainer').classList.contains('hidden')) {
            finalDialCode = document.getElementById('customDialCode').value.trim();
            // Make sure they didn't forget the plus sign
            if(!finalDialCode.startsWith('+')) finalDialCode = '+' + finalDialCode;
        } else {
            finalDialCode = document.getElementById('dialCode').value;
        }

        // Combine Phone Number
        document.getElementById('fullPhone').value = finalDialCode + " " + document.getElementById('phone').value;

        /* ============================================================
        YOUR REAL BACKEND LOGIC GOES HERE LATER
        ============================================================ */
       
        if (email === "test@muziris.ca") {
            errorMsg.innerText = "This email is already registered. Please log in.";
            errorMsg.classList.remove('hidden');
        } else {
            window.location.href = 'supplier-onboarding/supplier-info.html'; 
        }
    }
  </script>

  <script src="muziris-bot.js"></script>

</body>
</html>
