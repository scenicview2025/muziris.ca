<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Muziris | Apply to Sell</title>
  <link rel="icon" type="image/png" href="MC.png">
  
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700;800&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  
  <style>
    :root {
        --gold: #D4AF37;
        --gold-dark: #b89225;
    }

    body { background-color: #ffffff; font-family: 'Inter', sans-serif; -webkit-font-smoothing: antialiased; color: #111827; }
    .brand-font { font-family: 'Cinzel', serif; }
    
    /* Minimalist Top Nav - Exact original spacing */
    .minimal-header {
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 24px 0;
        border-bottom: 1px solid #e5e7eb;
        width: 100%;
    }

    /* Form Inputs */
    .form-input { 
        width: 100%; 
        padding: 10px 14px; 
        background: #ffffff; 
        border: 1px solid #d1d5db; 
        border-radius: 4px; 
        font-family: 'Inter', sans-serif; 
        font-size: 0.95rem; 
        color: #111827; 
        outline: none; 
        transition: all 0.2s ease; 
    }
    .form-input:focus { border-color: #111827; box-shadow: 0 0 0 1px #111827; }
    .form-label { display: block; font-size: 0.85rem; font-weight: 400; color: #374151; margin-bottom: 0.4rem; }

    /* Phone Input Group */
    .phone-group { display: flex; }
    
    /* 🟢 Updated to match the white, centered dropdown style */
    .phone-code { 
        width: 80px; 
        background: #ffffff; 
        color: #111827; 
        border: 1px solid #d1d5db; 
        border-right: none; 
        border-radius: 4px 0 0 4px; 
        padding: 10px; 
        font-size: 0.95rem; 
        outline: none;
        cursor: pointer;
        text-align: center;
        text-align-last: center;
    }
    .phone-code:focus { border-color: #111827; }
    .phone-number { flex: 1; border-radius: 0 4px 4px 0; }

    /* Button */
    .btn-next { 
        width: 100%; 
        background-color: #333333; 
        color: #fff; 
        padding: 14px; 
        border-radius: 4px; 
        font-weight: 500; 
        font-size: 1rem; 
        transition: 0.2s; 
        cursor: pointer; 
        margin-top: 20px;
    }
    .btn-next:hover { background-color: #111827; }

    /* Custom Checkbox */
    .checkbox-container { display: flex; align-items: flex-start; gap: 10px; margin-top: 20px; cursor: pointer; }
    .checkbox-container input { margin-top: 4px; cursor: pointer; width: 16px; height: 16px; accent-color: #333; }
    .checkbox-text { font-size: 0.85rem; color: #4b5563; line-height: 1.5; }
  </style>
</head>
<body>

  <header class="minimal-header">
    <h1 class="text-2xl font-bold tracking-[0.2em] text-gray-900 brand-font uppercase">Muziris</h1>
  </header>

  <main class="flex justify-center pt-12 pb-44 md:pb-20 px-6">
    <div class="w-full max-w-[480px]">
        
        <div class="mb-8">
            <h2 class="text-[24px] md:text-[28px] text-gray-900 mb-3 font-serif font-normal md:whitespace-nowrap tracking-tight">Welcome! Sign up to sell on Muziris.</h2>
            <p class="text-[13px] text-gray-600 leading-relaxed max-w-sm">The premier wholesale marketplace connecting top-tier manufacturers with North American buyers.</p>
        </div>

        <form id="step1-form" onsubmit="event.preventDefault(); processStep1();">
            
            <div class="grid grid-cols-2 gap-4 mb-5">
                <div>
                    <label class="form-label">First name</label>
                    <input type="text" id="firstName" class="form-input" required>
                </div>
                <div>
                    <label class="form-label">Last name</label>
                    <input type="text" id="lastName" class="form-input" required>
                </div>
            </div>

            <div class="mb-5">
                <label class="form-label">Business email</label>
                <input type="email" id="email" class="form-input" required>
            </div>

            <div class="mb-5">
                <label class="form-label">Phone number</label>
                <div class="phone-group">
                    <select id="dialCode" class="phone-code" required>
                        </select>
                    <input type="tel" id="phone" class="form-input phone-number" inputmode="numeric" required>
                </div>
                <input type="hidden" id="fullPhone">
            </div>

            <div class="mb-5 relative">
                <label class="form-label">Password</label>
                <input type="password" id="password" class="form-input" required style="padding-right: 40px;">
                <button type="button" onclick="togglePassword()" class="absolute right-3 top-[34px] text-gray-400 hover:text-gray-600 transition">
                    <i class="far fa-eye" id="eye-icon"></i>
                </button>
            </div>

            <label class="checkbox-container">
                <input type="checkbox" id="marketingConsent">
                <span class="checkbox-text">I'd like to receive marketing emails and text messages from Muziris about new offers, events, and recommendations.</span>
            </label>

            <div class="fixed bottom-0 left-0 w-full bg-white border-t border-gray-200 p-4 pb-6 z-40 md:static md:bg-transparent md:border-none md:p-0 md:z-auto md:mt-6">
                <div class="max-w-[480px] mx-auto">
                    
                    <div id="email-error" class="hidden text-[#ff5252] text-sm mb-3 font-medium text-center">
                        This email is already registered. Please log in.
                    </div>

                    <button type="submit" class="w-full bg-[#333333] hover:bg-[#111827] text-white py-3.5 rounded-[4px] font-medium text-[1rem] transition duration-200 shadow-sm">Next</button>

                    <p class="text-[11px] text-gray-500 mt-3 md:mt-5 text-left leading-relaxed">
                        By proceeding, you're agreeing to Muziris's <a href="terms.html" target="_blank" class="underline hover:text-gray-900">Terms of Service</a>, 
                        <a href="supplier-terms.html" target="_blank" class="underline hover:text-gray-900">Supplier Terms</a>, and <a href="privacy.html" target="_blank" class="underline hover:text-gray-900">Privacy Policy</a>.
                    </p>
                </div>
            </div>

        </form>

    </div>
  </main>

  <script>
    // Password Toggle Logic
    function togglePassword() {
        const passInput = document.getElementById('password');
        const icon = document.getElementById('eye-icon');
        if (passInput.type === 'password') {
            passInput.type = 'text';
            icon.classList.remove('fa-eye');
            icon.classList.add('fa-eye-slash');
        } else {
            passInput.type = 'password';
            icon.classList.remove('fa-eye-slash');
            icon.classList.add('fa-eye');
        }
    }

    // 🟢 IP Detection & Phone Code Logic added to your script
    const commonCodes = ["+1", "+91", "+44", "+61", "+971", "+86", "+49", "+33", "+39", "+34"];

    window.onload = function() { 
        const dialSelect = document.getElementById("dialCode");
        
        commonCodes.forEach(code => { 
            let opt = document.createElement("option"); 
            opt.value = code; 
            opt.innerText = code; 
            dialSelect.appendChild(opt); 
        });

        fetch('https://ipapi.co/json/')
            .then(response => response.json())
            .then(data => {
                if (data.country_calling_code) {
                    const detectedCode = data.country_calling_code;
                    const exists = Array.from(dialSelect.options).some(opt => opt.value === detectedCode);
                    
                    if (exists) {
                        dialSelect.value = detectedCode;
                    } else {
                        let opt = document.createElement("option");
                        opt.value = detectedCode;
                        opt.innerText = detectedCode;
                        dialSelect.appendChild(opt);
                        dialSelect.value = detectedCode;
                    }
                }
            })
            .catch(error => console.log("IP Detection failed.", error));
    };

    // Step 1 Submission Logic
    function processStep1() {
        const email = document.getElementById('email').value.trim();
        const errorMsg = document.getElementById('email-error');
        
        errorMsg.classList.add('hidden');

        // Added Strict Email Format Validation
        const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
        if (!emailRegex.test(email)) {
            errorMsg.innerText = "Please enter a valid email address (e.g., name@company.com).";
            errorMsg.classList.remove('hidden');
            return; 
        }

        document.getElementById('fullPhone').value = document.getElementById('dialCode').value + " " + document.getElementById('phone').value;

        /* ============================================================
        YOUR REAL BACKEND LOGIC GOES HERE LATER
        ============================================================ */
       
        if (email === "test@muziris.ca") {
            errorMsg.innerText = "This email is already registered. Please log in.";
            errorMsg.classList.remove('hidden');
        } else {
            // Points to the new folder structure
            window.location.href = 'supplier-onboarding/supplier-info.html'; 
        }
    }
  </script>

    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.10.0/firebase-app.js";

    const firebaseConfig = {

      storageBucket: "muziris-ac9dd.firebasestorage.app",

      appId: "1:929662963272:web:a2ed63f56ffc90940ed27d"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
  </script>

  <script src="muziris-bot.js"></script>

</body>
</html>
