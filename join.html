<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Muziris | Apply to Sell</title>

  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">

  <style>
    :root {
        --gold: #D4AF37;
        --gold-dark: #b89225;
    }

    body { background-color: #ffffff; font-family: 'Inter', sans-serif; -webkit-font-smoothing: antialiased; color: #111827; }
    .brand-font { font-family: 'Cinzel', serif; }
    
    /* Minimalist Top Nav */
    .minimal-header {
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 24px 0;
        border-bottom: 1px solid #e5e7eb;
        width: 100%;
    }

    /* Form Inputs */
    .form-input { 
        width: 100%; 
        padding: 12px 14px; 
        background: #ffffff; 
        border: 1px solid #d1d5db; 
        border-radius: 4px; 
        font-family: 'Inter', sans-serif; 
        font-size: 0.95rem; 
        color: #111827; 
        outline: none; 
        transition: all 0.2s ease; 
    }
    .form-input:focus { border-color: #111827; box-shadow: 0 0 0 1px #111827; }
    .form-label { display: block; font-size: 0.85rem; font-weight: 400; color: #374151; margin-bottom: 0.4rem; }

    /* Phone Input Group */
    .phone-group { display: flex; }
    .phone-code { width: 80px; background: #f9fafb; color: #374151; text-align: center; border: 1px solid #d1d5db; border-right: none; border-radius: 4px 0 0 4px; cursor: not-allowed; }
    .phone-number { flex: 1; border-radius: 0 4px 4px 0; }

    /* Button */
    .btn-next { 
        width: 100%; 
        background-color: #333333; 
        color: #fff; 
        padding: 14px; 
        border-radius: 4px; 
        font-weight: 500; 
        font-size: 1rem; 
        transition: 0.2s; 
        cursor: pointer; 
        margin-top: 20px;
    }
    .btn-next:hover { background-color: #111827; }

    /* Custom Checkbox */
    .checkbox-container { display: flex; align-items: flex-start; gap: 10px; margin-top: 20px; cursor: pointer; }
    .checkbox-container input { margin-top: 4px; cursor: pointer; width: 16px; height: 16px; accent-color: #333; }
    .checkbox-text { font-size: 0.85rem; color: #4b5563; line-height: 1.5; }
  </style>
</head>
<body>

  <header class="minimal-header">
    <h1 class="text-2xl font-bold tracking-[0.2em] text-gray-900 brand-font uppercase">Muziris</h1>
  </header>

  <main class="flex justify-center pt-12 pb-20 px-6">
    <div class="w-full max-w-[480px]">
        
        <div class="text-center mb-8">
            <h2 class="text-3xl font-bold text-gray-900 brand-font mb-3">Welcome! Sign up to sell on Muziris.</h2>
            <p class="text-sm text-gray-600 leading-relaxed">The premier wholesale marketplace connecting top-tier manufacturers with North American buyers.</p>
        </div>

        <form id="step1-form" onsubmit="event.preventDefault(); processStep1();">
            
            <div class="grid grid-cols-2 gap-4 mb-5">
                <div>
                    <label class="form-label">First name</label>
                    <input type="text" id="firstName" class="form-input" required>
                </div>
                <div>
                    <label class="form-label">Last name</label>
                    <input type="text" id="lastName" class="form-input" required>
                </div>
            </div>

            <div class="mb-5">
                <label class="form-label">Business email</label>
                <input type="email" id="email" class="form-input" required>
            </div>

            <div class="mb-5">
                <label class="form-label">Country</label>
                <select id="countrySelect" class="form-input" required onchange="updatePhoneCode()">
                    <option value="">Select a country...</option>
                </select>
            </div>

            <div class="mb-5">
                <label class="form-label">Phone number</label>
                <div class="phone-group">
                    <input type="text" id="dialCode" class="phone-code" readonly placeholder="+1">
                    <input type="tel" id="phone" class="form-input phone-number" inputmode="numeric" required>
                </div>
                <input type="hidden" id="fullPhone">
            </div>

            <div class="mb-5 relative">
                <label class="form-label">Password</label>
                <input type="password" id="password" class="form-input" required style="padding-right: 40px;">
                <button type="button" onclick="togglePassword()" class="absolute right-3 top-[34px] text-gray-400 hover:text-gray-600 transition">
                    <i class="far fa-eye" id="eye-icon"></i>
                </button>
            </div>

            <label class="checkbox-container">
                <input type="checkbox" id="marketingConsent">
                <span class="checkbox-text">I'd like to receive marketing emails and text messages from Muziris about new offers, events, and recommendations.</span>
            </label>

            <button type="submit" class="btn-next">Next</button>

            <p class="text-[11px] text-gray-500 mt-6 text-center">
                By proceeding, you're agreeing to Muziris's <a href="terms.html" class="underline hover:text-gray-900">Terms of Service</a>, 
                <a href="supplier-terms.html" class="underline hover:text-gray-900">Supplier Terms of Service</a>, and <a href="privacy.html" class="underline hover:text-gray-900">Privacy Policy</a>.
            </p>
        </form>

    </div>
  </main>

  <script>
    // 🟢 Password Toggle Logic
    function togglePassword() {
        const passInput = document.getElementById('password');
        const icon = document.getElementById('eye-icon');
        if (passInput.type === 'password') {
            passInput.type = 'text';
            icon.classList.remove('fa-eye');
            icon.classList.add('fa-eye-slash');
        } else {
            passInput.type = 'password';
            icon.classList.remove('fa-eye-slash');
            icon.classList.add('fa-eye');
        }
    }

    // 🟢 Country & Phone Code Logic
    const countries = [
      { name: "Canada", code: "+1" }, { name: "United States", code: "+1" }, { name: "India", code: "+91" }, 
      { name: "China", code: "+86" }, { name: "United Kingdom", code: "+44" }, { name: "Australia", code: "+61" }, 
      { name: "Germany", code: "+49" }, { name: "France", code: "+33" }, { name: "Italy", code: "+39" }, 
      { name: "Spain", code: "+34" }, { name: "UAE", code: "+971" }, { name: "Other", code: "+" }
    ];

    window.onload = function() { 
        var cSelect = document.getElementById("countrySelect");
        countries.forEach(c => { 
            var opt = document.createElement("option"); 
            opt.value = c.name; 
            opt.innerText = c.name; 
            opt.setAttribute("data-code", c.code);
            cSelect.appendChild(opt); 
        });
    };

    function updatePhoneCode() {
        const select = document.getElementById("countrySelect");
        const selectedOption = select.options[select.selectedIndex];
        const dialCodeInput = document.getElementById("dialCode");
        
        if(selectedOption && selectedOption.value !== "") {
            dialCodeInput.value = selectedOption.getAttribute("data-code");
            document.getElementById("phone").focus(); 
        } else {
            dialCodeInput.value = "";
        }
    }

    // 🟢 Step 1 Submission Logic
    function processStep1() {
        const email = document.getElementById('email').value;
        const btn = document.querySelector('.btn-next');
        
        btn.innerText = "Checking...";
        btn.disabled = true;

        // Combine Phone Number
        document.getElementById('fullPhone').value = document.getElementById('dialCode').value + " " + document.getElementById('phone').value;

        // TODO: Here is where you connect to your old backend to check if the email exists!
        /* Example Logic:
        fetch("YOUR_BACKEND_URL/check-email", {
            method: 'POST',
            body: JSON.stringify({ email: email })
        }).then(res => res.json()).then(data => {
            if (data.exists) {
                alert("This email is already registered.");
                btn.innerText = "Next";
                btn.disabled = false;
            } else {
                // Email is clear! Proceed to the "Tell us about your business" page
                window.location.href = 'join-step2.html';
            }
        });
        */
       
        // Temporary Simulation for testing:
        setTimeout(() => {
            alert("Email verification check complete. Ready to proceed to Step 2 (Company Details).");
            btn.innerText = "Next";
            btn.disabled = false;
            // window.location.href = 'join-step2.html'; // Uncomment this when you build the next page!
        }, 1000);
    }
  </script>
