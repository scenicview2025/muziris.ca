<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Muziris | Official Catalogue</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Lato:wght@300;400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <style>
        :root { 
            --gold: #D4AF37; 
            --dark: #111111;
            --grey: #555555;
            --light-grey: #f9f9f9;
            --border: #eeeeee;
        }
        
        body { 
            margin: 0; 
            font-family: 'Lato', sans-serif; 
            background: #ffffff; 
            color: var(--dark); 
            line-height: 1.6; 
            -webkit-font-smoothing: antialiased;
        }
        
        /* 📖 EDITORIAL HEADER */
        header { 
            padding: 50px 20px 30px; 
            text-align: center; 
            background: #ffffff;
            border-bottom: 2px solid var(--gold); 
        }
        .logo { 
            font-family: 'Cinzel', serif; 
            font-size: 42px; 
            color: var(--dark); 
            letter-spacing: 8px; 
            text-transform: uppercase; 
            margin-bottom: 10px; 
        }
        .supplier-name { 
            font-size: 14px; 
            color: var(--grey); 
            text-transform: uppercase; 
            letter-spacing: 4px; 
        }

        .container { max-width: 1000px; margin: 0 auto; padding: 40px 20px; }
        
        /* 🛠️ ACTION TOOLBAR */
        .toolbar { 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            background: var(--light-grey);
            border: 1px solid var(--border); 
            padding: 15px 25px; 
            border-radius: 4px;
            margin-bottom: 60px; 
        }
        .toolbar-group { display: flex; gap: 15px; }
        .action-btn {
            background: #ffffff;
            border: 1px solid #ccc;
            color: var(--dark);
            padding: 10px 20px;
            font-family: 'Lato', sans-serif;
            font-size: 12px;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 1px;
            cursor: pointer;
            border-radius: 4px;
            transition: 0.3s;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .action-btn:hover { border-color: var(--gold); color: var(--gold); }
        .btn-primary { background: var(--gold); color: #fff; border-color: var(--gold); }
        .btn-primary:hover { background: var(--dark); border-color: var(--dark); color: #fff; }
        
        .currency-badge { font-weight: bold; color: var(--grey); font-size: 14px; }

        /* ✨ ALTERNATING EDITORIAL LAYOUT */
        .catalogue-list { display: flex; flex-direction: column; gap: 80px; }
        
        .product-row { 
            display: flex; 
            align-items: center; 
            gap: 60px; 
            padding-bottom: 80px;
            border-bottom: 1px solid var(--border);
        }
        
        /* Magic CSS to make every 2nd row flip directions! */
        .product-row:nth-child(even) { flex-direction: row-reverse; }
        
        .product-image { 
            flex: 1; 
            text-align: center; 
            background: #fff;
            padding: 20px;
        }
        .product-image img { 
            max-width: 100%; 
            max-height: 450px; 
            object-fit: contain; 
            filter: drop-shadow(0 15px 25px rgba(0,0,0,0.05));
        }
        
        .product-details { flex: 1; }
        .p-cat { font-size: 11px; color: var(--gold); text-transform: uppercase; letter-spacing: 2px; margin-bottom: 10px; font-weight: bold; }
        .p-name { font-family: 'Cinzel', serif; font-size: 28px; color: var(--dark); margin: 0 0 15px 0; line-height: 1.2; }
        .p-desc { font-size: 14px; color: var(--grey); margin-bottom: 30px; line-height: 1.8; }
        
        .p-id-box { 
            display: inline-block;
            background: var(--light-grey); 
            border: 1px dashed #ccc; 
            padding: 8px 15px; 
            font-family: 'Courier New', monospace; 
            font-size: 13px; 
            color: var(--dark);
            margin-bottom: 25px;
        }
        
        .p-price-box { display: flex; align-items: center; gap: 20px; }
        .p-price { font-size: 24px; color: var(--dark); font-weight: bold; }
        .p-price span { font-size: 14px; color: var(--grey); font-weight: normal; margin-right: 5px; }

        /* Status States */
        #loading, #empty { text-align: center; padding: 100px 20px; color: var(--grey); font-size: 14px; letter-spacing: 1px; text-transform: uppercase; }
        #empty { display: none; }

        /* 🖨️ PDF PRINT STYLES (Triggers when user hits Download PDF) */
        @media print {
            body { background: #fff; -webkit-print-color-adjust: exact; }
            .no-print { display: none !important; } /* Hides buttons on the PDF */
            .container { padding: 0; max-width: 100%; }
            .product-row { 
                page-break-inside: avoid; /* Prevents splitting a product across two pages */
                border-bottom: 1px solid #ddd; 
                padding-bottom: 40px; 
                margin-bottom: 40px; 
                gap: 30px;
            }
            .product-image img { max-height: 350px; box-shadow: none; filter: none; }
            header { padding: 30px 0; border-bottom: 2px solid var(--gold); margin-bottom: 40px; }
        }
    </style>
</head>
<body>

    <header>
        <div class="logo">Muziris</div>
        <div class="supplier-name" id="display-supplier-name">Official Product Catalogue</div>
    </header>

    <div class="container">
        
        <div class="toolbar no-print">
            <div class="currency-badge" id="currency-badge">CAD</div>
            <div class="toolbar-group">
                <button class="action-btn" onclick="shareCatalogue()">
                    <i class="fas fa-link"></i> Copy Link
                </button>
                <button class="action-btn btn-primary" onclick="downloadPDF()">
                    <i class="fas fa-file-pdf"></i> Download PDF
                </button>
            </div>
        </div>

        <div id="loading"><i class="fas fa-circle-notch fa-spin" style="margin-right:10px; color:var(--gold);"></i> Generating Document...</div>
        
        <div id="empty">
            <i class="fas fa-box-open" style="font-size: 32px; margin-bottom: 20px; color:#ccc;"></i><br>
            This catalogue currently has no public items.
        </div>

        <div class="catalogue-list" id="product-grid"></div>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const supplierId = urlParams.get('supplier');
        const buyerCurrency = urlParams.get('buyCur') || 'CAD'; 
        
        const API_BASE = "https://muziris-api.onrender.com/api";

        async function initShowroom() {
            if (!supplierId) {
                document.getElementById('loading').innerHTML = "Invalid Document Link.";
                return;
            }

            document.getElementById('currency-badge').innerText = `PRICING: ${buyerCurrency}`;

            try {
                const res = await fetch(`${API_BASE}/public-catalog`, { method: 'POST' });
                const data = await res.json();
                const products = data.products.filter(p => p.supplierId === supplierId);

                const rateRes = await fetch(`${API_BASE}/negotiation-data`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ productId: products.length > 0 ? products[0].id : '' })
                });
                const rateData = await rateRes.json();
                const exchangeRate = rateData.rates[buyerCurrency] || 1;

                renderProducts(products, exchangeRate);
            } catch (e) {
                console.error(e);
                document.getElementById('loading').innerHTML = "Error loading document. Please try again.";
            }
        }

        function renderProducts(products, rate) {
            const grid = document.getElementById('product-grid');
            const loading = document.getElementById('loading');
            loading.style.display = 'none';

            if (products.length === 0) {
                document.getElementById('empty').style.display = 'block';
                return;
            }

            if (products[0].companyName) {
                document.getElementById('display-supplier-name').innerText = products[0].companyName + " | Catalogue";
                document.title = `${products[0].companyName} - Muziris Catalogue`;
            }

            products.forEach(p => {
                let priceInCAD = p.startingPriceCAD || 0; 
                let convertedPrice = (priceInCAD * rate).toFixed(2);
                let priceDisplay = priceInCAD > 0 ? `<span>${buyerCurrency}</span>${convertedPrice}` : `<span style="font-size:14px;">Contact for Quote</span>`;

                grid.innerHTML += `
                    <div class="product-row">
                        <div class="product-image">
                            <img src="${p.hero || 'https://via.placeholder.com/400'}" alt="${p.name}">
                        </div>
                        
                        <div class="product-details">
                            <div class="p-cat">${p.category} &rsaquo; ${p.subCategory}</div>
                            <h2 class="p-name">${p.name}</h2>
                            <div class="p-id-box"><i class="fas fa-barcode" style="color:var(--gold); margin-right:5px;"></i> REF: ${p.id}</div>
                            <p class="p-desc">${p.desc || 'Premium grade wholesale manufacturing. Contact supplier via Muziris for detailed specifications, MOQs, and lead times.'}</p>
                            
                            <div class="p-price-box">
                                <div class="p-price">${priceDisplay}</div>
                                <button class="action-btn no-print" style="margin-left:auto;" onclick="copyId('${p.id}')">
                                    <i class="far fa-copy"></i> Copy ID
                                </button>
                            </div>
                        </div>
                    </div>
                `;
            });
        }

        function copyId(id) {
            navigator.clipboard.writeText(id);
            alert(`Product ID [ ${id} ] copied!\n\nPaste this into your Muziris chat to request a quote.`);
        }

        function shareCatalogue() {
            navigator.clipboard.writeText(window.location.href);
            alert("Catalogue link copied to clipboard!");
        }

        function downloadPDF() {
            // This triggers the browser's native print-to-pdf dialog
            // The @media print CSS automatically formats it beautifully!
            window.print();
        }

        window.onload = initShowroom;
    </script>
</body>
</html>
