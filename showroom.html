<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Muziris | Premium Catalogue</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Lato:wght@300;400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <style>
        :root { 
            --gold: #D4AF37; 
            --void: #080a0f; 
            --slate: #151922; 
            --mist: #e0e0e0;
        }
        
        body { 
            margin: 0; 
            font-family: 'Lato', sans-serif; 
            background: var(--void); 
            color: var(--mist); 
            line-height: 1.6; 
            -webkit-font-smoothing: antialiased;
        }
        
        /* 📖 EDITORIAL HEADER */
        header { 
            padding: 60px 20px 40px; 
            text-align: center; 
            background: linear-gradient(to bottom, var(--slate) 0%, var(--void) 100%);
            border-bottom: 1px solid rgba(212, 175, 55, 0.2); 
        }
        .logo { 
            font-family: 'Cinzel', serif; 
            font-size: 36px; 
            color: var(--gold); 
            letter-spacing: 6px; 
            text-transform: uppercase; 
            margin-bottom: 10px; 
        }
        .supplier-name { 
            font-size: 12px; 
            color: #888; 
            text-transform: uppercase; 
            letter-spacing: 4px; 
        }

        /* 📋 CATALOGUE LAYOUT */
        .container { max-width: 1400px; margin: 0 auto; padding: 40px 20px; }
        
        .toolbar { 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            border-bottom: 1px solid #222; 
            padding-bottom: 20px; 
            margin-bottom: 40px; 
        }
        .instruction { font-size: 13px; color: #aaa; letter-spacing: 1px; }
        .currency-badge { 
            font-family: 'Cinzel', serif;
            font-size: 14px; 
            color: var(--gold); 
            border: 1px solid var(--gold); 
            padding: 8px 20px; 
            border-radius: 2px;
            letter-spacing: 1px;
        }

        /* ✨ THE LOOKBOOK GRID */
        .catalogue-grid { 
            display: grid; 
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); 
            gap: 50px 30px; 
        }
        
        .product-item { group; cursor: pointer; }
        
        /* Image Frame */
        .img-frame { 
            position: relative; 
            width: 100%; 
            aspect-ratio: 4 / 5; /* Magazine portrait style */
            background: #ffffff; /* White background makes product pop */
            overflow: hidden;
            border-radius: 4px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
        }
        .img-frame img { 
            width: 100%; 
            height: 100%; 
            object-fit: contain; 
            padding: 20px;
            box-sizing: border-box;
            transition: transform 0.7s ease;
        }
        
        /* The Hover Overlay */
        .overlay {
            position: absolute;
            inset: 0;
            background: rgba(11, 14, 20, 0.85);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            opacity: 0;
            transition: opacity 0.4s ease;
            backdrop-filter: blur(2px);
        }
        
        /* Hover Animations */
        .product-item:hover .overlay { opacity: 1; }
        .product-item:hover .img-frame img { transform: scale(1.05); }
        
        /* ID Badge */
        .id-badge {
            position: absolute;
            top: 15px;
            left: 15px;
            background: rgba(0,0,0,0.8);
            color: var(--gold);
            padding: 5px 10px;
            font-size: 10px;
            font-family: 'Courier New', monospace;
            letter-spacing: 1px;
            border: 1px solid var(--gold);
            z-index: 2;
        }

        /* Action Button */
        .copy-btn { 
            background: var(--gold); 
            color: #000; 
            border: none; 
            padding: 15px 30px; 
            font-family: 'Cinzel', serif;
            font-size: 12px; 
            font-weight: bold; 
            cursor: pointer; 
            text-transform: uppercase; 
            letter-spacing: 2px;
            transform: translateY(20px);
            transition: all 0.4s ease;
        }
        .product-item:hover .copy-btn { transform: translateY(0); }
        .copy-btn:hover { background: #fff; }

        /* Typography Below Image */
        .info-panel { padding-top: 20px; text-align: center; }
        .p-cat { font-size: 10px; color: #888; text-transform: uppercase; letter-spacing: 2px; margin-bottom: 8px; }
        .p-name { font-family: 'Cinzel', serif; font-size: 18px; color: #fff; margin: 0 0 10px 0; font-weight: normal; letter-spacing: 1px; }
        .p-price { font-size: 16px; color: var(--gold); font-weight: bold; letter-spacing: 1px; }
        .p-price span { font-size: 11px; color: #888; margin-right: 5px; font-weight: normal; }

        /* Status States */
        #loading, #empty { text-align: center; padding: 100px 20px; color: #666; font-size: 14px; letter-spacing: 1px; text-transform: uppercase; }
        #empty { display: none; }
    </style>
</head>
<body>

    <header>
        <div class="logo">Muziris</div>
        <div class="supplier-name" id="display-supplier-name">Verified Partner Catalogue</div>
    </header>

    <div class="container">
        <div class="toolbar">
            <div class="instruction"><i class="fas fa-info-circle" style="color:var(--gold); margin-right:8px;"></i> Hover over an item to copy its Product ID for your chat.</div>
            <div class="currency-badge" id="currency-badge">CAD</div>
        </div>

        <div id="loading"><i class="fas fa-circle-notch fa-spin" style="margin-right:10px; color:var(--gold);"></i> Curating Collection...</div>
        
        <div id="empty">
            <i class="fas fa-gem" style="font-size: 32px; margin-bottom: 20px; color:#333;"></i><br>
            This partner currently has no other public items in their collection.
        </div>

        <div class="catalogue-grid" id="product-grid"></div>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const supplierId = urlParams.get('supplier');
        const buyerCurrency = urlParams.get('buyCur') || 'CAD'; 
        
        const API_BASE = "https://muziris-api.onrender.com/api";

        async function initShowroom() {
            if (!supplierId) {
                document.getElementById('loading').innerHTML = "Invalid Collection Link.";
                return;
            }

            document.getElementById('currency-badge').innerText = `PRICING IN ${buyerCurrency}`;

            try {
                // 1. Fetch the entire live public catalog
                const res = await fetch(`${API_BASE}/public-catalog`, { method: 'POST' });
                const data = await res.json();

                // 2. Filter out ONLY the products that belong to this specific supplier
                const products = data.products.filter(p => p.supplierId === supplierId);

                // 3. Fetch Live Exchange Rates
                const rateRes = await fetch(`${API_BASE}/negotiation-data`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ productId: products.length > 0 ? products[0].id : '' })
                });
                const rateData = await rateRes.json();
                const exchangeRate = rateData.rates[buyerCurrency] || 1;

                renderProducts(products, exchangeRate);
            } catch (e) {
                console.error(e);
                document.getElementById('loading').innerHTML = "Error loading collection. Please try again later.";
            }
        }

        function renderProducts(products, rate) {
            const grid = document.getElementById('product-grid');
            const loading = document.getElementById('loading');
            loading.style.display = 'none';

            if (products.length === 0) {
                document.getElementById('empty').style.display = 'block';
                return;
            }

            if (products[0].companyName) {
                document.getElementById('display-supplier-name').innerText = "Collection by " + products[0].companyName;
            }

            products.forEach(p => {
                let priceInCAD = p.startingPriceCAD || 0; 
                let convertedPrice = (priceInCAD * rate).toFixed(2);

                let priceDisplay = priceInCAD > 0 ? `<span>${buyerCurrency}</span> ${convertedPrice}` : `<span style="font-size:11px;">CONTACT FOR QUOTE</span>`;

                grid.innerHTML += `
                    <div class="product-item">
                        <div class="img-frame">
                            <div class="id-badge">${p.id}</div>
                            <img src="${p.hero || 'https://via.placeholder.com/300'}" alt="${p.name}">
                            
                            <div class="overlay">
                                <button class="copy-btn" onclick="copyId('${p.id}')">
                                    <i class="far fa-copy" style="margin-right: 8px;"></i> Copy ID
                                </button>
                                <div style="color:#aaa; font-size:11px; margin-top:15px; letter-spacing:1px; max-width:80%; text-align:center;">
                                    Paste this ID into the chat to request a quote.
                                </div>
                            </div>
                        </div>
                        
                        <div class="info-panel">
                            <div class="p-cat">${p.category} &rsaquo; ${p.subCategory}</div>
                            <h3 class="p-name">${p.name}</h3>
                            <div class="p-price">${priceDisplay}</div>
                        </div>
                    </div>
                `;
            });
        }

        function copyId(id) {
            navigator.clipboard.writeText(id);
            alert(`Item ID [ ${id} ] copied to clipboard.\n\nReturn to the Negotiation Hub and paste this ID into the chat!`);
        }

        window.onload = initShowroom;
    </script>
</body>
</html>
