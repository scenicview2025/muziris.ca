<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Muziris | Edit Insight</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        :root { --bg-main: #0b0e14; --bg-panel: #151922; --gold: #D4AF37; --gold-hover: #c19b2e; --text-main: #e0e0e0; --text-muted: #888; --border: #2a2f3a; }
        body { margin: 0; font-family: 'Segoe UI', Tahoma, Geneva, sans-serif; background-color: var(--bg-main); color: var(--text-main); padding: 30px; }
        
        .header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border); padding-bottom: 20px; margin-bottom: 30px; max-width: 1000px; margin-left: auto; margin-right: auto; }
        .header h1 { color: var(--gold); margin: 0; font-weight: 300; font-size: 24px; }
        
        .panel { background: var(--bg-panel); padding: 30px; border: 1px solid var(--border); border-radius: 12px; max-width: 1000px; margin: 0 auto; box-shadow: 0 4px 15px rgba(0,0,0,0.2); margin-bottom: 30px; }
        
        .input-group { margin-bottom: 20px; }
        .input-group label { display: block; font-size: 11px; color: var(--text-muted); margin-bottom: 6px; text-transform: uppercase; letter-spacing: 0.5px; font-weight: bold; }
        .input-group input[type="text"], .input-group textarea { width: 100%; padding: 12px; background: rgba(0,0,0,0.2); border: 1px solid var(--border); color: #fff; border-radius: 6px; box-sizing: border-box; font-family: inherit; transition: 0.3s; }
        .input-group input:focus, .input-group textarea:focus { border-color: var(--gold); outline: none; }
        
        /* File Input Styling */
        .file-upload-wrapper { display: flex; gap: 10px; align-items: center; }
        .file-upload-wrapper input[type="file"] { flex: 1; padding: 10px; background: rgba(0,0,0,0.2); border: 1px dashed #555; color: #aaa; border-radius: 6px; font-size: 13px; }
        .btn-upload { background: #1E88E5; color: white; border: none; padding: 12px 20px; border-radius: 6px; cursor: pointer; font-weight: bold; font-size: 13px; transition: 0.2s; white-space: nowrap; }
        .btn-upload:hover { background: #1565C0; }
        .btn-upload:disabled { background: #555; cursor: not-allowed; }

        .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
        
        .btn-gold { background-color: var(--gold); color: #000; padding: 15px 20px; border: none; font-weight: bold; width: 100%; cursor: pointer; border-radius: 6px; text-transform: uppercase; font-size: 14px; letter-spacing: 1px; margin-top: 20px; display: flex; align-items: center; justify-content: center; gap: 10px; transition: 0.2s; }
        .btn-gold:hover { background: var(--gold-hover); }
        .btn-gold:disabled { background-color: #555; color: #888; cursor: not-allowed; }
        
        .instructions { font-size: 13px; color: var(--text-muted); margin-bottom: 25px; padding: 15px; background: rgba(255,152,0,0.05); border-left: 3px solid #ff9800; }
        
        #currentImagePreview { max-width: 200px; border-radius: 6px; margin-top: 10px; border: 1px solid var(--border); display: none; }
    </style>
</head>
<body>

    <div class="header">
        <h1>Edit Insight</h1>
        <button onclick="window.location.href='https://muziris.ca/blog-admin.html'" style="background:transparent; color:#fff; border:1px solid var(--border); padding:8px 15px; border-radius:4px; cursor:pointer; font-weight:bold; font-size:13px;">Cancel & Return to CMS</button>
    </div>

    <div class="panel" id="editorPanel" style="opacity: 0.5; pointer-events: none;">
        <div class="instructions" id="statusMessage">
            <i class="fas fa-circle-notch fa-spin mr-2"></i> Loading article data from database...
        </div>

        <div class="grid-2">
            <div class="input-group">
                <label>Category (Overline Text)</label>
                <input type="text" id="blogCategory">
            </div>
            <div class="input-group">
                <label>SEO Keywords</label>
                <input type="text" id="blogSeo">
            </div>
        </div>

        <div class="input-group">
            <label>Article Title (Main Headline)</label>
            <input type="text" id="blogTitle">
        </div>

        <div class="grid-2">
            <div class="input-group">
                <label>Author Name</label>
                <input type="text" id="blogAuthor">
            </div>
            <div class="input-group">
                <label>Publish Month & Year</label>
                <input type="text" id="blogDate">
            </div>
        </div>

        <div class="input-group">
            <label>Hero Image (Leave blank to keep current image)</label>
            <div class="file-upload-wrapper">
                <input type="file" id="imageUploadFile" accept="image/*">
                <button type="button" id="uploadBtn" class="btn-upload" onclick="uploadBlogImage()">☁️ Replace Image</button>
            </div>
            <div id="uploadStatus" style="font-size: 12px; color: #4CAF50; margin-top: 8px; display: none;">✅ New image securely resized and uploaded!</div>
            <img id="currentImagePreview" src="" alt="Current Hero Image">
            <input type="hidden" id="blogImage">
        </div>

        <div class="input-group">
            <label>Article Body Content (HTML formatting accepted)</label>
            <textarea id="blogContent" rows="15"></textarea>
        </div>

        <button class="btn-gold" id="updateBtn" onclick="updateArticle()">💾 Save Changes to Live Site</button>
    </div>

    <script>
        const API_BASE_URL = "https://muziris-api.onrender.com/api";
        
        // Extract the ID from the URL
        const urlParams = new URLSearchParams(window.location.search);
        const blogId = urlParams.get('id');

        // --- 1. LOAD EXISTING BLOG DATA ---
        document.addEventListener("DOMContentLoaded", async () => {
            if(!blogId) {
                document.getElementById('statusMessage').innerHTML = '❌ Error: No Article ID provided in URL.';
                return;
            }

            try {
                // Fetch all blogs, then find the one that matches this ID
                const response = await fetch(`${API_BASE_URL}/blogs`);
                const data = await response.json();
                
                if (data.success) {
                    const blog = data.blogs.find(b => b.id.toString() === blogId);
                    
                    if(blog) {
                        // Populate the fields
                        document.getElementById('blogCategory').value = blog.category || '';
                        document.getElementById('blogSeo').value = blog.seo_keywords || '';
                        document.getElementById('blogTitle').value = blog.title || '';
                        document.getElementById('blogAuthor').value = blog.author || '';
                        document.getElementById('blogDate').value = blog.publish_date || '';
                        document.getElementById('blogContent').value = blog.content || '';
                        
                        document.getElementById('blogImage').value = blog.image_url || '';
                        if(blog.image_url) {
                            const imgPreview = document.getElementById('currentImagePreview');
                            imgPreview.src = blog.image_url;
                            imgPreview.style.display = 'block';
                        }

                        // Unlock the panel
                        document.getElementById('editorPanel').style.opacity = '1';
                        document.getElementById('editorPanel').style.pointerEvents = 'auto';
                        document.getElementById('statusMessage').innerHTML = '<strong>Edit Mode:</strong> Make your changes and click Save. Leave the image field blank to keep the existing hero image.';
                    } else {
                        document.getElementById('statusMessage').innerHTML = '❌ Error: Article not found in database.';
                    }
                }
            } catch (err) {
                document.getElementById('statusMessage').innerHTML = '❌ Error connecting to database.';
            }
        });

        // --- 2. IMAGE UPLOAD LOGIC (With Auto-Compress) ---
        async function uploadBlogImage() {
            const fileInput = document.getElementById('imageUploadFile');
            if(fileInput.files.length === 0) return alert("Please choose a new image file first.");
            
            const btn = document.getElementById('uploadBtn');
            btn.innerText = "⏳ Resizing...";
            btn.disabled = true;

            const file = fileInput.files[0];
            const reader = new FileReader();
            
            reader.onload = (event) => {
                const img = new Image();
                img.src = event.target.result;
                
                img.onload = async () => {
                    const MAX_WIDTH = 1600;
                    const MAX_HEIGHT = 1600;
                    let width = img.width;
                    let height = img.height;

                    if (width > height && width > MAX_WIDTH) {
                        height *= MAX_WIDTH / width;
                        width = MAX_WIDTH;
                    } else if (height > MAX_HEIGHT) {
                        width *= MAX_HEIGHT / height;
                        height = MAX_HEIGHT;
                    }

                    const canvas = document.createElement('canvas');
                    canvas.width = width;
                    canvas.height = height;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0, width, height);

                    const dataUrl = canvas.toDataURL('image/jpeg', 0.8);
                    const base64Data = dataUrl.split(',')[1];
                    
                    try {
                        const res = await fetch(`${API_BASE_URL}/upload-media`, {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({
                                supplierId: 'editorial_blog',
                                fileName: file.name.replace(/\.[^/.]+$/, "") + ".jpg", 
                                mimeType: 'image/jpeg',
                                fileData: base64Data
                            })
                        });
                        
                        const data = await res.json();
                        
                        if(data.success) {
                            document.getElementById('blogImage').value = data.url; 
                            
                            const imgPreview = document.getElementById('currentImagePreview');
                            imgPreview.src = data.url;
                            imgPreview.style.display = 'block';

                            document.getElementById('uploadStatus').style.display = 'block';
                            btn.innerText = "✅ Replaced";
                        } else {
                            alert("Upload failed: " + data.error);
                            btn.innerText = "☁️ Replace Image";
                            btn.disabled = false;
                        }
                    } catch (e) {
                        alert("Upload error: " + e.message);
                        btn.innerText = "☁️ Replace Image";
                        btn.disabled = false;
                    }
                };
            };
            reader.readAsDataURL(file);
        }

        // --- 3. UPDATE ARTICLE LOGIC ---
        async function updateArticle() {
            const title = document.getElementById('blogTitle').value;
            const category = document.getElementById('blogCategory').value;
            const seo_keywords = document.getElementById('blogSeo').value;
            const author = document.getElementById('blogAuthor').value;
            const publish_date = document.getElementById('blogDate').value;
            const image_url = document.getElementById('blogImage').value; 
            const content = document.getElementById('blogContent').value;

            if(!title || !content) return alert("Stop: Title and Article Body are strictly required.");

            const wordCount = content.replace(/<[^>]*>?/gm, '').split(/\s+/).length;
            const calcReadTime = Math.max(1, Math.ceil(wordCount / 200)) + " Min Read";

            const btn = document.getElementById('updateBtn');
            btn.disabled = true;
            btn.innerText = "⏳ Synchronizing with Database...";

            const payload = { title, category, author, read_time: calcReadTime, publish_date, seo_keywords, image_url, content };

            try {
                // IMPORTANT: Your backend needs to support PUT requests for this to work.
                // Assuming it does:
                const response = await fetch(`${API_BASE_URL}/blogs/${blogId}`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                
                const data = await response.json();

                if (data.success) {
                    alert("✅ Article updated successfully!");
                    window.location.href = 'https://muziris.ca/blog-admin.html'; // Send them back to the dashboard
                } else {
                    throw new Error(data.error || "Database rejection.");
                }
            } catch (error) {
                alert("CMS Error: Failed to push to Render database. Details: " + error.message);
            } finally {
                btn.disabled = false;
                btn.innerText = "💾 Save Changes to Live Site";
            }
        }
    </script>
</body>
</html>
